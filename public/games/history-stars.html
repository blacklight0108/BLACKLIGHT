<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>群星 · 猜历史人物</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html[data-theme="dark"]{
  --bg:#070a10;--bg2:#0b1018;--panel:#101724;--panel2:#151d2c;--panel3:#1b2434;
  --line:#202b3d;--line2:#2b384d;--tx:#e9eff8;--tx2:#8ea0b8;--tx3:#5a6980;
  --sea:#080d15;--land:#151c28;--landb:#1d2735;
  --gold:#e3b25a;--gold2:#f7dc9b;--acc:#4fd1c5;--ok:#4ade80;--no:#f87171;--warn:#fbbf24;
  --sh:0 10px 30px rgba(0,0,0,.5);
}
html[data-theme="light"]{
  --bg:#f4f1e8;--bg2:#fffdf7;--panel:#fffefb;--panel2:#f7f3e9;--panel3:#efe9db;
  --line:#e4ddca;--line2:#d5ccb5;--tx:#1d222b;--tx2:#5a6472;--tx3:#948d7e;
  --sea:#e6eff6;--land:#dfd8c4;--landb:#d2c9b1;
  --gold:#b8842a;--gold2:#8a6210;--acc:#2b8b80;--ok:#15803d;--no:#c0392b;--warn:#a16207;
  --sh:0 8px 24px rgba(60,50,30,.12);
}
body{
  background:
    radial-gradient(1100px 620px at 78% -8%,rgba(227,178,90,.09),transparent 62%),
    radial-gradient(900px 520px at 8% 108%,rgba(79,209,197,.07),transparent 60%),
    var(--bg);
  color:var(--tx);min-height:100vh;
  font:15px/1.6 system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1560px;margin:0 auto;padding:14px 16px 40px}

/* ============ 顶栏 ============ */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{
  font:700 25px/1 Georgia,"Songti SC","Noto Serif CJK SC",serif;letter-spacing:.14em;
  background:linear-gradient(96deg,var(--gold2),var(--gold) 55%,var(--acc));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand i{font-style:normal;font-size:12.5px;color:var(--tx3);letter-spacing:.22em}
.tstats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.pill{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:5px 11px;font-size:12.5px;color:var(--tx2);white-space:nowrap;
  display:flex;align-items:center;gap:6px
}
.pill b{color:var(--gold);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pill.acc b{color:var(--acc)}
.iconbtn{
  background:var(--panel);border:1px solid var(--line);color:var(--tx);
  width:38px;height:34px;border-radius:10px;cursor:pointer;font-size:15px;transition:.18s
}
.iconbtn:hover{border-color:var(--gold);transform:translateY(-1px)}

/* ============ 布局 ============ */
.grid{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:1060px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}

/* ============ 猜题面板 ============ */
.game{padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.game::before{
  content:"";position:absolute;inset:0 0 auto;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),var(--acc),transparent);opacity:.6
}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qno{font-size:11px;letter-spacing:.2em;color:var(--tx3);text-transform:uppercase}
.badge{
  font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--line2);
  color:var(--tx2);background:var(--panel2)
}
.badge.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.bar{height:5px;border-radius:4px;background:var(--panel3);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(90deg,var(--gold),var(--acc))}
.clues{list-style:none;display:flex;flex-direction:column;gap:7px;min-height:60px}
.clues li{
  display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:11px;
  background:var(--panel2);border:1px solid var(--line);font-size:13.5px;line-height:1.55;
  animation:cin .42s cubic-bezier(.2,.9,.25,1) both
}
.clues li .k{
  flex:0 0 50px;font-size:11px;color:var(--gold);letter-spacing:.06em;padding-top:2px;
  border-right:1px solid var(--line2);padding-right:8px;font-weight:600
}
@keyframes cin{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.clues li.locked{color:var(--tx3);background:transparent;border-style:dashed;font-size:12.5px}
.row{display:flex;gap:8px}
.btn{
  border:1px solid var(--line2);background:var(--panel2);color:var(--tx);border-radius:11px;
  padding:10px 14px;font-size:13.5px;cursor:pointer;transition:.18s;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:7px
}
.btn:hover:not(:disabled){border-color:var(--gold);background:var(--panel3)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{
  background:linear-gradient(96deg,var(--gold),#c8912f);color:#160f02;border-color:transparent;font-weight:700
}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn em{font-style:normal;font-size:11px;opacity:.72}
#hintBtn{width:100%}
.guessbox{position:relative}
.guessbox input{
  width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--tx);font-size:15px;font-family:inherit;outline:none;transition:.18s
}
.guessbox input:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 16%,transparent)}
.fb{font-size:13px;border-radius:11px;padding:0;max-height:0;overflow:hidden;transition:.3s;line-height:1.6}
.fb.on{max-height:320px;padding:11px 13px;border:1px solid var(--line2);background:var(--panel2)}
.fb .tagline{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tg{font-size:11.5px;padding:2px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--tx2)}
.tg.y{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 42%,transparent)}
.tg.n{color:var(--no);border-color:color-mix(in srgb,var(--no) 38%,transparent)}
.tg.m{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 38%,transparent)}
.solved .fb{max-height:400px;padding:11px 13px;border:1px solid color-mix(in srgb,var(--ok) 42%,transparent);background:color-mix(in srgb,var(--ok) 9%,var(--panel2))}

/* 揭晓卡 */
.reveal{display:none}
.reveal.on{display:block;animation:cin .45s both}
.rv-top{display:flex;align-items:flex-start;gap:11px;margin-bottom:10px}
.rv-flag{
  flex:0 0 46px;height:46px;border-radius:12px;display:grid;place-items:center;
  font-size:19px;font-weight:800;color:#160f02;background:linear-gradient(135deg,var(--gold),var(--acc))
}
.rv-name{font:700 21px/1.25 Georgia,"Songti SC",serif;letter-spacing:.03em}
.rv-sub{font-size:12.5px;color:var(--tx2);margin-top:3px}
.rv-facts{display:grid;gap:6px;margin-top:4px}
.fact{display:flex;gap:9px;font-size:13.2px;line-height:1.55;padding:7px 0;border-top:1px solid var(--line)}
.fact .fk{flex:0 0 48px;color:var(--gold);font-size:11.5px;padding-top:3px;font-weight:600}
.fact .fv{color:var(--tx);flex:1}
.rv-score{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
.rank{font:700 13px;padding:4px 12px;border-radius:20px;background:var(--panel3);border:1px solid var(--line2);color:var(--gold)}

/* ============ 地图面板 ============ */
.mapcard{padding:14px;display:flex;flex-direction:column;gap:11px}
.maphead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.maphead h2{font:600 15px/1 Georgia,"Songti SC",serif;letter-spacing:.1em;color:var(--tx)}
.maphead .sp{margin-left:auto;font-size:12px;color:var(--tx3)}
.mapbox{
  position:relative;width:100%;aspect-ratio:1000/501;border-radius:14px;overflow:hidden;
  background:radial-gradient(120% 150% at 50% 0%,color-mix(in srgb,var(--sea) 92%,var(--acc) 8%),var(--sea));
  border:1px solid var(--line)
}
.mapbox svg{display:block;width:100%;height:100%}
.cty{
  fill:var(--land);stroke:var(--landb);stroke-width:.5;
  opacity:0;animation:fadein .8s ease forwards;transition:fill .75s ease,stroke .75s ease;
  cursor:default
}
.grat{fill:none;stroke:color-mix(in srgb,var(--tx3) 34%,transparent);stroke-width:.5;stroke-dasharray:2.5 6;
  opacity:0;animation:fadein 1.3s .25s ease forwards}
#labels[data-dense="1"] .nm{font-size:9.5px;padding:0 5px}
#labels[data-dense="2"] .nm{font-size:8.5px;padding:0 4px;opacity:.92}
#labels[data-tiny="1"] .nm{font-size:7.5px;padding:0 3px;border-radius:6px;letter-spacing:0}
#lead{pointer-events:none}
#lead line{stroke:color-mix(in srgb,var(--gold) 48%,transparent);stroke-width:.9;stroke-dasharray:2 2.6}
.cty.play{cursor:pointer}
@keyframes fadein{to{opacity:1}}
.cty.lit{stroke:color-mix(in srgb,var(--tx) 42%,transparent);stroke-width:.85}
.cty.glow{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--gold) 62%,transparent))}
.cty.hot:hover{filter:brightness(1.22)}

#labels{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer}
.lbi{display:flex;flex-direction:column;gap:2px;align-items:center;animation:lbpop .55s cubic-bezier(.2,1.3,.4,1) both}
@keyframes lbpop{0%{opacity:0;transform:scale(.55) translateY(6px)}100%{opacity:1;transform:none}}
.nm{
  font-size:10.5px;line-height:1.45;padding:1px 7px;border-radius:9px;white-space:nowrap;
  background:color-mix(in srgb,var(--bg) 74%,transparent);
  border:1px solid color-mix(in srgb,var(--gold) 42%,transparent);
  color:var(--gold2);backdrop-filter:blur(2px);font-weight:600;letter-spacing:.02em
}
.nm.more{color:var(--tx2);border-color:var(--line2);font-weight:500}
.nm.fresh{
  animation:nf 1.4s ease 2;
  background:linear-gradient(96deg,var(--gold),var(--acc));color:#160f02;border-color:transparent
}
@keyframes nf{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 55%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
.pulse{position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);
  border:2px solid var(--gold);animation:pl 1.05s ease-out forwards}
@keyframes pl{from{width:6px;height:6px;opacity:.95}to{width:78px;height:78px;opacity:0}}
.tip{
  position:absolute;pointer-events:none;z-index:20;background:var(--bg);border:1px solid var(--line2);
  border-radius:9px;padding:6px 10px;font-size:12px;box-shadow:var(--sh);white-space:nowrap;
  opacity:0;transition:opacity .14s;color:var(--tx)
}
.tip.on{opacity:1}
.tip b{color:var(--gold)}
.legend{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--tx3);flex-wrap:wrap}
.lg-bar{flex:1;min-width:110px;height:7px;border-radius:5px;background:linear-gradient(90deg,var(--landb),#2f6f74,#8fa14a,var(--gold))}
.mapfoot{display:flex;gap:8px;flex-wrap:wrap}

/* ============ 图鉴 ============ */
.dex{margin-top:14px;padding:14px}
.dexhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.dexhead h2{font:600 15px/1 Georgia,"Songti SC",serif;letter-spacing:.1em}
.dexlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:7px;max-height:340px;overflow:auto;padding-right:4px}
.dcard{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;background:var(--panel2);
  border:1px solid var(--line);font-size:12.5px;cursor:pointer;transition:.16s
}
.dcard:hover{border-color:var(--gold);transform:translateY(-1px)}
.dc-flag{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:800;
  color:#160f02;background:linear-gradient(135deg,var(--gold),var(--acc))}
.dc-n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc-e{font-size:11px;color:var(--tx3);white-space:nowrap}
.dexempty{color:var(--tx3);font-size:13px;padding:8px 2px}
.dexlist::-webkit-scrollbar{width:8px}
.dexlist::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}

/* ============ 弹窗 ============ */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;place-items:center;z-index:60;padding:18px;backdrop-filter:blur(3px)}
.modal.on{display:grid;animation:cin .22s both}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:16px;max-width:520px;width:100%;
  max-height:80vh;overflow:auto;padding:18px;box-shadow:var(--sh)}
.mbox h3{font:700 19px/1.3 Georgia,"Songti SC",serif;margin-bottom:4px}
.mbox .msub{font-size:12.5px;color:var(--tx2);margin-bottom:12px}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.mrow .mi{margin-left:auto;font-size:11.5px;color:var(--gold)}

/* 提示气泡 */
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
  background:var(--panel);border:1px solid var(--gold);color:var(--tx);border-radius:11px;
  padding:9px 18px;font-size:13.5px;opacity:0;transition:.28s;z-index:70;box-shadow:var(--sh);pointer-events:none
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.kbd{border:1px solid var(--line2);border-radius:5px;padding:0 5px;font-size:11px;color:var(--tx3)}

/* ============ 换档面板 ============ */
.pickg{margin-bottom:13px}
.pickg h4{font-size:11.5px;letter-spacing:.16em;color:var(--tx3);margin-bottom:7px;font-weight:600}
.pickcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.pcard{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border-radius:11px;
  background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:13px;transition:.16s;text-align:left}
.pcard:hover{border-color:var(--gold);transform:translateY(-1px)}
.pcard.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 15%,var(--panel2));color:var(--gold2);font-weight:700}
.pcard .n{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap}
.pcard.on .n{color:var(--gold)}
.badge.act{cursor:pointer}
.badge.act:hover{border-color:var(--gold);color:var(--gold)}
/* ============ 揭晓后的操作条 ============ */
.rv-act{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 11px;margin-bottom:11px;border-radius:12px;
  background:color-mix(in srgb,var(--ok) 12%,var(--panel2));border:1px solid color-mix(in srgb,var(--ok) 46%,transparent)}
.rv-act .ok{font-size:13.5px;font-weight:700;color:var(--ok)}
.rv-act .hint{font-size:11px;color:var(--tx3)}
.rv-act .btn{margin-left:auto;flex:1;min-width:126px}
@media(max-width:620px){.rv-act .btn{width:100%;margin-left:0}}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand"><b>群 星</b><i>GUESS THE <span id="brandN">0</span></i></div>
    <div class="tstats">
      <div class="pill">已猜中 <b id="sSolved">0</b> / <span id="sTotal">0</span></div>
      <div class="pill acc">总分 <b id="sScore">0</b></div>
      <div class="pill">点亮国家 <b id="sCountry">0</b> / <span id="sCountryAll">0</span></div>
      <div class="pill">最佳 <b id="sBest">—</b></div>
      <button class="iconbtn" id="themeBtn" title="切换主题">🌗</button>
      <button class="iconbtn" id="modeBtn" title="切换时代 / 领域">🎯</button>
      <button class="iconbtn" id="resetBtn" title="重新开始">↺</button>
    </div>
  </div>

  <div class="grid">
    <!-- 猜题面板 -->
    <div class="card game">
      <div class="qhead">
        <span class="qno">第 <span id="qIdx">1</span> 位</span>
        <span class="badge" id="qRegion">—</span>
        <span class="badge act" id="qMode" title="点击切换时代 / 领域">不限</span>
        <span class="badge gold" id="qHint">提示 1 / 8</span>
        <span class="badge" id="qWrong">猜错 0 次</span>
      </div>
      <div class="bar"><i id="qBar"></i></div>
      <ul class="clues" id="clues"></ul>

      <button class="btn" id="hintBtn">再要一条提示 <em>−8 分</em></button>

      <div class="guessbox"><input id="gi" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入人物名字（中文名／别名／英文名都行）"></div>
      <div class="row">
        <button class="btn primary" id="gb" style="flex:1">确认</button>
        <button class="btn ghost" id="skipBtn">放弃并揭晓</button>
      </div>
      <div class="fb" id="fb"></div>
      <div class="reveal" id="reveal"></div>
    </div>

    <!-- 世界地图 -->
    <div class="card mapcard">
      <div class="maphead">
        <h2>世 界 版 图</h2>
        <span class="sp" id="mapSp">猜中的人物会刻在他所属国家的版图上</span>
      </div>
      <div class="mapbox" id="mapbox">
        <svg id="world" viewBox="0 0 1000 501" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="labels"></div>
        <div class="tip" id="tip"></div>
      </div>
      <div class="legend">
        <span>1 人</span><span class="lg-bar"></span><span>10 人以上</span>
        <span style="margin-left:auto">点击国家可查看该国已猜中的人物</span>
      </div>
      <div class="mapfoot">
        <button class="btn ghost" id="focusBtn" style="flex:1">定位到我最近猜中的国家</button>
        <button class="btn ghost" id="clearViewBtn">收起全部名字</button>
      </div>
    </div>
  </div>

  <!-- 图鉴 -->
  <div class="card dex">
    <div class="dexhead">
      <h2>人 物 图 鉴</h2>
      <span class="badge" id="dexCount">0 位</span>
      <span class="badge" id="dexCountry">0 国</span>
      <span class="sp" style="margin-left:auto;font-size:12px;color:var(--tx3)">按国家归类 · 点击展开</span>
    </div>
    <div class="dexlist" id="dexList"><div class="dexempty">还没有猜中任何人。上面开始吧。</div></div>
  </div>
</div>

<div class="modal" id="pick"><div class="mbox" id="pickBox"></div></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

同时代","浙江余姚出身,一生被贬到过贵州龙场","思想家、军事家,还真的带兵平过叛乱","提出心即理、知行合一、致良知,开创了一个影响东亚五百年的学派","留下传习录、大学问,主张学问要在事上磨","在贵州山洞里贬谪时半夜大悟,历史上叫龙场悟道","今天职场和管理学讲师最爱搬他的知行合一四个字","他的学说后来传到日本,影响了明治维新的一批人"],"y":[1472,1529],"s":"思想·哲学"},{"n":"李时珍","a":["东璧","濒湖山人","Li Shizhen"],"c":"CHN","r":"中国","e":"1518–1593","f":"科学发明","h":["公元16世纪,明朝中后期,和伽利略、莎士比亚同时代","湖北蕲州,今天的湖北蕲春","医生兼药学家,父亲就是郎中,他自己也考过科举没中","花了二十七年编成一部药物学巨著,收药一千八百多种","那部书叫本草纲目,五十二卷,一百九十多万字,后来被译成多国文字","为了验证药性亲自上山采药、尝百草,还拿自己试曼陀罗","今天中学课本里的中药知识多半来自他那本书","本草纲目的作者,被后世称为药圣"],"y":[1518,1593],"s":"科学·技术"},{"n":"戚继光","a":["元敬","南塘","Qi Jiguang"],"c":"CHN","r":"中国","e":"1528–1588","f":"政治军事","h":["公元16世纪,明朝中后期,和张居正同时代","山东登州出身,主战场在东南沿海和北方蓟州","军事将领,自己招募训练了一支民兵","创出一种克制倭寇的阵法,十一个人一组拿着不同兵器配合,几乎每战皆胜","留下纪效新书、练兵实纪两部兵书,写得很实在","在北方修了一段长城,还把敌台改造成能放火炮的样式","今天讲抗倭、讲古代阵法,他是必提人物","他练的那支队伍叫戚家军"],"y":[1528,1588]},{"n":"张居正","a":["叔大","太岳","Zhang Juzheng"],"c":"CHN","r":"中国","e":"1525–1582","f":"政治军事","h":["公元16世纪,明朝中后期,和戚继光同时代","湖广江陵,今天的湖北荆州","内阁首辅,当了十年实际上的国家掌舵人","推行一条鞭法把赋税统一折银,还搞考成法考核各级官员","留下张太岳集和大量奏疏,主张用人不必拘资格","坐巨型轿子出行要三十二个人抬,里面还带卧室;死后被抄家,儿子被逼死","今天讲改革、讲财政史、讲明代历史,他是绕不开的人物","万历皇帝前十年由他辅政,人称张居正变法"],"y":[1525,1582]},{"n":"徐霞客","a":["弘祖","霞客","Xu Xiake"],"c":"CHN","r":"中国","e":"1587–1641","f":"探索冒险","h":["公元16到17世纪,明朝末年,和伽利略同时代","南直隶江阴,今天的江苏江阴","旅行家、地理学家,一辈子没当官,靠家里有钱到处走","用三十多年走遍大半个中国,考察岩溶地貌,还纠正了长江源头的说法","留下一部日记体游记,六十多万字,是地理学名著","最后一次出游时已经五十多岁,在云南双腿走不动了还让人抬着继续","今天驴友圈把他当祖师爷,5月19日被定为中国旅游日就是因为他的游记开篇日期","游记开头那天是癸丑之三月晦,他被称作千古奇人"],"y":[1587,1641],"s":"探险·航天"},{"n":"康熙","a":["玄烨","清圣祖","Kangxi"],"c":"CHN","r":"中国","e":"1654–1722","f":"政治军事","h":["公元17到18世纪,和牛顿、彼得大帝同时代","清朝,定都北京","皇帝,八岁登基,在位六十一年,是中国历史上在位最久的皇帝","平三藩、收台湾、抗沙俄、亲征漠北,还组织人编字典和历法","主持编成康熙字典,还让人测绘了全国地图","小时候得过天花所以被选为继承人,登基初由四位大臣辅政","今天影视剧里他是最热门的清帝之一,网友爱叫他康师傅","他孙子是乾隆,两人共同撑起一段被称作盛世的时期"],"y":[1654,1722]},{"n":"曹雪芹","a":["梦阮","雪芹","Cao Xueqin"],"c":"CHN","r":"中国","e":"约1715–约1763","f":"文学艺术","h":["公元18世纪,清朝中期,和卢梭、康德同时代","出身江宁织造世家,后来落魄住到北京西郊","小说家,祖上三代管过皇家织造,被抄家后一贫如洗","写出一部中国古典小说的顶峰之作,书里有一座大观园和一群女子","那本书前八十回是他写的,后四十回是别人补的,全书里人物有几百个","写了十年,改了五次,穷到举家食粥,书没写完就去世了","今天研究这部书成了一门专门学问,网友还爱争论宝钗和黛玉谁更适合做对象","红楼梦的作者,原名石头记"],"y":[1715,1763],"s":"文学"},{"n":"林则徐","a":["元抚","少穆","Lin Zexu"],"c":"CHN","r":"中国","e":"1785–1850","f":"政治军事","h":["公元19世纪中叶,清朝,和维多利亚女王同时代","福建侯官,今天的福州","官员,当过湖广总督、钦差大臣","在广东主持销毁收缴来的鸦片,二十多天里销毁了两百多万斤","留下大量奏折、书信和诗文,名句有苟利国家生死以岂因祸福避趋之","虎门销烟之后英国以此为借口发动战争,他成了战争的导火索也被革职流放伊犁","今天历史课本上他是近代开眼看世界的第一人","6月26日国际禁毒日和他当年销烟结束的日期有关"],"y":[1785,1850]},{"n":"曾国藩","a":["伯涵","涤生","Zeng Guofan"],"c":"CHN","r":"中国","e":"1811–1872","f":"政治军事","h":["公元19世纪,清朝晚期,和林则徐、李鸿章同时代","湖南湘乡,后来在两江总督任上去世","官员、军事统帅,出身农家,考了七次才中秀才","组建了一支地方武装平定太平天国,还推动了洋务运动的第一批工厂","留下家书、日记、奏折,家书尤为出名","打仗讲究结硬寨打呆仗,不贪快,一辈子用笨办法赢","今天机场书店里他的家书和传记卖得最好,被当成管理学和成功学教材","毛泽东和蒋介石都读过他的集子,他组建的军队叫湘军"],"y":[1811,1872]},{"n":"左宗棠","a":["季高","湘上农人","Zuo Zongtang"],"c":"CHN","r":"中国","e":"1812–1885","f":"政治军事","h":["公元19世纪,清朝晚期,和曾国藩同时代","湖南湘阴,一生事业最辉煌的一段在西北","将领、官员,三次会试落第,自称今亮","率军收复新疆,还推动设省,并在西北种了大量柳树","留下奏折文集,名句有身无半亩心忧天下","六十多岁抬着棺材出征,从沙俄支持的势力手里把新疆拿回来","今天西北那片柳树被叫做他的名字柳,网友常用左公柳讲收复新疆","谥号文襄,福建船政局也有他一份功劳"],"y":[1812,1885]},{"n":"李鸿章","a":["渐甫","少荃","Li Hongzhang"],"c":"CHN","r":"中国","e":"1823–1901","f":"政治军事","h":["公元19到20世纪,清朝晚期,和俾斯麦、慈禧同时代","安徽合肥,后来长期坐镇直隶和北洋","官员、外交家,办过淮军和北洋水师","推动洋务运动,办工厂、办电报、派留学生,却也是近代多个不平等条约的签字人","留下大量奏折和诗文,名句有丈夫只手把吴钩","一生替朝廷收拾烂摊子,有人骂他卖国,有人说他是裱糊匠","今天网上评价他两极分化,常被称作大清背锅侠","马关条约和辛丑条约上都有他的签名"],"y":[1823,1901]},{"n":"慈禧","a":["叶赫那拉氏","西太后","Empress Dowager Cixi"],"c":"CHN","r":"中国","e":"1835–1908","f":"政治军事","h":["公元19到20世纪,清朝晚期,和李鸿章、康有为同时代","满洲镶蓝旗人,一生住在紫禁城","太后,实际掌权近半个世纪","发动政变罢黜辅政大臣,三次垂帘听政","留下大量诏令,还让人重修了颐和园","向十一国宣战引来八国联军,事后又把责任推给主战派","今天影视剧里的顶级女反派专业户,网友吐槽她的排场和修园子花了海军军费","光绪皇帝的姨母兼伯母,晚清实权在她手里"],"y":[1835,1908]},{"n":"康有为","a":["广厦","南海先生","Kang Youwei"],"c":"CHN","r":"中国","e":"1858–1927","f":"思想哲学","h":["公元19到20世纪,清末民初,和梁启超是师徒","广东南海出身,主要活动在北京和广东","思想家、改革家,组织领导了公车上书","推动变法维新一百零三天,主张君主立宪","写有大同书、孔子改制考,把孔子包装成改革家","变法失败后流亡海外十六年,在海外组织保皇会,晚年主张复辟","今天历史课本上他是戊戌变法的领头人,也被吐槽晚年落伍","他的学生是梁启超,变法失败后他跑了,六君子被杀"],"y":[1858,1927],"s":"思想·哲学"},{"n":"梁启超","a":["卓如","任公","Liang Qichao"],"c":"CHN","r":"中国","e":"1873–1929","f":"思想哲学","h":["公元19到20世纪,清末民初,和康有为是师徒","广东新会出身,一生在北京、天津、日本之间奔波","思想家、学者、报人,办了多份报纸杂志","用新文体写时评影响了一整代青年,还写出中国第一部较系统的学术史著作","著有饮冰室合集,名篇有少年中国说,名句有少年强则国强","戊戌变法失败后流亡日本,在船上学会了日语,回国后又反过一次自己的老师","今天校园朗诵比赛最常出现的篇目之一就是他写的","他九个儿子都成才,其中一位是建筑学家"],"y":[1873,1929],"s":"思想·哲学"},{"n":"孙中山","a":["孙文","逸仙","Sun Yat-sen"],"c":"CHN","r":"中国","e":"1866–1925","f":"政治军事","h":["公元19到20世纪,清末民初,和慈禧、梁启超的时代重叠","广东香山,今天的广东中山,早年在美国夏威夷和香港读书","革命家、医生出身,领导了十次起义","推翻了两千多年的帝制,建立亚洲第一个共和国,提出三民主义","留下建国方略、三民主义等著作,遗嘱里有革命尚未成功同志仍须努力","一生大半时间在海外筹款,当上临时大总统四十四天就让位给袁世凯","今天两岸都尊称他,网友爱调侃他的画像和那句天下为公,地铁站名里也有他","被尊称国父,名字被用来命名了很多城市道路"],"y":[1866,1925]},{"n":"蒋介石","a":["中正","介石","Chiang Kai-shek"],"c":"CHN","r":"中国","e":"1887–1975","f":"政治军事","h":["公元20世纪,和毛泽东、罗斯福同时代","浙江奉化出身,后来退到台湾","军人、政治领袖,早年留学日本学军事","领导北伐名义上统一全国,抗战时期是中国战区最高统帅","留下大量日记和演讲集,日记被后人完整出版","曾多次下野又复出,一生离不开他那本日记和一把光头","今天网上最出名的梗是运输大队长和微操大师,还常被做成娘希匹的表情包","抗战胜利后与共产党内战失败,1949年退守台湾"],"y":[1887,1975]},{"n":"鲁迅","a":["周树人","豫才","Lu Xun"],"c":"CHN","r":"中国","e":"1881–1936","f":"文学艺术","h":["公元20世纪,从清末到民国,和孙中山同时代","浙江绍兴出身,留学日本学医后来弃医从文","作家、思想家,在北大等校教过书","中国现代文学的奠基人,第一篇白话小说就震动了文坛","著有狂人日记、阿Q正传、彷徨、朝花夕拾,还有大量杂文","在课桌上刻过一个早字,还说过我以我血荐轩辕","今天网友最爱的梗是他那句学医救不了中国人,还有网上到处出现的鲁迅名言一搜全是假的","他家百草园和三味书屋在绍兴是景点"],"y":[1881,1936],"s":"文学"},{"n":"蔡元培","a":["鹤卿","孑民","Cai Yuanpei"],"c":"CHN","r":"中国","e":"1868–1940","f":"思想哲学","h":["公元19到20世纪,清末民初,和鲁迅、孙中山同时代","浙江绍兴出身,主要在北京和上海活动","教育家,清末中过进士,又参加过革命","改革北京大学,提出思想自由、兼容并包,把一所官僚养成所变成新文化运动的摇篮","留下大量教育论著,主张五育并举","组织过暗杀团,还曾亲自试制炸药,是个拿笔的狠人","今天讲中国现代大学制度和美育,都要从他说起","他在北大请来了陈独秀、胡适、鲁迅"],"y":[1868,1940],"s":"思想·哲学"},{"n":"毛泽东","a":["润之","主席","Mao Zedong"],"c":"CHN","r":"中国","e":"1893–1976","f":"政治军事","h":["公元20世纪,和蒋介石、斯大林同时代","湖南湘潭韶山出身,后来长期在北京","革命家、诗人、军事统帅","领导了一场彻底的革命,建立了新中国,改变了整个东亚格局","著有大量政论和诗词,沁园春雪、矛盾论、实践论都在其中","从延安时期的窑洞里指挥全国战局,一生爱游泳和写诗","今天网上他的语录和诗词仍然流行,年轻人爱引用他的句子表达骨气","天安门城楼上挂着他的画像"],"y":[1893,1976]},{"n":"钱学森","a":["Qian Xuesen","Hsue-Shen Tsien"],"c":"CHN","r":"中国","e":"1911–2009","f":"科学发明","h":["公元20世纪,和爱因斯坦、冯·卡门同时代","上海出身,留学美国,后来回国","科学家、工程师,是冯·卡门的学生","中国航天事业奠基人,主持了导弹和第一颗人造卫星的研制","著有工程控制论、星际航行概论,提出过开放的复杂巨系统理论","想回国时被美方扣押五年,最后用朝鲜战争中的飞行员战俘换回来","今天网友称他为一人抵五个师,教科书里他永远站在火箭模型旁边","中国第一颗人造卫星东方红一号和他有关"],"y":[1911,2009],"s":"科学·技术"},{"n":"袁隆平","a":["Yuan Longping"],"c":"CHN","r":"中国","e":"1930–2021","f":"科学发明","h":["公元20到21世纪,当代人物","北京出生,后来一辈子在湖南和海南的田里","农学家,被称作杂交水稻之父","培育出高产的杂交水稻品种,让全球粮食产量大幅提升","留下大量育种论文和专著,还有一句我的梦想是禾下乘凉","年轻时是个游泳好手,差一点进了国家队,还拉过小提琴","今天网上称他为当代神农,每年他的诞辰和忌日都有人晒稻穗致敬","他研究的是让所有人吃饱饭的那株水稻"],"y":[1930,2021],"s":"科学·技术"},{"n":"圣德太子","a":["厩户皇子","Prince Shotoku"],"c":"JPN","r":"东亚","e":"574–622","f":"政治军事","h":["公元6到7世纪,飞鸟时代,和隋炀帝、穆罕默德同时期","日本列岛,都城在今天的奈良一带","皇族、摄政,推古天皇时期的实际掌权者","制定冠位十二阶和十七条宪法,派使节到隋朝学习,把汉字和佛教大规模引入日本","传说他亲自注释过三部佛经,还主持编了国史","传说他能同时听懂十个人的申诉而不漏一句,还据说能预知未来","今天日本纸币上曾长期印着他的头像,一万日元用过他的脸","十七条宪法和遣隋使都是他的手笔"],"y":[574,622]},{"n":"紫式部","a":["藤原香子","Murasaki Shikibu"],"c":"JPN","r":"东亚","e":"约973–1014","f":"文学艺术","h":["公元10到11世纪,日本平安时代,和宋朝的司马光差不多同时","京都,宫廷贵族圈子","宫廷女官、作家,出身中层贵族家庭","写出了被认为是世界第一部长篇小说的作品,讲一位皇子的风流一生","那部书有五十四回,近百万字,里面登场人物超过四百个","她凭一部书在日本宫廷名声大噪,还被召入宫中侍奉皇后","今天日本两千日元纸币上印着她的画像,研究这部书也是一门专门学问","源氏物语的作者"],"y":[973,1014],"s":"文学"},{"n":"织田信长","a":["第六天魔王","Oda Nobunaga"],"c":"JPN","r":"东亚","e":"1534–1582","f":"政治军事","h":["公元16世纪,日本战国时代,和戚继光、西班牙的腓力二世同时","尾张国,今天的名古屋一带","大名(军阀),从小被称为尾张大傻瓜","第一个用铁炮(火绳枪)大规模组队作战的人,几乎统一了日本","没留下著作,只留下一句人生五十年如梦亦如幻的诗","在本能寺被自己的家臣背叛,放火烧寺后自尽","今天游戏里他永远是火属性暴力输出型角色,日本综艺每年都拿他当话题","桶狭间之战以少胜多,他烧了比叡山,人称第六天魔王"],"y":[1534,1582]},{"n":"丰臣秀吉","a":["木下藤吉郎","太阁","Toyotomi Hideyoshi"],"c":"JPN","r":"东亚","e":"1537–1598","f":"政治军事","h":["公元16世纪,日本战国末期,和织田信长、德川家康同时代","尾张国出身,农民家庭","大名,从给主公提鞋的仆役一路做到天下人","完成日本统一,推行太阁检地统一度量衡,还入侵朝鲜","没留下系统著作,只留下大量书状和刀狩令","从最底层爬到最高位,被人称作猴子,晚年因为儿子年幼托孤给五大老","今天游戏里他的形象总是一只猴子脸,网友爱说他的逆袭故事","他两次出兵朝鲜,明朝和朝鲜联军对抗的那场战争叫壬辰倭乱"],"y":[1537,1598]},{"n":"德川家康","a":["竹千代","神君","Tokugawa Ieyasu"],"c":"JPN","r":"东亚","e":"1543–1616","f":"政治军事","h":["公元16到17世纪,日本战国末期到江户初期","三河国,今天的爱知县一带","大名、幕府开创者,当了两年将军就退休但实际掌权到死","在关原之战获胜,建立了一个延续二百六十五年的幕府","留下东照宫遗训和家康百条等训诫,主张人的一生如负重远行","小时候当过织田家和今川家的人质,一辈子忍到七十多岁才动手","今天日本有一句名言说得好不如做得久,网上把他当长期主义的祖师爷","江户幕府的第一代将军,江户就是今天的东京"],"y":[1543,1616]},{"n":"宫本武藏","a":["新免武藏","Miyamoto Musashi"],"c":"JPN","r":"东亚","e":"1584–1645","f":"政治军事","h":["公元16到17世纪,江户初期,和德川家康同时代","播磨国出身,一生在各地游历比剑","剑客、兵法家,还是个画师和雕刻师","一生经历六十余次决斗全胜,创出二天一流,主张双手各持一刀","留下五轮书和独行道,把兵法写成了人生哲学","最出名的一战是用削尖的船桨,在严流岛上打死了佐佐木小次郎","今天游戏和动漫里他是常客,网友爱说他是个把剑术当呼吸法的男人","五轮书是他临死前在山洞里写的"],"y":[1584,1645]},{"n":"福泽谕吉","a":[" Fukuzawa Yukichi"],"c":"JPN","r":"东亚","e":"1835–1901","f":"思想哲学","h":["公元19到20世纪,日本明治时期,和清末的李鸿章同时代","大阪出身,老家在九州中津,主要活动在东京","思想家、教育家,创办了一所至今仍是日本顶尖的私立大学","著书提倡脱亚入欧、人人独立,写了几十种启蒙读物","代表作有劝学篇、文明论概略,名句有天不造人上之人","三次随使团出访欧美,亲眼看到西方的制度和器物","今天他的头像印在日本最大面额的纸币上,一提一万日元就想到这个戴眼镜的男人","庆应义塾的创办人"],"y":[1835,1901],"s":"思想·哲学"},{"n":"明治天皇","a":["睦仁","Emperor Meiji"],"c":"JPN","r":"东亚","e":"1852–1912","f":"政治军事","h":["公元19到20世纪,和李鸿章、福泽谕吉同时代","京都出生,后来把都城搬到东京","天皇,在位四十五年","在他名下推行了一整套改革,日本从封建岛国变成列强之一","主持颁布了宪法和一系列诏书,还有一份关于教育的敕语","从京都搬到东京时坐轿子走了十几天,史书把他当改革象征,但实权在元老手里","今天日本的年号制度里他的名字成了一个时代的代名词","维新变法的那场改革以他的名字命名"],"y":[1852,1912]},{"n":"夏目漱石","a":["金之助","Natsume Soseki"],"c":"JPN","r":"东亚","e":"1867–1916","f":"文学艺术","h":["公元19到20世纪,日本明治到大正,和鲁迅差不多同时","东京出身,曾留学英国两年","作家、英语教师,在帝国大学教过书","日本近代文学的代表,写下了多部剖析都市知识分子的小说","著有我是猫、哥儿、三四郎、心,还有一部早期作品写过草枕","他主张把英文的I love you翻译成今夜月色真美","今天这句月色真美成了日式含蓄告白的代名词,网友还在到处用","我是猫是他的成名作,他是猫奴文学的开山"],"y":[1867,1916],"s":"文学"},{"n":"松下幸之助","a":["Konosuke Matsushita"],"c":"JPN","r":"东亚","e":"1894–1989","f":"商业经济","h":["公元20世纪,日本近现代,和爱迪生、福特差了一两代","和歌山县出身,在大阪创业","企业家,只上过四年小学就去当学徒","从三个人做插座起家,创出一个全球家电品牌,还办了商学院","留下大量经营哲学著作,提出自来水哲学和终身雇用","九岁就辍学当学徒,后来被称作经营之神","今天日本企业界仍在学他那套理念,商学院里挂在墙上","他创立的品牌就是那个Panasonic"],"y":[1894,1989],"s":"商业·创业"},{"n":"黑泽明","a":["Akira Kurosawa"],"c":"JPN","r":"东亚","e":"1910–1998","f":"文学艺术","h":["公元20世纪,和卓别林、乔治·卢卡斯同时代","东京出身,从画海报的助理做起","电影导演、编剧,一生拍了三十多部电影","把日本历史片带到了世界影坛,影响了无数西方导演","导演作品有罗生门、七武士、乱、影子武士","拍电影时有严格到出了名的执念,为了真实的雨效在片场浇了几百吨水","今天电影学院还在放他的片子,七武士被好莱坞翻拍成西部片","罗生门拿到了威尼斯金狮奖"],"y":[1910,1998],"s":"电影与戏剧"},{"n":"宫崎骏","a":["Hayao Miyazaki"],"c":"JPN","r":"东亚","e":"1941–","f":"文学艺术","h":["公元20到21世纪,当代人物","东京出身,长期在东京郊外的动画工作室创作","动画导演,和几位同事一起创办了一间动画工作室","执导了多部世界级的动画长片,还拿了奥斯卡终身成就奖","作品有风之谷、龙猫、千与千寻、哈尔的移动城堡","宣布退休过好几次又复出,画分镜画到八十多岁","今天网上那句不能吃太胖会被杀掉出自他的作品,龙猫也成了所有人心里的软萌符号","千与千寻拿过柏林金熊奖"],"y":[1941,1941],"s":"电影与戏剧"},{"n":"世宗大王","a":["李祹","Sejong the Great"],"c":"KOR","r":"东亚","e":"1397–1450","f":"科学发明","h":["公元15世纪,朝鲜王朝早期,和明朝的永乐、郑和同时代","朝鲜半岛,都城在汉阳,今天的首尔","君主,朝鲜王朝第四代王","主持创制了一套表音文字,让平民也能读写,这在东亚是破天荒的事","主持编成多部农书、医书和音乐著作,还发明了测雨器和日晷","他本人有眼疾和糖尿病,却把大量时间花在和一个书生辩论音韵上","今天韩国的这个节日就为纪念他,他的头像印在最大面额的韩元上","他创制的文字叫训民正音,就是今天的韩文"],"y":[1397,1450],"s":"科学·技术"},{"n":"李舜臣","a":["汝谐","忠武公","Yi Sun-sin"],"c":"KOR","r":"东亚","e":"1545–1598","f":"政治军事","h":["公元16世纪,朝鲜王朝,和日本的丰臣秀吉、明朝的万历同时代","朝鲜半岛南部沿海","水军将领,四十七岁才第一次当上水军统帅","在壬辰倭乱中以少胜多打赢了多场海战,造出了一种覆着铁板形如龟背的战船","留下乱中日记和大量奏疏,日记记了整整七年","一生被政敌多次弹劾下狱甚至降为士兵,战争爆发又被重新起用","今天韩国把他的雕像立在首尔光化门广场,那艘龟船也是韩国的民族象征","鸣梁海战十二艘船打退三百多艘"],"y":[1545,1598]},{"n":"许浚","a":["清源","Heo Jun"],"c":"KOR","r":"东亚","e":"1539–1615","f":"科学发明","h":["公元16到17世纪,朝鲜王朝中期,和李舜臣同时代","朝鲜半岛,出身庶子身份低下","医生,靠医术做到了国王的御医","奉王命编成一部东方医学百科全书,二十五卷,是他那个时代最重要的医书之一","编有东医宝鉴,把医学分成内科外科杂病等门类","出身低微所以长期被士大夫排斥,他靠医术而不是出身爬上来","今天韩剧里拍过他,东医宝鉴也被列入世界记忆名录","东医宝鉴是朝鲜医学的集大成之作"],"y":[1539,1615],"s":"科学·技术"},{"n":"安重根","a":["应七","安应七","An Jung-geun"],"c":"KOR","r":"东亚","e":"1879–1910","f":"政治军事","h":["公元19到20世纪,朝鲜末年到日据初期","黄海道出身,在中国东北和俄国远东一带活动","独立运动家,曾任义兵将领","在哈尔滨火车站刺杀了日本前首相伊藤博文,震惊世界","在狱中写下东洋和平论,主张中日韩三国联合抗衡西方","被判处死刑后拒绝上诉,临刑前留下多幅书法和印章","今天韩国和中国的纪念馆里都有他的纪念馆,哈尔滨车站还是景点","他在狱中写了自传,死时只有三十一岁"],"y":[1879,1910]},{"n":"柳宽顺","a":["柳宽顺","Ryu Gwansun"],"c":"KOR","r":"东亚","e":"1902–1920","f":"政治军事","h":["公元20世纪,日据时期,和孙中山、甘地同时代","忠清南道天安出身,就读于首尔的女子学校","学生、独立运动者,人们叫她梨花学堂的丫头","在三一运动里带头在街头高呼独立万岁,是运动中最著名的女性","没有著作,只留下狱中抗争的事迹","在狱中被严刑拷打而死,年仅十七岁,遗体被秘密处理","今天韩国称她为韩国的贞德,学校里有她的雕像","三一运动中最年轻的面孔之一"],"y":[1902,1920]},{"n":"金九","a":["白凡","Kim Gu"],"c":"KOR","r":"东亚","e":"1876–1949","f":"政治军事","h":["公元20到20世纪中叶,韩国独立运动与建国时期","黄海道出身,一生在中国活动的时间比在国内长","独立运动领袖,曾在中国组织流亡政府","担任过大韩民国临时政府主席,领导抗日独立运动二十多年","著有白凡逸志,记录了他一生的斗争","年轻时杀过日本军官入狱,越狱后出家当过和尚,后来在上海组织过虹口公园爆炸案","今天韩国把他和另一位领袖并称建国双雄,他的自传是畅销书","大韩民国临时政府在上海有一处旧址"],"y":[1876,1949]},{"n":"金日成","a":["金成柱","Kim Il-sung"],"c":"PRK","r":"东亚","e":"1912–1994","f":"政治军事","h":["公元20世纪,和毛泽东、斯大林同时代","出生在平壤附近的万景台,少年时随家人流亡中国东北","政治领袖、游击队员出身","建立了一个至今仍在运行的国家,开创了世袭的权力结构","留下大量著作和回忆录,还有一套以他名字命名的思想体系","曾在苏联军队中服役,1945年随苏军回到半岛北部","今天他的画像和铜像遍布那个国家,诞生地成了朝圣景点","朝鲜的建国领袖,他的儿子和孙子都继了位"],"y":[1912,1994]},{"n":"朴正熙","a":["中树","Park Chung-hee"],"c":"KOR","r":"东亚","e":"1917–1979","f":"政治军事","h":["公元20世纪,韩国近现代,和金日成同时代","庆尚北道出身,曾就读日本军校","军人、总统,通过军事政变上台","主导了韩国的工业化,推动了出口导向经济,被称作汉江奇迹的推手","留下大量演说和著作,还有一部关于民族主义的书","执政十八年,权力集中、镇压异见,最后被自己的情报部长在宴席上枪杀","今天韩国评价他极度两极化,一说经济之父一说独裁者","他的女儿后来也当上了总统"],"y":[1917,1979]},{"n":"释迦牟尼","a":["乔达摩·悉达多","佛陀","Buddha"],"c":"NPL","r":"南亚","e":"约前563–前483","f":"宗教神话","h":["公元前6到前5世纪,和孔子、毕达哥拉斯同时代","出生在喜马拉雅山南麓的一个小国,今天尼泊尔境内","王子出身,二十九岁出家","创立了世界上第四大宗教,信众遍布东亚和东南亚","他的言教被弟子结集成大量经典,最著名的是四圣谛和八正道","在菩提树下静坐四十九天悟道,此前试过六年苦行饿到皮包骨","今天寺庙里的那尊笑脸大佛就是以他为原型,佛系这个词也从他的教义里衍生出来","本名乔达摩·悉达多,被尊称佛陀"],"y":[-563,-483],"s":"宗教·神话"},{"n":"阿育王","a":["无忧王","Ashoka"],"c":"IND","r":"南亚","e":"前304–前232","f":"政治军事","h":["公元前3世纪,和秦始皇、阿基米德同时代","南亚次大陆,孔雀王朝","君主,祖父建立了印度次大陆第一个大帝国","在一场死了十万人的大战后幡然悔悟,放下屠刀推行仁政,把法令刻在石柱和岩壁上","留下的摩崖法敕和石柱铭文是最重要的古代文献,石柱顶上雕着四只狮子","他派人把佛教传到斯里兰卡和中亚,还派自己的儿子女儿去传教","今天印度国旗中央那个法轮就是他的标志,国徽也是他那根石柱的柱头","发动了羯陵伽战争后皈依佛教的那位君主"],"y":[-304,-232]},{"n":"商羯罗","a":["Śaṅkara","Shankara"],"c":"IND","r":"南亚","e":"788–820","f":"思想哲学","h":["公元8到9世纪,和唐朝的杜甫之后、查理曼大帝同时代","南印度喀拉拉一带出身,一生走遍印度次大陆","哲学家、僧人,只活了三十三岁","复兴了印度教,建立起四大修道院,把佛教在印度的势力压了下去","注释了大量经典,创立了不二论哲学","传说他曾在辩论中击败过整个学派的学者,还曾与一位学者妻子辩论","今天印度教的四大寺院仍以他为祖师,印度哲学课上第一课就是他","他创立的不二论主张梵我合一"],"y":[788,820],"s":"思想·哲学"},{"n":"阿克巴大帝","a":["Akbar the Great","阿克巴"],"c":"IND","r":"南亚","e":"1542–1605","f":"政治军事","h":["公元16到17世纪,和明朝的万历、英国的伊丽莎白一世同时代","印度次大陆北部,莫卧儿王朝","君主,十三岁即位","把帝国扩到几乎整个南亚次大陆,还推行宗教宽容,娶了印度教和基督教妻子","主持编修了大量史书和翻译项目,还创立了一种调和各教的新信仰","不识字却记忆力惊人,每天让人念书给他听,还喜欢和人辩论宗教","今天印度史书上把他当作宽容统治的典范","莫卧儿王朝最著名的皇帝,孙子是修泰姬陵的那位"],"y":[1542,1605]},{"n":"章西女王","a":["拉克什米·巴伊","Rani of Jhansi"],"c":"IND","r":"南亚","e":"1828–1858","f":"政治军事","h":["公元19世纪,印度民族大起义时期,和英国的维多利亚女王同时代","印度中部章西土邦","女王、起义领袖,从小学习骑射剑术","丈夫死后英国不承认养子的继承权,吞并了她的邦国,她挺身反抗","没留下著作,但留下了大量传说和书信","在战场上背着孩子骑马冲锋,最后战死,年仅三十岁","今天印度有好几部电影拍她,是抗英精神的象征","1857年印度大起义中的女性领袖"],"y":[1828,1858]},{"n":"泰戈尔","a":["罗宾德拉纳特·泰戈尔","Tagore"],"c":"IND","r":"南亚","e":"1861–1941","f":"文学艺术","h":["公元19到20世纪,和甘地、托尔斯泰同时代","印度加尔各答,出身富裕的大家族","诗人、作家、音乐家、画家,还是个办学校的教育家","1913年拿到诺贝尔文学奖,是亚洲第一个得此奖的人","著有吉檀迦利、飞鸟集、新月集,还创作了两千多首歌曲","他写的两首歌分别成了印度和孟加拉的国歌,这个纪录全世界独一份","今天中学课本里还收着他的飞鸟集,那句生如夏花之绚烂就是他写的","他创办的学校后来成了一所著名大学"],"y":[1861,1941],"s":"文学"},{"n":"甘地","a":["莫罕达斯·甘地","圣雄","Mahatma Gandhi"],"c":"IND","r":"南亚","e":"1869–1948","f":"政治军事","h":["公元19到20世纪,和泰戈尔、丘吉尔同时代","出生在印度西部,留学英国学法律,在南非待了二十多年","政治领袖,律师出身","创立了非暴力不合作运动,靠绝食和抵制英货把印度推向独立","著有自传我体验真理的故事和大量文集","1930年带着几十个人走了三百多公里去海边煮盐,公开违反英国盐法","今天全世界讲非暴力抗争都会提他,他的眼镜和纺车是最有名的符号","被尊称圣雄,后来被印度教极端分子刺杀"],"y":[1869,1948]},{"n":"尼赫鲁","a":["Jawaharlal Nehru"],"c":"IND","r":"南亚","e":"1889–1964","f":"政治军事","h":["公元20世纪,和甘地、毛泽东同时代","出生在阿拉哈巴德的名门,留学英国剑桥","政治家,印度独立后的第一任总理","执政十七年,推行国有化工业化和不结盟外交","著有印度的发现、世界史一瞥,在狱中写完了那部大部头","在英属监狱里总共待了九年多,把牢房变成了书房","今天印度政坛还在争论他的遗产,不结盟运动也是他参与开创的","他的女儿和外孙后来都当了总理"],"y":[1889,1964]},{"n":"拉马努金","a":["Srinivasa Ramanujan"],"c":"IND","r":"南亚","e":"1887–1920","f":"科学发明","h":["公元19到20世纪,和爱因斯坦、泰戈尔同时代","南印度马德拉斯的贫寒家庭","数学家,几乎完全靠自学,没受过正规高等数学训练","写下近四千条公式和恒等式,其中很多到现在还被用在物理和密码学里","留下大量笔记本和论文,他写的圆周率级数每算一项能出八位小数","把一封信和一堆公式寄给英国数学家,对方看后连夜去码头接他","今天程序员们讨论算法还在用他发现的公式,称他是在梦里接到女神启示的人","带他去的英国数学家叫哈代,他死时只有三十二岁"],"y":[1887,1920],"s":"科学·技术"},{"n":"阿姆倍伽尔","a":["B.R. Ambedkar","安贝德卡"],"c":"IND","r":"南亚","e":"1891–1956","f":"思想哲学","h":["公元20世纪,和甘地、尼赫鲁同时代","出身印度西部不可接触者阶层,留学美国哥伦比亚和英国伦敦","法学家、社会活动家,印度独立后当司法部长","主持起草了印度宪法,一生为贱民阶层争取平等权利","著有印度宪法草案和大量社会批判著作,还写了一部关于种姓制度的分析","他是印度第一位拿到两个博士学位的贱民出身者,后来带几十万人集体改宗佛教","今天印度宪法日是他的诞辰,他的画像和甘地一样被挂在政府办公室","印度宪法的主要起草人"],"y":
