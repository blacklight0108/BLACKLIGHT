术、恋歌集","因为一首诗和一桩宫廷丑闻被屋大维下令流放,在异乡写了大量哀歌也没能回来","今天西方文学里所有讲神话变形的故事都源自他那部书,莎士比亚和乔叟都抄过他","他那部神话集影响了后世两千年的画家和诗人"],"y":[-43,17],"s":"文学"},{"n":"李维","a":["Livy","提图斯·李维"],"c":"ITA","r":"欧洲","e":"前59–17","f":"文学艺术","h":["公元前1世纪到公元1世纪,和屋大维同时代","意大利北部的帕多瓦,大半生在罗马","历史学家,和屋大维私交不错","写下了一部从建城到当时的罗马通史,共一百四十二卷","那部书只流传下来三十多卷,其余靠摘录知道内容","他自己说写历史是为了让人看到罗马的伟大,并不掩饰对古代的偏爱","今天讲罗马早期历史,流传下来的那部分还是主要史料","他的著作叫罗马建城以来史"],"y":[-59,17],"s":"文学"},{"n":"屋大维","a":["奥古斯都","Augustus","盖乌斯·屋大维"],"c":"ITA","r":"欧洲","e":"前63–14","f":"政治军事","h":["公元前1世纪到公元1世纪,和凯撒、维吉尔同时代","罗马,凯撒的甥孙兼养子","政治家,十九岁继承凯撒的名字和军队","打败安东尼和埃及艳后,结束了罗马内战,建立了元首制,罗马从此由共和变帝制","留下功业录,把自己的政绩刻在铜柱上,还留下大量文书","自称是恢复共和的第一公民,实则掌握了全部大权,统治四十多年","今天西方历法里的八月以他的称号命名,罗马和平这个概念就是他开创的时期","他的称号奥古斯都后来成了皇帝的代名词"],"y":[-63,14]},{"n":"塞内卡","a":["Seneca","小塞内卡"],"c":"ITA","r":"欧洲","e":"约前4–65","f":"思想哲学","h":["公元1世纪,和尼禄、老普林尼同时代","出生在西班牙的科尔多瓦,一生在罗马","哲学家、政治家、剧作家,当过尼禄的老师和大臣","把斯多葛哲学写成通俗的书信和短文,影响了几百年","留下道德书简、论生命之短暂和一批悲剧剧本","因为被卷进刺杀尼禄的阴谋,被下令自尽,他割开血管和侄子们谈哲学谈到最后","今天自助书和励志书还在引用他那句不是我们拥有的时间太少","他是尼禄的老师,最后被这个学生赐死"],"y":[-4,65],"s":"思想·哲学"},{"n":"尼禄","a":["Nero","尼禄·克劳狄乌斯"],"c":"ITA","r":"欧洲","e":"37–68","f":"政治军事","h":["公元1世纪,和塞内卡、圣保罗同时代","罗马,十七岁登基","皇帝,喜欢唱歌弹琴参加赛车比赛","罗马大火后重建城市,还迫害了新兴的基督教团体","自己写诗和唱歌,还想在舞台上赢奖,甚至跑去参加奥林匹克运动会","传说大火时他在高处弹琴吟诗,还为了修宫殿强占了大量土地","今天他是暴君的代名词,影视剧里的头号反派,那句我来我见我征服不是他说的","他杀了自己的母亲和妻子,最后被元老院宣布为公敌而自杀"],"y":[37,68]},{"n":"老普林尼","a":["Pliny the Elder","盖乌斯·普林尼·塞孔都斯"],"c":"ITA","r":"欧洲","e":"23–79","f":"科学发明","h":["公元1世纪,和尼禄、图拉真之前同时代","罗马,出身骑士阶层,当过舰队司令","学者、官员,一辈子无时无刻不在看书和记录","编成一部三十七卷的百科全书,内容覆盖天文地理动植物医学矿物和艺术史","那部书叫自然史,收录了两万多个条目,引用了几百位作者","维苏威火山爆发时他驾船去救援和观察,上岸后死于火山气体","今天讲百科全书的历史都从他开始,他还留下那句只有一件事是确定的没有什么是确定的","他那部自然史是现存最古老的百科全书之一"],"y":[23,79],"s":"科学·技术"},{"n":"图拉真","a":["Trajan","马尔库斯·乌尔皮乌斯·图拉伊阿努斯"],"c":"ITA","r":"欧洲","e":"53–117","f":"政治军事","h":["公元1到2世纪,和罗马的哈德良、东汉的张衡同时代","出生在西班牙的意大利卡,后来入主罗马","皇帝,军人出身,是第一位出生于行省的皇帝","把帝国疆域扩到最大,达契亚和两河流域都并入版图,还大搞公共工程","留下大量书信和一部关于达契亚战争的纪功柱浮雕","和元老院关系极好,元老院送给他一个称号叫最好的君主","今天欧洲一些国家的君主在加冕时还要向他致敬,罗马市里他的市场遗址还在","他留下的那根纪功柱在罗马市中心,柱上浮雕绕了二十三圈"],"y":[53,117]},{"n":"哈德良","a":["Hadrian","普布利乌斯·埃利乌斯·哈德良"],"c":"ITA","r":"欧洲","e":"76–138","f":"政治军事","h":["公元1到2世纪,和图拉真是养父子关系","罗马,一生几乎都在巡游帝国各地","皇帝,图拉真的养子和继任者","在不列颠修建了一道横贯东西的长城,还重建了万神殿","留下《致自己》这类诗作,还留下大量建筑","他杀掉了几个元老巩固权力,却在雅典完成了大量神庙和图书馆","今天英国的那道墙是世界遗产,游客最喜欢在墙边拍照","他在不列颠修的那道墙以他命名"],"y":[76,138]},{"n":"马可·奥勒留","a":["Marcus Aurelius","哲学家皇帝"],"c":"ITA","r":"欧洲","e":"121–180","f":"思想哲学","h":["公元2世纪,和罗马的哈德良、中国的张仲景同时代","罗马,出身贵族,从小受严格修辞和哲学教育","皇帝兼哲学家,被称作哲学家皇帝","在位时一直在打仗和抗瘟疫,写下了一部写给自己的思考笔记","那部笔记十二卷,后世人叫它沉思录,是斯多葛哲学的经典","十几年的军旅生涯里在马背上写这些文字,罗马的安东尼瘟疫死了几百万人","今天机场书店里沉思录还是畅销书,企业家和运动员都爱引用","他和养兄共治过一段时间,儿子是个被后世骂惨的皇帝"],"y":[121,180],"s":"思想·哲学"},{"n":"君士坦丁大帝","a":["Constantine the Great","君士坦丁一世"],"c":"ITA","r":"欧洲","e":"约272–337","f":"政治军事","h":["公元3到4世纪,和罗马帝国分裂前后同时","出生在巴尔干,后来在拜占庭建了新都","皇帝,靠内战统一了罗马","给予基督教合法地位,还亲自主持了第一次全帝国范围的宗教会议","留下大量诏令和书信,他的名字和一份教会文献是否由他颁布争论了几百年","传说在决战前看到天上的十字架和一句以此为胜,于是让士兵把符号画在盾牌上","今天欧洲很多教堂和城市以他命名,基督教从被迫害到被国教化就是从他在位开始的","他建的新都城后来叫君士坦丁堡"],"y":[272,337]},{"n":"查士丁尼一世","a":["Justinian I","查士丁尼大帝"],"c":"TUR","r":"中东","e":"482–565","f":"政治军事","h":["公元6世纪,和中国的南北朝、穆罕默德之前同时","拜占庭帝国,首都君士坦丁堡","皇帝,农民家庭出身,靠叔父登上皇位","组织编成一部完整的罗马法汇编,还收复了意大利和北非,建了圣索菲亚大教堂","那部法典叫民法大全,是后世大陆法系的源头","尼卡暴动时他准备逃跑,皇后一句话把他劝住,事后镇压了三万人","今天欧洲大陆的法律体系仍以他那部法典为源头,圣索菲亚大教堂还立在伊斯坦布尔","君士坦丁堡在他手里达到了顶峰"],"y":[482,565]},{"n":"狄奥多拉","a":["Theodora","西奥多拉"],"c":"TUR","r":"中东","e":"约500–548","f":"政治军事","h":["公元6世纪,和查士丁尼一世同时代","拜占庭,君士坦丁堡","皇后,早年是马戏团的演员和舞女","从一个底层艺人成为帝国共治者,参与制定法律,还推动修改了妇女的继承权和离婚权","留下大量法令和书信,还有一篇著名的演说","尼卡暴动时她说皇帝的紫袍是最美的裹尸布,劝丈夫留下不走","今天她是女性权力史上常被引用的案例,小说和电影都拍过她的逆袭人生","她原本是在竞技场表演的驯熊人的女儿"],"y":[500,548]},{"n":"爱比克泰德","a":["Epictetus","埃皮克提图"],"c":"TUR","r":"中东","e":"约55–135","f":"思想哲学","h":["公元1到2世纪,和罗马的图拉真、哈德良同时代","出生在小亚细亚的弗里吉亚,一生在罗马和希腊","哲学家,生来就是奴隶,腿有残疾","把斯多葛哲学讲成了一套人人都能用的生活准则,主张分清什么由你决定什么不由你决定","他的讲课由学生记录成书,包括语录和手册两本","主人拧他的腿时他说再拧就要断了,腿断了他只说了一句我不是早说了吗","今天认知行为疗法和现代自助书大量引用他,他还影响了罗马皇帝马可·奥勒留","他出身奴隶却教出了皇帝的学生"],"y":[55,135],"s":"思想·哲学"},{"n":"圣奥古斯丁","a":["Augustine","奥古斯丁"],"c":"DZA","r":"非洲","e":"354–430","f":"思想哲学","h":["公元4到5世纪,和西罗马帝国灭亡同时","出生在北非的塔加斯特,今天的阿尔及利亚,后来当过希波城主教","神学家、哲学家,年轻时放荡不羁,后来皈依","把希腊哲学和基督教神学融合起来,影响了此后一千年的西方思想","写下西方第一部自传忏悔录和一部巨著上帝之城","年轻时偷过梨、有过情人和私生子,他在自传里把这些全写出来给世人看","今天哲学和神学课程都从他和柏拉图开始讲,他那个关于时间的思考还在被引用","他那句主啊让我纯洁但不要现在出自他的自传"],"y":[354,430],"s":"思想·哲学"},{"n":"圣杰罗姆","a":["Jerome","耶柔米"],"c":"HRV","r":"欧洲","e":"约347–420","f":"宗教神话","h":["公元4到5世纪,和圣奥古斯丁、西罗马灭亡同时","出生在达尔马提亚,今天的克罗地亚一带,后半生在伯利恒的洞穴里","修士、翻译家,通晓拉丁文、希腊文和希伯来文","把圣经从原文译成拉丁文,这个译本在欧洲流通了一千多年","留下大量书信、注释和一部名人传","他脾气极坏,和当时的主教几乎都吵过架,却在沙漠里苦修多年","今天他是翻译界的守护圣人,艺术画作里常画成一位红衣老人","他的拉丁文译本叫武加大译本"],"y":[347,420],"s":"宗教·神话"},{"n":"乔叟","a":["Geoffrey Chaucer","杰弗里·乔叟"],"c":"GBR","r":"欧洲","e":"约1343–1400","f":"文学艺术","h":["公元14世纪,和明朝的朱元璋、意大利的薄伽丘同时代","伦敦,出身酒商家庭,当过宫廷侍从和关税官","诗人、官员,还当过兵被俘过,国王出钱把他赎回来","用中古英语写出了英国文学史上第一部伟大的叙事作品,一群人去朝圣路上轮流讲故事","代表作是坎特伯雷故事集和特洛伊罗斯与克瑞西达","他是第一个葬在威斯敏斯特教堂诗人角的人,那个角落因他而起","今天英语文学史的第一课就是他,英国课本里他是英语诗歌之父","他那部故事集里有个巴斯妇讲了五段婚姻"],"y":[1343,1400],"s":"文学"},{"n":"伊丽莎白一世","a":["Elizabeth I","童贞女王"],"c":"GBR","r":"欧洲","e":"1533–1603","f":"政治军事","h":["公元16世纪,和明朝的万历、西班牙的腓力二世同时代","英格兰,伦敦","女王,母亲是安妮·博林,三岁被宣布为私生女","在位四十五年,击败西班牙无敌舰队,把一个边缘岛国变成海上强国","留下大量演讲和书信,最著名的一篇是对蒂尔伯里军营的演说","终身未嫁,把婚姻当外交筹码用了几十年,最后也没定下继承人","今天英国历史上她是最受欢迎的君主之一,影视剧拍了几十部","那个时代以她命名,莎士比亚就活跃在她治下"],"y":[1533,1603]},{"n":"莎士比亚","a":["William Shakespeare","莎翁"],"c":"GBR","r":"欧洲","e":"1564–1616","f":"文学艺术","h":["公元16到17世纪,和明朝的汤显祖、伽利略同时代","英格兰的斯特拉特福小镇,后来在伦敦剧团工作","剧作家、演员,父亲是手套商人","写下了三十多部戏剧和一百多首十四行诗,被公认为英语文学的最高峰","作品有哈姆雷特、李尔王、麦克白、罗密欧与朱丽叶、威尼斯商人","他创造的许多词汇和说法进入了英语日常用语,还有人怀疑这些作品不是他写的","今天全球每年都在上演他的戏,那句生存还是毁灭被翻译成了所有语言","四大悲剧的作者,演员们忌讳叫剧名而称他为那个苏格兰剧"],"y":[1564,1616],"s":"文学"},{"n":"培根","a":["Francis Bacon","弗朗西斯·培根"],"c":"GBR","r":"欧洲","e":"1561–1626","f":"思想哲学","h":["公元16到17世纪,和莎士比亚、伽利略同时代","伦敦,出身高官家庭","哲学家、政治家、散文家,当过掌玺大臣和大法官","提出用观察和实验取代空想,被视为近代科学方法的奠基人之一","著有新工具、学术的进展和随笔集","因为受贿被议会弹劾罢官,晚年在家研究如何用雪保存肉类,结果受寒病倒去世","今天那句知识就是力量就是他的名言,科学方法论课上还有他提出的四假象说","他那句知识就是力量几乎人人会背"],"y":[1561,1626],"s":"思想·哲学"},{"n":"克伦威尔","a":["Oliver Cromwell","奥利弗·克伦威尔"],"c":"GBR","r":"欧洲","e":"1599–1658","f":"政治军事","h":["公元17世纪,和牛顿、法国的路易十四同时代","英格兰东部的地主家庭出身","军人、政治家,内战中组建了新模范军","打赢内战后把国王送上断头台,这是欧洲第一次公开处死君主,后来自己当了护国公","留下大量书信和演讲记录","解散议会时说过你们在这里坐得太久了,该走了这类话,统治方式相当强硬","今天英国议会门口还挂着他的画像,但关于他该不该被纪念争论了几百年","他死后两年王政复辟,尸体被掘出吊在绞刑架上"],"y":[1599,1658]},{"n":"牛顿","a":["Isaac Newton","艾萨克·牛顿"],"c":"GBR","r":"欧洲","e":"1643–1727","f":"科学发明","h":["公元17到18世纪,和康熙、莱布尼茨同时代","英格兰的伍尔索普村出生,后来在剑桥和伦敦","物理学家、数学家、天文学家,还当过造币厂厂长和皇家学会会长","提出三大运动定律和万有引力,发明微积分,还做出三棱镜分光的实验","代表作是自然哲学的数学原理,是用拉丁文写的","晚年沉迷炼金术和圣经年代学研究,还说过自己站在巨人的肩上","今天被公认为科学史上最重要的人物之一,苹果落地的故事家喻户晓","力学单位以他命名,他还和莱布尼茨争了一辈子微积分的发明权"],"y":[1643,1727],"s":"科学·技术"},{"n":"亚当·斯密","a":["Adam Smith","亚当斯密"],"c":"GBR","r":"欧洲","e":"1723–1790","f":"商业经济","h":["公元18世纪,和乾隆、美国的富兰克林同时代","苏格兰的柯卡尔迪出身,长期在格拉斯哥和爱丁堡","经济学家、哲学家,当过大学道德哲学教授","写出第一部系统的经济学巨著,提出了看不见的手和分工理论","代表作是国富论和道德情操论","他一辈子和母亲同住,终身未婚,据说讲话时常常走神自言自语","今天经济学第一课还是从他开始,国富论是现代经济学的起点","他被称作经济学之父,国富论出版于1776年"],"y":[1723,1790],"s":"商业·创业"},{"n":"库克船长","a":["James Cook","詹姆斯·库克"],"c":"GBR","r":"欧洲","e":"1728–1779","f":"探索冒险","h":["公元18世纪,和乾隆、美国的华盛顿同时代","英格兰东北部农家出身,从商船学徒做到海军军官","航海家、探险家,三次远航太平洋","第一次到达澳大利亚东海岸和新西兰,画出了太平洋的详细海图,还靠酸菜让船员免于坏血病","留下大量航海日志和地图,他一辈子的航海记录精确到被后人沿用很久","在夏威夷因为一艘小艇被偷和当地人冲突,被当场杀死","今天太平洋上到处是他命名的地名,新西兰和澳洲的历史课都绕不开他","他是第一个环南极航行的人"],"y":[1728,1779],"s":"探险·航天"},{"n":"纳尔逊","a":["Horatio Nelson","霍雷肖·纳尔逊"],"c":"GBR","r":"欧洲","e":"1758–1805","f":"政治军事","h":["公元18到19世纪,和拿破仑同时代","英格兰诺福克郡牧师家庭出身,十二岁就上舰","海军将领,一生失去了一只眼睛和一条手臂","在特拉法尔加海战中歼灭法西联合舰队,自己也在战斗中阵亡,英国从此确立海上霸权","留下大量战斗前的训令和信件,最有名的一句是英国期待每个人恪尽职守","战斗前他穿上挂满勋章的礼服上甲板,被狙击手打中脊椎","今天伦敦特拉法尔加广场的柱子顶端就是他的雕像","特拉法尔加广场以那场战役命名"],"y":[1758,1805]},{"n":"简·奥斯汀","a":["Jane Austen","简奥斯汀"],"c":"GBR","r":"欧洲","e":"1775–1817","f":"文学艺术","h":["公元18到19世纪,和拿破仑、贝多芬同时代","英格兰南部的乡村,一生几乎没离开过","小说家,一辈子未婚,写作时要在客厅里悄悄写,听到门轴响就藏起来","用细腻的笔写英国乡绅社会的婚姻和财产,共有六部小说传世","著有理智与情感、傲慢与偏见、爱玛、曼斯菲尔德庄园","她的书出版时作者只署名一位女士,收益也有限,去世后才越来越有名","今天她的作品被改编成无数影视剧,达西先生是文学史上最著名的理想对象","傲慢与偏见的作者"],"y":[1775,1817],"s":"文学"},{"n":"达尔文","a":["Charles Darwin","查尔斯·达尔文"],"c":"GBR","r":"欧洲","e":"1809–1882","f":"科学发明","h":["公元19世纪,和林肯、马克思同时代","英格兰什鲁斯伯里出生,后来住在伦敦郊外的唐恩宅","生物学家,年轻时随一艘测量船环球航行五年","提出以自然选择为核心的进化理论,彻底改变了人类对生命的理解","代表作是物种起源,还有人类起源和贝格尔号航行记","父亲骂他游手好闲,他自己也差点去当牧师,一辈子身体不好仍坚持做实验养鸽子","今天生物学的一切都建立在他提出的框架上,教科书画着他画的那棵生命之树","物种起源出版于1859年"],"y":[1809,1882],"s":"科学·技术"},{"n":"法拉第","a":["Michael Faraday","迈克尔·法拉第"],"c":"GBR","r":"欧洲","e":"1791–1867","f":"科学发明","h":["公元19世纪,和维多利亚女王、达尔文同时代","伦敦,出身贫寒的铁匠家庭,只上过小学","物理学家、化学家,十三岁当订书匠学徒,靠自学和听讲座入行","发现电磁感应,造出第一台发电机和电动机原型,还发现了苯","留下实验日记和电学实验研究,记录了几十年","为了回击质疑,他当众做实验演示,后来还坚持在皇家学会办面向大众的圣诞讲座","今天所有发电站和电动机的原理都来自他发现的那个现象","电容的单位以他命名,他没有上过大学却成了皇家学会会员"],"y":[1791,1867],"s":"科学·技术"},{"n":"狄更斯","a":["Charles Dickens","查尔斯·狄更斯"],"c":"GBR","r":"欧洲","e":"1812–1870","f":"文学艺术","h":["公元19世纪,和维多利亚女王同时代","出生在朴茨茅斯,十二岁因父亲欠债进工厂贴标签","小说家,还办杂志、做公开朗读巡演","写下十几部长篇小说,专写工业时代的伦敦底层和孤儿,是维多利亚时代最受欢迎的作家","著有雾都孤儿、大卫·科波菲尔、双城记、远大前程、圣诞颂歌","在美国做朗读巡演时累到身体垮掉,去世后葬在威斯敏斯特教堂","今天圣诞节的很多习俗受他那本小说影响,双城记开篇那段话是英语文学最有名的开头之一","那句这是最好的时代也是最坏的时代出自他的手"],"y":[1812,1870],"s":"文学"},{"n":"南丁格尔","a":["Florence Nightingale","弗罗伦斯·南丁格尔"],"c":"GBR","r":"欧洲","e":"1820–1910","f":"科学发明","h":["公元19到20世纪,和维多利亚女王、达尔文同时代","出生在意大利佛罗伦萨的英国富裕家庭,后来主要在英国","护士、统计学家,出身上流社会却坚持去当护士","在克里米亚战争中改革战地医院,把死亡率从四成降到百分之二,还用统计图表推动公共卫生改革","著有护理笔记和大量统计报告","她夜里提着灯巡视病房,士兵们叫她提灯女神","今天护士节的日期就是她的生日,护理学校的第一课讲她","她是现代护理学的开创者,也是最早用图表做说服的政治行动者之一"],"y":[1820,1910],"s":"科学·技术"},{"n":"维多利亚女王","a":["Queen Victoria","维多利亚"],"c":"GBR","r":"欧洲","e":"1819–1901","f":"政治军事","h":["公元19到20世纪,和慈禧、林肯同时代","英格兰,在位六十三年","女王,十八岁登基","她的时代是英国国力最盛的时期,号称日不落帝国,她本人也成了帝国的象征","留下大量日记和书信,日记写了六十多年共一百多卷","丈夫去世后穿黑衣隐居了十几年,后来才重新露面;她有九个孩子,和欧洲各国王室通婚","今天英国很多城市、河流、建筑和澳洲的一个州都以她命名","维多利亚时代这个概念就是以她命名的"],"y":[1819,1901]},{"n":"柯南道尔","a":["Arthur Conan Doyle","阿瑟·柯南道尔"],"c":"GBR","r":"欧洲","e":"1859–1930","f":"文学艺术","h":["公元19到20世纪,和维多利亚女王、特斯拉同时代","出生在苏格兰爱丁堡,当过医生","医生、小说家,行医没什么病人所以开始写小说","创造了一个文学史上最著名的侦探形象,还参与了真实案件的翻案调查","著有福尔摩斯探案集、失落的世界,还写过历史小说","他把自己创造的这个角色写死了,结果读者强烈抗议,他只好让人物复活","今天伦敦贝克街221B的门口永远有人排队拍照,这个地址本来并不存在","他那个侦探住在贝克街,搭档是个医生"],"y":[1859,1930],"s":"文学"},{"n":"王尔德","a":["Oscar Wilde","奥斯卡·王尔德"],"c":"IRL","r":"欧洲","e":"1854–1900","f":"文学艺术","h":["公元19世纪,和维多利亚女王同时代","都柏林出身,留学牛津,后来在伦敦和巴黎活动","作家、剧作家、唯美主义代表,以口才和衣着出名","写了一部小说、多部戏剧和大量警句,主张艺术只为美而存在","著有道林·格雷的画像、不可儿戏、快乐王子","因为和一位贵族的私情被判处两年苦役,出狱后流亡巴黎,四十六岁病死在旅馆里","今天他那些刻薄又漂亮的句子在社交网络上被转了几万遍","他写过一个为爱牺牲自己的快乐王子雕像"],"y":[1854,1900],"s":"文学"},{"n":"图灵","a":["Alan Turing","阿兰·图灵"],"c":"GBR","r":"欧洲","e":"1912–1954","f":"科学发明","h":["公元20世纪,和爱因斯坦、丘吉尔同时代","伦敦出身,在剑桥和普林斯顿读书","数学家、逻辑学家,二战中在乡村庄园里做密码破译","提出可计算性理论并设计出破译德国密码机的机器,让战争缩短了数年,还提出了判断机器是否智能的测试","写有论可计算数及其在判定问题上的应用和计算机器与智能等论文","战后因为同性恋被英国法院判罪并被迫接受化学阉割,四十一岁时吃下浸过氰化物的苹果去世","今天计算机科学的最高奖以他命名,他的头像印在英国五十镑纸币上","人工智能里的那个测试也以他命名"],"y":[1912,1954],"s":"科学·技术"},{"n":"丘吉尔","a":["Winston Churchill","温斯顿·丘吉尔"],"c":"GBR","r":"欧洲","e":"1874–1965","f":"政治军事","h":["公元20到20世纪中叶,和罗斯福、斯大林同时代","出生在牛津郡的贵族庄园,母亲是美国人","政治家、作家、记者,当过战地记者被俘后又越狱逃脱","二战中领导英国抵抗,发表了一系列著名演说,后来还拿到诺贝尔文学奖","著有第二次世界大战回忆录、英语民族史,演说结集多卷","他演说里的热血、辛劳、眼泪和汗水让整个议会安静下来,还发明了铁幕这个词","今天他的雕像和那句我们将在海滩上战斗被反复引用,网友也爱用他那个V字手势","他做过两任首相,还拿过诺贝尔文学奖"],"y":[1874,1965]},{"n":"霍金","a":["Stephen Hawking","斯蒂芬·霍金"],"c":"GBR","r":"欧洲","e":"1942–2018","f":"科学发明","h":["公元20到21世纪,和爱因斯坦之后的现代物理时代","出生在牛津,长期在剑桥任教","理论物理学家、宇宙学家,二十一岁被诊断出渐冻症,医生说他只能活两年","研究黑洞辐射,提出黑洞会蒸发,还写了关于宇宙起源的畅销科普书","著有时间简史、果壳中的宇宙,销量超过千万册","在轮椅上靠眼球和语音合成器交流,还客串过星际迷航和一部情景喜剧","今天他那把轮椅和他参加冰桶挑战的画面是科学传播史上的经典","时间简史的作者,他提出黑洞并不全黑"],"y":[1942,2018],"s":"科学·技术"},{"n":"圣女贞德","a":["Joan of Arc","贞德"],"c":"FRA","r":"欧洲","e":"1412–1431","f":"政治军事","h":["公元15世纪,和明朝的郑和、英法百年战争同时","法国东部农村出身,一生没离开过法国","农民少女、军事领袖,自称听到神的声音要她去救法国","十七岁带兵解了奥尔良之围,把法国从亡国边缘拉了回来,还护送王储加冕","没留下著作,但留下了审讯记录和大量书信","被亲英的教会法庭以异端和男装罪判处火刑,十九岁被烧死,二十五年后平反","今天法国把她的忌日定为全国纪念日,她成了法国最著名的民族象征,影视剧和游戏里都有她","她自称来自洛林,被烧死在鲁昂"],"y":[1412,1431]},{"n":"笛卡尔","a":["René Descartes","勒内·笛卡尔"],"c":"FRA","r":"欧洲","e":"1596–1650","f":"思想哲学","h":["公元16到17世纪,和伽利略、莎士比亚后期同时代","出生在法国中部,一生大半在荷兰度过,最后死在瑞典","哲学家、数学家、物理学家,还当过兵","创立解析几何把代数和几何合起来,提出普遍怀疑的方法,是近代哲学的起点","著有谈谈方法、第一哲学沉思集、几何学","在炉火边整天沉思,把所有知识怀疑一遍,最后说出一句著名的结论","今天数学课上的直角坐标系以他命名,哲学史上他是近代哲学之父","我思故我在是他说的"],"y":[1596,1650],"s":"思想·哲学"},{"n":"路易十四","a":["Louis XIV","太阳王"],"c":"FRA","r":"欧洲","e":"1638–1715","f":"政治军事","h":["公元17到18世纪,和牛顿、康熙同时代","法国,凡尔赛宫","国王,五岁登基,在位七十二年,是欧洲在位最久的君主","把法国推成欧洲霸主,建了凡尔赛宫,还留下一句朕即国家","留下大量诏令和回忆录","他要求贵族住进凡尔赛宫天天参加宫廷礼仪,把权力牢牢抓在自己手里;晚年多次战争耗尽国力","今天凡尔赛宫是全球游客最多的宫殿之一,时尚和礼仪的很多规矩源自他的宫廷","在位七十二年,比康熙还多十一年"],"y":[1638,1715]},{"n":"伏尔泰","a":["Voltaire","弗朗索瓦-马利·阿鲁埃"],"c":"FRA","r":"欧洲","e":"1694–1778","f":"思想哲学","h":["公元18世纪,和乾隆、美国的富兰克林同时代","巴黎出身,一生因写作多次被投入巴士底狱和流放","作家、哲学家、启蒙思想家,靠投资和写作赚了大钱","用辛辣的笔批判宗教迫害和专制,写了几十卷历史和哲学著作","著有哲学通信、老实人、路易十四时代","因为得罪贵族被流放英国,回国后又被通缉,晚年定居在边境的庄园里,一有事就能立刻越境","今天他那些关于言论自由的句子还在被广泛引用,启蒙运动他是旗手","他那句我不同意你的观点但誓死捍卫你说话的权利常被安在他头上"],"y":[1694,1778],"s":"思想·哲学"},{"n":"孟德斯鸠","a":["Montesquieu","查理·路易·孟德斯鸠"],"c":"FRA","r":"欧洲","e":"1689–1755","f":"思想哲学","h":["公元18世纪,和康熙末年、富兰克林同时代","法国波尔多,出身法官世家","思想家、法学家,当过法院院长","提出三权分立,把权力制衡写成了一套完整理论","代表作是论法的精神、波斯人信札","用两个波斯旅行者的书信来讽刺巴黎社会,书一出版就被列为禁书","今天很多国家的宪法结构都受他影响,三权分立是他的核心主张","论法的精神是他写的"],"y":[1689,1755],"s":"思想·哲学"},{"n":"卢梭","a":["Jean-Jacques Rousseau","让-雅克·卢梭"],"c":"FRA","r":"欧洲","e":"1712–1778","f":"思想哲学","h":["公元18世纪,和伏尔泰、康德同时代","出生于日内瓦,一生在法国和瑞士之间颠沛流离","哲学家、作家、作曲家,出身钟表匠家庭,没受过正规教育","提出人生而自由、社会契约和主权在民,深深影响了后来的革命","著有社会契约论、爱弥儿、忏悔录、论人类不平等的起源","把自己的五个孩子都送进育婴堂,却在书里大谈教育;和伏尔泰互相攻击到死","今天各国革命史和民主理论都绕不开他,法国大革命把他当精神导师","他那本自传是西方第一部现代意义的回忆录"],"y":[1712,1778],"s":"思想·哲学"},{"n":"拉瓦锡","a":["Antoine Lavoisier","安托万·拉瓦锡"],"c":"FRA","r":"欧洲","e":"1743–1794","f":"科学发明","h":["公元18世纪,和美国独立战争、法国大革命同时代","巴黎,同时是科学家和税务官","化学家,被称为近代化学之父","推翻了燃素说,建立了质量守恒定律,还给氧和氢命名并编出第一张化学元素表","著有化学基本论述和大量实验报告","他娶了同事的女儿,妻子帮他画实验装置图、翻译文献;大革命中他因为是包税官被送上断头台","今天化学课本里的质量守恒定律和元素命名法都来自他","他被处死时有人说砍下这颗头只要一瞬间,再长出这样一颗要一百年"],"y":[1743,1794],"s":"科学·技术"},{"n":"罗伯斯庇尔","a":["Robespierre","马克西米连·罗伯斯庇尔"],"c":"FRA","r":"欧洲","e":"1758–1794","f":"政治军事","h":["公元18世纪,和路易十六、拿破仑同时代","法国北部阿拉斯出身,律师出身","革命家、政治家,法国大革命中最激进的派别领袖","主导了恐怖统治时期,几万人被送上断头台,还推行过一种理性崇拜","留下大量演说,被称为不可腐蚀者","他自己最后也被送上同一座断头台,死时三十六岁,前一天还在议会被人围攻","今天他是革命走向极端的代名词,历史课本里他的名字总和恐怖统治连在一起","他说过没面包就吃蛋糕的不是他,是传说中玛丽王后说的"],"y":[1758,1794]},{"n":"拿破仑","a":["Napoleon","波拿巴"],"c":"FRA","r":"欧洲","e":"1769–1821","f":"政治军事","h":["公元18到19世纪,和贝多芬、威灵顿同时代","出生在科西嘉岛,后来把法国变成欧洲霸主","军事统帅、政治家,炮兵出身,二十四岁就当上将军","横扫欧洲,颁布民法典,这套法典影响了全世界几十个国家的民法","留下大量书信、公告和口述回忆录,还有一部圣赫勒拿岛回忆录","从流放厄尔巴岛逃回巴黎,一路没开一枪就重新掌权一百天,最后在滑铁卢失败","今天各国法律体系里都有他那部法典的影子,短个子这个梗其实是个误会","他的滑铁卢成了失败的代名词,他最后被流放到大西洋孤岛"],"y":[1769,1821]},{"n":"大仲马","a":["Alexandre Dumas","亚历山大·大仲马"],"c":"FRA","r":"欧洲","e":"1802–1870","f":"文学艺术","h":["公元19世纪,和雨果、巴尔扎克同时代","出生在法国北部,祖父是贵族祖母是黑奴,父亲是拿破仑麾下的将军","小说家、剧作家,一生写了上百部作品,赚得多花得也快","写下两部法国最著名的通俗历史小说,一部讲三个剑客,一部讲一个青年复仇","著有三个火枪手、基督山伯爵、二十年后","他开了一个写作作坊雇助手帮他整理素材,还建了一座豪华的城堡招待客人,最后破产","今天三个火枪手和基督山伯爵被翻拍成无数电影和动漫","他写的那句我为人人出自他的小说"],"y":[1802,1870],"s":"文学"},{"n":"雨果","a":["Victor Hugo","维克多·雨果"],"c":"FRA","r":"欧洲","e":"1802–1885","f":"文学艺术","h":["公元19世纪,和大仲马、狄更斯同时代","出生在法国东部,十九岁就开始发表作品","作家、诗人、政治家,当过议员,因为反对专制流亡了十九年","写下法国文学最著名的长篇小说,还写了大量诗和戏剧","著有悲惨世界、巴黎圣母院、九三年、历代传说","流亡期间住在英属小岛上写作,一部小说写了十几年;去世时两百万人上街送葬","今天悲惨世界被改编成音乐剧在全球演出,巴黎圣母院失火时全球人都想起了他那本书","那句世界上最宽阔的是海洋出自他的小说"],"y":[1802,1885],"s":"文学"},{"n":"巴尔扎克","a":["Honoré de Balzac","奥诺雷·德·巴尔扎克"],"c":"FRA","r":"欧洲","e":"1799–1850","f":"文学艺术","h":["公元19世纪,和雨果、狄更斯同时代","出生在法国中部的图尔,长期在巴黎写作","小说家,商科出身,做生意失败欠了一身债,靠写作还账","写出一部由九十多部小说组成的巨型系列,用两千多个人物构筑了一个社会的全貌","代表作有欧也妮·葛朗台、高老头、幻灭,总集叫人间喜剧","每天喝几十杯黑咖啡写作到天亮,一辈子被债务追着跑,五十一岁就去世","今天法国文学史上他的这套人间喜剧是独一无二的工程","人间喜剧的作者,写了一个守财奴的经典形象"],"y":[1799,1850],"s":"文学"},{"n":"巴斯德","a":["Louis Pasteur","路易·巴斯德"],"c":"FRA","r":"欧洲","e":"1822–1895","f":"科学发明","h":["公元19世纪,和达尔文、维多利亚女王同时代","法国东部出身,长期在巴黎做研究","化学家、微生物学家,出身制革匠家庭","证明微生物引起腐败和疾病,发明了加热灭菌法,还研制出狂犬病和炭疽疫苗","留下大量实验论文,还写过关于发酵的研究","为了反驳自然发生说,他抱着装培养液的瓶子爬上阿尔卑斯山证明高山上也有微生物","今天牛奶包装上那个灭菌工艺的词以他命名,医院消毒制度源自他的研究","他发明的那种加热法就叫巴氏消毒"],"y":[1822,1895],"s":"科学·技术"},{"n":"凡尔纳","a":["Jules Verne","儒勒·凡尔纳"],"c":"FRA","r":"欧洲","e":"1828–1905","f":"文学艺术","h":["公元19到20世纪,和爱迪生、维多利亚女王同时代","法国南特的港口城市出身,后来定居在北部小城","小说家,是科幻文学的开创者之一,原本被父亲安排当律师","写了六十多部科学冒险小说,里面预言的潜水艇、登月、直升机后来都成了现实","著有海底两万里、八十天环游地球、地心游记、从地球到月球","他曾经带着手枪去找一个批评他作品的评论家决斗,被对方拒绝","今天他被称作科幻小说之父,海底两万里里的鹦鹉螺号是科幻史上最有名的船","他那本书里的人物叫尼摩船长"],"y":[1828,1905],"s":"文学"},{"n":"莫奈","a":["Claude Monet","克劳德·莫奈"],"c":"FRA","r":"欧洲","e":"1840–1926","f":"文学艺术","h":["公元19到20世纪,和罗丹、凡尔纳同时代","巴黎出生,后半生住在吉维尼的花园里","画家,印象派的开创者和最坚定的代表","一生坚持在户外画光线的变化,同一座教堂画了三十多张不同时间的样子","留下日出·印象、睡莲系列、干草堆系列,总共画了两千多幅","眼睛患白内障后仍坚持作画,反而画出偏红的色调;他那个花园是他自己设计的","今天他的睡莲在拍卖会上卖出上亿美元,印象派的名字就来自他一幅画的标题","他那幅日出·印象给整个画派定了名"],"y":[1840,1926],"s":"美术与建筑"},{"n":"罗丹","a":["Auguste Rodin","奥古斯特·罗丹"],"c":"FRA","r":"欧洲","e":"1840–1917","f":"文学艺术","h":["公元19到20世纪,和莫奈同时代","巴黎,出身警察职员家庭","雕塑家,考了三次美术学院都没考上","把雕塑从学院派的僵硬里解放出来,做出了一批充满肌肉和情绪的雕像","代表作有思想者、吻、加莱义民、地狱之门","给一座博物馆做大门做了三十七年也没完成,那扇门最后成了他最重要的作品","今天思想者的复制品立在全世界几十个城市,他的故居改成博物馆","思想者是他最著名的作品"],"y":[1840,1917],"s":"美术与建筑"},{"n":"居里夫人","a":["Marie Curie","玛丽·居里"],"c":"POL","r":"欧洲","e":"1867–1934","f":"科学发明","h":["公元19到20世纪,和爱因斯坦、普朗克同时代","出生在波兰华沙,后来到巴黎求学并工作","物理学家、化学家,为了省钱住阁楼吃面包度日","发现两种新元素,开创了放射性研究,是第一个拿到两次诺贝尔奖的人,也是第一位女性得主","著有放射性研究等学术著作,还写了大量实验记录","战时自己开着一辆装有X光设备的车上前线给伤员检查,一战期间培训了上百名女技师","今天放射性研究的很多术语由她命名,她的笔记本至今仍有放射性需要铅盒保存","她是两获诺贝尔奖的第一人,女儿也拿了诺奖"],"y":[1867,1934],"s":"科学·技术"},{"n":"戴高乐","a":["Charles de Gaulle","夏尔·戴高乐"],"c":"FRA","r":"欧洲","e":"1890–1970","f":"政治军事","h":["公元20世纪,和丘吉尔、罗斯福同时代","出生在里尔,军人家庭出身","军人、政治家,标准身高接近两米","在二战法国投降后坚持抵抗,领导自由法国,战后创立了一个共和国并当总统","著有战争回忆录和战争行动论,还提出过职业军队的理论","1940年流亡伦敦时通过广播发表演说号召抵抗,当时几乎没人听得到","今天巴黎机场以他命名,法国政治制度的基本框架就是他设计的","他两度执掌法国,1968年学生运动后退隐"],"y":[1890,1970]},{"n":"萨特","a":["Jean-Paul Sartre","让-保罗·萨特"],"c":"FRA","r":"欧洲","e":"1905–1980","f":"思想哲学","h":["公元20世纪,和加缪、戴高乐同时代","巴黎,出身知识分子家庭","哲学家、剧作家、小说家,是存在主义的代表人物","提出存在先于本质,把自由和责任讲成一套哲学,还写了几百万字论述想象和辩证法","著有存在与虚无、恶心、禁闭、辩证理性批判","拒绝了1964年的诺贝尔文学奖,说不想被变成一个机构;和女哲学家波伏娃终身伴侣但不结婚","今天那句他人即地狱常被引用,他的存在主义是二十世纪最流行的哲学名词","他拒绝了诺贝尔文学奖"],"y":[1905,1980],"s":"思想·哲学"},{"n":"加缪","a":["Albert Camus","阿尔贝·加缪"],"c":"FRA","r":"欧洲","e":"1913–1960","f":"文学艺术","h":["公元20世纪,和萨特、戴高乐同时代","出生在阿尔及利亚的贫民家庭,父亲一战中战死,母亲是文盲","作家、哲学家,当过记者,还组织过剧团","写出关于荒诞的哲学和小说,成为最年轻的诺贝尔文学奖得主之一","著有局外人、西西弗神话、鼠疫、堕落","在局外人开头写今天妈妈死了也许是昨天,用这种语气震动了整个文学界;四十七岁死于车祸","今天西西弗斯推石头是讲荒诞和反抗时最常用的比喻","他那句必须想象西西弗是幸福的是全书的收尾"],"y":[1913,1960],"s":"文学"},{"n":"古腾堡","a":["Johannes Gutenberg","约翰内斯·古腾堡"],"c":"DEU","r":"欧洲","e":"约1400–1468","f":"科学发明","h":["公元15世纪,和明朝的郑和、百年战争同时代","德意志的美因茨,莱茵河畔","工匠、发明家,出身贵族家庭但后来破产","把活字印刷和油墨、压印机结合起来,造出了欧洲第一台实用的印刷机","他印的第一件大作品是一本拉丁文圣经,现存不到五十部","为了打官司他把印刷设备和印好的圣经都赔给了合伙人,晚年靠大主教给的津贴过活","今天他被选为千年最伟大发明家之一,印刷术被视为近代信息革命的起点","他印的那本圣经现在每本都价值上千万美元"],"y":[1400,1468],"s":"科学·技术"},{"n":"马丁·路德","a":["Martin Luther","马丁路德"],"c":"DEU","r":"欧洲","e":"1483–1546","f":"宗教神话","h":["公元15到16世纪,和明朝的嘉靖、达芬奇同时代","德意志的艾斯莱本出生,长期在维滕贝格大学任教","神学家、修士,原本是法学学生,被雷劈过之后进了修道院","发起宗教改革,把九十五条论纲钉在教堂门口,还把圣经翻译成德文","译出的德文圣经奠定了现代德语的基础,他还写了大量赞美诗和教义文章","在帝国议会上被要求撤回主张,他说除非用圣经说服我,否则我不能也不会撤回","今天新教各派都从他开始,德语里很多常用表达来自他译的圣经","他在瓦特堡翻译圣经时据说把墨水泼向了魔鬼"],"y":[1483,1546],"s":"宗教·神话"},{"n":"开普勒","a":["Johannes Kepler","约翰内斯·开普勒"],"c":"DEU","r":"欧洲","e":"1571–1630","f":"科学发明","h":["公元16到17世纪,和伽利略、莎士比亚后期同时代","出生在德意志南部,一生在奥地利、布拉格等地辗转","天文学家、数学家,原本想当牧师,被派去教数学","发现行星运动的三大定律,证明行星轨道是椭圆而不是正圆,为后来万有引力打下基础","著有新天文学、世界的和谐、鲁道夫星表","给一位丹麦天文学家当助手,对方去世后他继承了二十年的观测数据;母亲曾被指控为女巫,他亲自写辩护书救下她","今天所有天文课本都要讲他那三条定律,他还写过一部科幻小说叫梦","他说过我在为后世写作"],"y":[1571,1630],"s":"科学·技术"},{"n":"巴赫","a":["Johann Sebastian Bach","约翰·塞巴斯蒂安·巴赫"],"c":"DEU","r":"欧洲","e":"1685–1750","f":"文学艺术","h":["公元17到18世纪,和牛顿、伏尔泰同时代","德意志中部,一生在魏玛、克滕和莱比锡工作","作曲家、管风琴师,出身音乐世家,生了二十个孩子","把巴洛克音乐推向顶点,写下了上千部作品,涵盖几乎所有体裁","代表作有勃兰登堡协奏曲、平均律键盘曲集、马太受难曲、赋格的艺术","去世时作品被当成过时的对位法练习,五十年后门德尔松重新演出他的受难曲才把他挖出来","今天学古典音乐的人人手一册平均律,被称作音乐之父","他晚年双目失明,还在口述最后的作品"],"y":[1685,1750],"s":"音乐"},{"n":"歌德","a":["Johann Wolfgang von Goethe","约翰·沃尔夫冈·冯·歌德"],"c":"DEU","r":"欧洲","e":"1749–1832","f":"文学艺术","h":["公元18到19世纪,和莫扎特、拿破仑同时代","出生在法兰克福,长期在魏玛小公国当官","作家、诗人、科学家,还做过首相,研究过植物和颜色","写出德语文学最重要的作品,还写了几十年才完成一部上下两卷的诗剧","著有少年维特之烦恼、浮士德、威廉·迈斯特","年轻时那本小说让欧洲青年模仿主角穿蓝衣黄裤甚至自杀;他还曾经独自去意大利旅行两年不告诉任何人","今天浮士德是德语文学的最高峰,那句永恒之女性引领我们上升是全书结尾","他和一个造字的人比赛谁先发明了人类颚间骨"],"y":[1749,1832],"s":"文学"},{"n":"席勒","a":["Friedrich Schiller","弗里德里希·席勒"],"c":"DEU","r":"欧洲","e":"1759–1805","f":"文学艺术","h":["公元18到19世纪,和歌德、莫扎特同时代","出生在符腾堡,后来定居魏玛","诗人、剧作家、历史学家,还当过军医","写下德语文学最著名的几部戏剧和一首人人会背的诗,那首诗后来被贝多芬谱成合唱","著有强盗、阴谋与爱情、华伦斯坦、欢乐颂","因为剧本得罪公爵被禁足,他连夜逃出领地;和歌德从互相看不顺眼变成挚友,死后歌德为他建了墓","今天欧盟的盟歌便以他写的那首诗为歌词,德国大学里到处有他的雕像","欢乐颂的歌词是他写的"],"y":[1759,1805],"s":"文学"},{"n":"莫扎特","a":["Wolfgang Amadeus Mozart","沃尔夫冈·阿马德乌斯·莫扎特"],"c":"AUT","r":"欧洲","e":"1756–1791","f":"文学艺术","h":["公元18世纪,和歌德、路易十六同时代","出生在奥地利萨尔茨堡,后半生定居维也纳","作曲家、演奏家,四岁开始作曲,六岁欧洲巡演","写下六百多部作品,涵盖歌剧、交响曲、协奏曲、室内乐几乎所有体裁","代表作有费加罗的婚礼、魔笛、唐璜、安魂曲、四十号交响曲","一生穷困潦倒,负债累累,三十五岁去世时《安魂曲》还没写完,没人知道他葬在哪里","今天他的音乐是全世界演出最多的,电影把那句上帝的音乐搬上银幕","魔笛和费加罗的婚礼是他写的,他五岁就写出了第一首曲子"],"y":[1756,1791],"s":"音乐"},{"n":"康德","a":["Immanuel Kant","伊曼努尔·康德"],"c":"DEU","r":"欧洲","e":"1724–1804","f":"思想哲学","h":["公元18到19世纪,和歌德、美国的华盛顿同时代","东普鲁士的柯尼斯堡,一辈子没出过远门","哲学家,当过家庭教师和大学教授","写出三部批判,把认识论彻底重写,提出人为自然立法","著有纯粹理性批判、实践理性批判、判断力批判","每天散步时间精确到邻居可以据此对表,唯一一次打乱是因为读卢梭的《爱弥儿》读得忘了时间","今天哲学系的第一门必修课就是他,那句头顶的星空和心中的道德律被刻在他的墓碑上","他提出过永久和平的设想,影响了后来的国际组织"],"y":[1724,1804],"s":"思想·哲学"},{"n":"贝多芬","a":["Ludwig van Beethoven","路德维希·凡·贝多芬"],"c":"DEU","r":"欧洲","e":"1770–1827","f":"文学艺术","h":["公元18到19世纪,和歌德、拿破仑同时代","出生在波恩,二十二岁移居维也纳","作曲家、钢琴家,父亲是个酗酒的男高音","把古典音乐推向浪漫主义,写下九部交响曲和大量奏鸣曲、协奏曲","代表作有第九交响曲、命运交响曲、月光奏鸣曲、英雄交响曲","三十岁开始失聪,四十多岁完全听不见还继续指挥和作曲,据说曾在维也纳甩下一句我这样的天才你们不懂","今天欧盟的盟歌用的就是他第九交响曲的旋律,那段旋律全球都能哼","他写第九交响曲时已经完全听不见了"],"y":[1770,1827],"s":"音乐"},{"n":"黑格尔","a":["G.W.F. Hegel","格奥尔格·威廉·弗里德里希·黑格尔"],"c":"DEU","r":"欧洲","e":"1770–1831","f":"思想哲学","h":["公元18到19世纪,和贝多芬、歌德同时代","出生在斯图加特,后来在耶拿、海德堡和柏林任教","哲学家,年轻时当过家庭教师和报纸编辑","建立了一个包罗万象的哲学体系,用辩证法讲历史的演进","著有精神现象学、逻辑学、法哲学原理、历史哲学讲演录","他的体系被后世撕成左右两派,一派发展出了费尔巴哈和马克思,一派成了保守主义的源头","今天辩证法这个词几乎无人不知,他的正反合三段式更是被到处套用","他说过凡合理的都是现实的"],"y":[1770,1831],"s":"思想·哲学"},{"n":"叔本华","a":["Arthur Schopenhauer","阿图尔·叔本华"],"c":"DEU","r":"欧洲","e":"1788–1860","f":"思想哲学","h":["公元19世纪,和贝多芬、拿破仑同时代","出生在但泽,父亲是富商,母亲是作家","哲学家,继承了父亲遗产所以终身不用工作","把世界解释为意志和表象,认为人生在痛苦与无聊之间摇摆","著有作为意志和表象的世界、附录与补遗","和母亲关系恶劣到断绝来往,在柏林大学故意把自己的课排在黑格尔同一时间,结果没人来听","今天他说过的关于独处和人生的句子在社交网络上被疯狂转发,尼采和瓦格纳都受他影响","他养了一条卷毛狗叫宇宙精神"],"y":[1788,1860],"s":"思想·哲学"},{"n":"高斯","a":["Carl Friedrich Gauss","卡尔·弗里德里希·高斯"],"c":"DEU","r":"欧洲","e":"1777–1855","f":"科学发明","h":["公元18到19世纪,和贝多芬、拿破仑同时代","德意志不伦瑞克出身,长期在哥廷根天文台工作","数学家、天文学家、物理学家,出身贫寒但被公爵资助上学","在数论、代数、统计、电磁学、测地学都留下奠基性成果,还发明了电报的早期形态","著有算术研究,还有大量未发表的手稿和日记","十岁就算出1加到100等于5050,十九岁发现正十七边形可以用尺规作图","今天统计学里那条钟形曲线以他命名,磁场的单位也是以他命名的","他被称作数学王子"],"y":[1777,1855],"s":"科学·技术"},{"n":"瓦格纳","a":["Richard Wagner","理查德·瓦格纳"],"c":"DEU","r":"欧洲","e":"1813–1883","f":"文学艺术","h":["公元19世纪,和俾斯麦、尼采同时代","出生于莱比锡,后半生在拜罗伊特建了自己的剧院","作曲家、剧作家,自己写剧本自己谱曲","创造了乐剧这种形式,写出一部连演四晚的巨型神话歌剧,还建了一座专演自己作品的剧院","代表作有尼伯龙根的指环、特里斯坦与伊索尔德、罗恩格林","一生负债、被通缉、逃亡,靠一位国王的资助才完成大事;尼采曾狂热崇拜他后来彻底决裂","今天电影配乐里那种排山倒海的手法都源自他,婚礼进行曲是他写的","尼伯龙根的指环要连演四个晚上,共约十五小时"],"y":[1813,1883],"s":"音乐"},{"n":"俾斯麦","a":["Otto von Bismarck","奥托·冯·俾斯麦"],"c":"DEU","r":"欧洲","e":"1815–1898","f":"政治军事","h":["公元19世纪,和李鸿章、维多利亚女王同时代","普鲁士容克贵族出身,当过多国大使","政治家、首相,被称为铁血宰相","用三场战争统一了德意志,建立了帝国,还创立了世界上最早的养老和医疗保险体系","著有回忆录《思考与回忆》和大量书信","他说过当代的重大问题不是靠演讲和多数决议解决的,而是靠铁和血;晚年被新皇帝赶下台","今天德国的社保体系源头在他,他成了现实主义政治的代名词","他统一了德国,却警告说不要碰巴尔干那堆麻烦"],"y":[1815,1898]},{"n":"马克思","a":["Karl Marx","卡尔·马克思"],"c":"DEU","r":"欧洲","e":"1818–1883","f":"思想哲学","h":["公元19世纪,和俾斯麦、达尔文同时代","出生在普鲁士的特里尔,一生流亡巴黎、布鲁塞尔和伦敦","哲学家、经济学家、记者,因为言论被多个国家驱逐","写出一套分析资本主义的理论体系,影响了此后一百多年的世界历史","著有资本论、共产党宣言、德意志意识形态、1844年经济学哲学手稿","在大英博物馆的阅览室里坐了十几年写资本论,穷到当掉外套没法出门,靠恩格斯的钱养活一家","今天大学里的政治经济学还在讲他的剩余价值理论,各国政治运动都把他当源头","他的墓碑上刻着全世界无产者联合起来"],"y":[1818,1883],"s":"思想·哲学"},{"n":"尼采","a":["Friedrich Nietzsche","弗里德里希·尼采"],"c":"DEU","r":"欧洲","e":"1844–1900","f":"思想哲学","h":["公元19世纪,和俾斯麦、瓦格纳同时代","出生于普鲁士的洛肯,二十四岁就当上巴塞尔大学教授","哲学家、古典语言学家,早期研究古希腊,后来辞职到处疗养","宣布上帝已死,提出超人、权力意志和永恒轮回,把西方道德做了一次彻底的清算","著有查拉图斯特拉如是说、善恶的彼岸、道德的谱系、偶像的黄昏","四十五岁在都灵抱住一匹被鞭打的马后精神崩溃,此后十一年由母亲和妹妹照顾","今天他那句凡杀不死我的必使我更强大被印在无数T恤和健身房里","他说过当你凝视深渊时深渊也在凝视你"],"y":[1844,1900],"s":"思想·哲学"},{"n":"弗洛伊德","a":["Sigmund Freud","西格蒙德·弗洛伊德"],"c":"AUT","r":"欧洲","e":"1856–1939","f":"科学发明","h":["公元19到20世纪,和爱因斯坦、卡夫卡同时代","出生在摩拉维亚,四岁随家搬到维也纳,晚年流亡伦敦","医生、心理学家,神经科医生出身,还研究过可卡因","创立精神分析,提出无意识、本我自我超我、俄狄浦斯情结这些概念,开创了现代心理治疗","著有梦的解析、精神分析引论、文明及其不满","每天抽二十支雪茄,下颌癌做了三十多次手术;纳粹吞并奥地利后他付了一笔税才被允许离开","今天流行文化里说一个人有心理问题、说梦的象征,都还是他那套框架","梦的解析是他的代表作,他提出的疗法叫精神分析"],"y":[1856,1939],"s":"科学·技术"},{"n":"爱因斯坦","a":["Albert Einstein","阿尔伯特·爱因斯坦"],"c":"DEU","r":"欧洲","e":"1879–1955","f":"科学发明","h":["公元20世纪,和居里夫人、罗斯福同时代","出生在德国乌尔姆,在瑞士读书工作,后来流亡美国","物理学家,小时候说话晚,考大学第一次没考上,毕业后在专利局当小职员","提出狭义和广义相对论,解释了光电效应,拿过诺贝尔物理学奖","提出质能方程,还留下大量论文和给后人的公开信","1905年一年内发表了四篇改变物理学的论文,当时他只是个专利局三级技术员","今天他那张吐舌头的照片是全球最著名的科学家头像,名字成了天才的代名词","E=mc²是他写的,他的相对论改变了时间和空间的理解"],"y":[1879,1955],"s":"科学·技术"},{"n":"卡夫卡","a":["Franz Kafka","弗朗茨·卡夫卡"],"c":"CZE","r":"欧洲","e":"1883–1924","f":"文学艺术","h":["公元20到20世纪早期,和爱因斯坦、弗洛伊德同时代","出生在布拉格,说德语,是犹太商人家庭的孩子","作家、保险公司的职员,一辈子上班写材料,晚上写作","写出一个被荒诞的官僚系统困住的文学世界,成了二十世纪文学的标志","著有变形记、审判、城堡、致父亲的信","临死前让朋友烧掉他所有未发表的手稿,朋友没照做,我们今天才读到那些作品","今天形容莫名其妙的官僚折磨,直接用他的名字造了个形容词","变形记开头是一个人早上醒来发现自己变成了虫子"],"y":[1883,1924],"s":"文学"},{"n":"希特勒","a":["Adolf Hitler","阿道夫·希特勒"],"c":"DEU","r":"欧洲","e":"1889–1945","f":"政治军事","h":["公元20世纪,和罗斯福、斯大林、邱吉尔同时代","出生在奥地利边境小城,后来入了德国籍","政治领袖,年轻时考维也纳美术学院两次落榜,靠卖画为生","发动了人类历史上规模最大的战争,推行种族灭绝,造成数千万人死亡","著有《我的奋斗》和大量演讲记录","从街头鼓动到被选为总理只用几年,最后在地堡中自杀,遗体被焚烧","今天他是历史上最臭名昭著的人物,被禁止在德国公开宣传,影视里的恶人模板常以他为原型","他策划了第二次世界大战和大屠杀"],"y":[1889,1945]},{"n":"但丁","a":["Dante Alighieri","但丁·阿利吉耶里"],"c":"ITA","r":"欧洲","e":"1265–1321","f":"文学艺术","h":["公元13到14世纪,和忽必烈、马可波罗同时代","佛罗伦萨出身,后来被流放,死于拉文纳","诗人、政治家,当过佛罗伦萨的行政官","写出西方文学史上最伟大的长诗之一,用意大利俗语而不是拉丁文写的","那部诗分地狱、炼狱、天堂三部分,一共一百章,把他从政敌到教皇都安排进了地狱","因为政治斗争被永久流放,再也没回过故乡,他说过自己尝到了别人家的面包有多咸","今天意大利语被称为他的语言,意大利多处有他的面具雕像","神曲的作者,他给地狱画了九层"],"y":[1265,1321],"s":"文学"},{"n":"马可·波罗","a":["Marco Polo","马可波罗"],"c":"ITA","r":"欧洲","e":"1254–1324","f":"探索冒险","h":["公元13到14世纪,和忽必烈、但丁同时代","出生在威尼斯商人家庭,一生走了大半个欧亚大陆","旅行家、商人,十七岁随父亲和叔叔出发","在中国待了十几年,据说还当了元朝的官,回国后口述了一本书讲述东方","那本书记载了中国的纸币、煤、驿站和大汗的宫殿,由同狱的作家代笔","回国后在一场海战中被俘入狱,在狱里口述了那本书;临终前有人说他的故事都是编的","今天很多西方人最早关于中国的想象就来自他那本书,他还被指未必真的到过中国","他说东方遍地黄金,那本书叫马可波罗游记"],"y":[1254,1324],"s":"探险·航天"},{"n":"达芬奇","a":["Leonardo da Vinci","列奥纳多·达·芬奇"],"c":"ITA","r":"欧洲","e":"1452–1519","f":"文学艺术","h":["公元15到16世纪,和米开朗基罗、哥伦布同时代","出生在意大利托斯卡纳的小镇,一生在佛罗伦萨、米兰、罗马和法国之间辗转","画家、发明家、解剖学家、工程师,私生子出身没受过正规教育","画出世界上最著名的两幅画,还留下了大量科学手稿设计飞行器和装甲车","留下七千多页手稿,里面有人体解剖图、飞行器、齿轮和一幅维特鲁威人","为了画出人体比例亲手解剖了三十多具尸体,还设计过潜水服和舞台机械","今天蒙娜丽莎是卢浮宫的镇馆之宝,他那张维特鲁威人也成了文化符号","蒙娜丽莎和最后的晚餐都是他画的"],"y":[1452,1519],"s":"美术与建筑"},{"n":"米开朗基罗","a":["Michelangelo","米开朗基罗·博那罗蒂"],"c":"ITA","r":"欧洲","e":"1475–1564","f":"文学艺术","h":["公元15到16世纪,和达芬奇、拉斐尔同时代","出生在意大利卡普雷塞,主要工作在佛罗伦萨和罗马","雕塑家、画家、建筑师、诗人,脾气极大没人敢惹","雕出西方美术史最著名的两尊大理石像,还独自画完了一整座礼拜堂的穹顶","代表作有大卫像、哀悼基督、西斯廷天顶画、最后的审判","为了画天顶画仰着头工作了四年,颜料滴得满脸都是;去世后遗体被偷偷运回佛罗伦萨","今天大卫像是佛罗伦萨的象征,圣彼得大教堂的穹顶也是他设计的","他用一块别人丢掉的废石块雕出了大卫"],"y":[1475,1564],"s":"美术与建筑"},{"n":"拉斐尔","a":["Raphael","拉斐尔·桑西"],"c":"ITA","r":"欧洲","e":"1483–1520","f":"文学艺术","h":["公元15到16世纪,和达芬奇、米开朗基罗同时代","出生在乌尔比诺,后来在佛罗伦萨和罗马工作","画家、建筑师,父亲就是画家,十一岁成了孤儿","画风以和谐优美著称,画出文艺复兴最著名的壁画之一,把古希腊哲人聚在一个大厅里","代表作有雅典学院、西斯廷圣母、椅中圣母","三十七岁生日那天突然高烧去世,罗马全城为他送葬;他一生春风得意,和米开朗基罗的苦脸形成对比","今天雅典学院那幅画里的柏拉图长得像达芬奇,而那幅画是梵蒂冈签字厅的壁画","他被称为文艺复兴三杰中最年轻的一位"],"y":[1483,1520],"s":"美术与建筑"},{"n":"马基雅维利","a":["Niccolò Machiavelli","尼可罗·马基雅维利"],"c":"ITA","r":"欧洲","e":"1469–1527","f":"思想哲学","h":["公元15到16世纪,和达芬奇、哥白尼同时代","佛罗伦萨,当过共和国第二国务厅长官","政治家、外交家、作家,出使各国多年","写出一本薄薄的小书,把政治和道德彻底分开讲,成了现代政治学的起点","著有君主论、论李维、佛罗伦萨史,还写过喜剧","共和国倒台后他被解职拷打,退居乡下白天种地晚上穿上礼服在书房读书","今天他的姓氏变成了一个形容词,形容为达目的不择手段的现实政治","君主论的作者,他说君主该像狐狸又像狮子"],"y":[1469,1527],"s":"思想·哲学"},{"n":"伽利略","a":["Galileo Galilei","伽利略·伽利雷"],"c":"ITA","r":"欧洲","e":"1564–1642","f":"科学发明","h":["公元16到17世纪,和莎士比亚同一年出生,和牛顿的前夜","比萨出身,长期在佛罗伦萨和比萨任教","物理学家、天文学家,还爱好音乐和绘画","用望远镜发现木星的四颗卫星和金星相位,支持日心说,还研究了摆和自由落体","著有关于两大世界体系的对话、关于两门新科学的对话","被宗教裁判所审判并判终身软禁,据说宣判后他低声说了句可它仍在转动","今天他被称作近代科学之父,教皇在二十世纪才正式为他平反","他在比萨斜塔做落体实验的故事流传很广"],"y":[1564,1642],"s":"科学·技术"},{"n":"哥伦布","a":["Christopher Columbus","克里斯托弗·哥伦布"],"c":"ESP","r":"欧洲","e":"1451–1506","f":"探索冒险","h":["公元15到16世纪,和达芬奇、米开朗基罗同时代","出生在热那亚,后来为西班牙王室工作","航海家,织布工的儿子,自学航海和地理","四次横渡大西洋,把欧洲人带到了美洲,拉开了大航海时代","留下航海日志和大量书信","他算错了地球周长,以为往西很快能到亚洲,结果撞上一块他至死都以为是印度的地方","今天美洲还有以他命名的节日和城市,关于他的雕像该怎么处理争论了几十年","他至死都以为自己到的是亚洲,所以加勒比海岛屿被叫西印度群岛"],"y":[1451,1506],"s":"探险·航天"},{"n":"麦哲伦","a":["Ferdinand Magellan","费迪南德·麦哲伦"],"c":"PRT","r":"欧洲","e":"1480–1521","f":"探索冒险","h":["公元15到16世纪,和哥伦布、达芬奇同时代","葡萄牙人,后来为西班牙王室效力","航海家,出身贵族家庭,当过水手和军官","率船队第一次环球航行,找到了连接大西洋和太平洋的海峡,还第一次给太平洋命名","没有留下著作,但有随行人员写的航行记","船队出发时五艘船两百多人,他自己在菲律宾的岛上冲突中被杀,最后只有一艘船十八个人回到西班牙","今天南美洲南端的那条海峡以他命名,夜空中有两片星系也以他命名","他证明了地球是圆的,那趟航行用了三年"],"y":[1480,1521],"s":"探险·航天"},{"n":"达伽马","a":["Vasco da Gama","瓦斯科·达·伽马"],"c":"PRT","r":"欧洲","e":"1460–1524","f":"探索冒险","h":["公元15到16世纪,和哥伦布、麦哲伦同时代","葡萄牙,从里斯本出海","航海家、贵族,贵族出身当过海军军官","绕好望角开辟了欧洲直达印度的航线,第一次打通了海上香料之路","没留下著作,只有航海日志和史料记载","第一次远航回程时船员大批死于坏血病,出发时一百七十人回来只剩五十四人","今天葡萄牙里斯本有一座以他命名的斜拉桥,是欧洲最长的桥之一","他找到的这条航线让葡萄牙称霸印度洋一百年"],"y":[1460,1524],"s":"探险·航天"},{"n":"塞万提斯","a":["Miguel de Cervantes","米格尔·德·塞万提斯"],"c":"ESP","r":"欧洲","e":"1547–1616","f":"文学艺术","h":["公元16到17世纪,和莎士比亚同时代,两人在同一年去世","出生在西班牙的埃纳雷斯堡,一生颠沛","作家、士兵,左手在勒班陀海战中被打残,后来被海盗掳到阿尔及尔做了五年奴隶","写出被公认为第一部现代小说的作品,讲一个读骑士小说读疯了的瘦老头","著有堂吉诃德、训诫小说集,他还坐过牢","在狱中开始构思那部小说,出版后大卖,却一辈子穷困,死时被草草埋葬","今天堂吉诃德和风车成了不朽的意象,西班牙语常被称作塞万提斯的语言","他笔下的骑士把风车当成巨人"],"y":[1547,1616],"s":"文学"},{"n":"毕加索","a":["Pablo Picasso","巴勃罗·毕加索"],"c":"ESP","r":"欧洲","e":"1881–1973","f":"文学艺术","h":["公元20世纪,和爱因斯坦、达利同时代","出生在西班牙马拉加,一生大多在法国生活","画家、雕塑家,父亲是美术老师,十几岁就画得像大师","开创立体主义,把画面上的人脸拆成几何块,是二十世纪最有影响力的艺术家","代表作有亚维农少女、格尔尼卡、哭泣的女人","一幅反战巨画是为一座被轰炸的小镇画的,他还说过我不是在寻找,我是在发现","今天他的作品拍出过上亿美元,是拍卖纪录的常客","格尔尼卡是最著名的反战画作之一"],"y":[1881,1973],"s":"美术与建筑"},{"n":"伦勃朗","a":["Rembrandt","伦勃朗·哈尔曼松·凡·莱因"],"c":"NLD","r":"欧洲","e":"1606–1669","f":"文学艺术","h":["公元17世纪,和伽利略、牛顿同时代","荷兰莱顿出身,一生在阿姆斯特丹","画家,磨坊主家庭,年轻时学生众多收入丰厚","以光影对比和肖像画著称,留下一批自画像记录了自己从青年到落魄的一生","代表作有夜巡、杜尔博士的解剖学课,还有近百幅自画像","晚年破产,财产被拍卖,妻子和几个孩子都先他去世,死时只有一件旧外套","今天他被公认为荷兰黄金时代最伟大的画家,夜巡在阿姆斯特丹国家博物馆独占一面墙","他一生画了八十多幅自己的脸"],"y":[1606,1669],"s":"美术与建筑"},{"n":"梵高","a":["Vincent van Gogh","文森特·梵高"],"c":"NLD","r":"欧洲","e":"1853–1890","f":"文学艺术","h":["公元19世纪,和莫奈、居里夫人同时代","出生在荷兰南部,后来在法国南部作画","画家,做过画商、教师、牧师,二十七岁才开始学画","画出后印象派最著名的作品,用粗厚笔触和强烈色彩表达情绪","留下两千多幅画,主要是星空、向日葵、麦田系列,还有写给弟弟的几百封信","一生只卖出过一幅画,靠弟弟接济生活,三十七岁在麦田里中枪去世","今天他的画拍出过几亿美元,他的书信集是研究他的重要材料","他在法国南部画出了那片旋转的星空"],"y":[1853,1890],"s":"美术与建筑"},{"n":"伊拉斯谟","a":["Erasmus","德西德里乌斯·伊拉斯谟"],"c":"NLD","r":"欧洲","e":"1466–1536","f":"思想哲学","h":["公元15到16世纪,和达芬奇、马丁·路德同时代","出生在鹿特丹,一生在欧洲各国游学","学者、神学家,私生子出身,当过修士","用人文主义的方法整理古典文本,编出第一部希腊文新约校勘本,还写书讽刺教会","著有愚人颂、箴言集、论自由意志","一生拒绝所有阵营的站队邀请,路德邀请他加入改革,他拒绝,结果两边都骂他","今天他被称作北方文艺复兴的代表,欧洲有一个以他命名的奖学金项目","愚人颂是他的代表作"],"y":[1466,1536],"s":"思想·哲学"},{"n":"安徒生","a":["Hans Christian Andersen","汉斯·克里斯蒂安·安徒生"],"c":"DNK","r":"欧洲","e":"1805–1875","f":"文学艺术","h":["公元19世纪,和狄更斯、维多利亚女王同时代","丹麦欧登塞出身,十四岁独自去哥本哈根闯荡","作家、诗人,鞋匠和洗衣妇的儿子,小时候口吃被嘲笑","写出一百多部童话,把童话从民间故事变成了现代文学体裁","著有海的女儿、丑小鸭、卖火柴的小女孩、皇帝的新装","他到死都保留着童年时收到的一只小锡兵;曾暗恋过好几个人都没结果,一辈子独身","今天他的童话被翻译成一百多种语言,小美人鱼的铜像坐在哥本哈根港口","皇帝的新装和卖火柴的小女孩是他写的"],"y":[1805,1875],"s":"文学"},{"n":"诺贝尔","a":["Alfred Nobel","阿尔弗雷德·诺贝尔"],"c":"SWE","r":"欧洲","e":"1833–1896","f":"科学发明","h":["公元19世纪,和马克思、维多利亚女王同时代","出生在斯德哥尔摩,一生在俄国、法国和意大利之间奔波","化学家、工程师、企业家,会好几种语言","发明了安全炸药并拿到几百项专利,靠军火和石油生意积累巨额财富","没留下著作,但留下一份影响世界的遗嘱","报刊误把他的死讯当成他哥哥的登了出来,标题叫他死亡商人,这促使他决定把遗产用于奖励人类","今天以他命名的奖是最受关注的国际奖项,每年在奥斯陆和斯德哥尔摩颁发","他的遗嘱设立了五个奖项"],"y":[1833,1896],"s":"科学·技术"},{"n":"哥白尼","a":["Nicolaus Copernicus","尼古拉·哥白尼"],"c":"POL","r":"欧洲","e":"1473–1543","f":"科学发明","h":["公元15到16世纪,和达芬奇、米开朗基罗同时代","波兰的托伦出身,一生大半在弗龙堡教堂任职","天文学家、教士、医生,还翻译过诗歌","提出太阳而不是地球才是宇宙中心,把天文学从一千多年的地心说里翻了过来","著有天球运行论,一直拖到去世那年才出版","他生前不敢出版这本书,因为怕被教会攻击,直到临死前才看到印出来的样书","今天日心说是科学革命的起点,化学元素中有一种以他命名","他的学说后来被伽利略和开普勒证实"],"y":[1473,1543],"s":"科学·技术"},{"n":"肖邦","a":["Frédéric Chopin","弗雷德里克·肖邦"],"c":"POL","r":"欧洲","e":"1810–1849","f":"文学艺术","h":["公元19世纪,和雨果、维多利亚女王同时代","出生在波兰华沙附近,二十岁后定居巴黎","作曲家、钢琴家,父亲是法国人母亲是波兰人","一生几乎只为钢琴写作,把这种乐器推到了新的诗意高度","写下两百多部作品,包括夜曲、玛祖卡、波兰舞曲、练习曲","离开波兰后再也没能回国,朋友带着一杯祖国的泥土撒在他的墓上;他要求死后把自己心脏送回华沙","今天国际钢琴比赛以他命名,那句弹钢琴的人绕不开他是事实","他被称为钢琴诗人,葬礼上演奏的是他的葬礼进行曲"],"y":[1810,1849],"s":"音乐"},{"n":"易卜生","a":["Henrik Ibsen","亨里克·易卜生"],"c":"NOR","r":"欧洲","e":"1828–1906","f":"文学艺术","h":["公元19到20世纪,和安徒生、马克思同时代","挪威小镇希恩出身,家境中落后当过药店学徒","剧作家、导演,一生在挪威、意大利和德国之间旅居","写出多部撕开社会面纱的现代戏剧,被认为是现代戏剧之父","著有玩偶之家、人民公敌、培尔·金特、野鸭","玩偶之家里女主角最后摔门而去的那一声响震动了整个欧洲,剧院一度不敢上演","今天西方戏剧史必讲他的现实主义,那句女人首先是一个人成了女性主义的经典台词","玩偶之家的女主角叫娜拉"],"y":[1828,1906],"s":"电影与戏剧"},{"n":"彼得大帝","a":["Peter the Great","彼得一世"],"c":"RUS","r":"欧洲","e":"1672–1725","f":"政治军事","h":["公元17到18世纪,和康熙、牛顿同时代","俄国,把首都从莫斯科迁到波罗的海边的新城","沙皇,十岁即位,身高超过两米","把一个内陆落后的国家改造成欧洲强国,建了海军,还在海边凭空造出一座新都","留下大量诏令和书信,还亲自办报纸、改革文字","化名混进一个欧洲使团去荷兰船厂当木匠学造船,回国后亲手给大臣剪胡子","今天圣彼得堡就是他建的那座城,那尊青铜骑士雕像成了城市象征","他把首都建在涅瓦河口的沼泽上"],"y":[1672,1725]},{"n":"叶卡捷琳娜二世","a":["Catherine the Great","叶卡捷琳娜大帝"],"c":"RUS","r":"欧洲","e":"1729–1796","f":"政治军事","h":["公元18世纪,和伏尔泰、华盛顿同时代","出生在普鲁士的什切青,后来入主俄国宫廷","女皇,原本是德国小公国的公主,被选为皇储之妻","在位三十四年,把俄国疆域向南向西大幅扩张,还推行过启蒙式的改革和疫苗接种","留下大量书信、诏令和回忆录,还和伏尔泰通信十几年","发动宫廷政变废掉自己的丈夫登上皇位,和多位情人共同执政,其中一位成了她的重臣","今天俄国史书上称她为大帝,是历史上少数被冠以这个称号的女性君主","她曾带头接种天花疫苗做示范"],"y":[1729,1796]},{"n":"普希金","a":["Alexander Pushkin","亚历山大·普希金"],"c":"RUS","r":"欧洲","e":"1799–1837","f":"文学艺术","h":["公元19世纪,和拿破仑、贝多芬同时代","莫斯科出身,祖上有非洲血统,一生大半在圣彼得堡","诗人、作家,出身贵族,年轻时因为写政治诗被流放","被公认为俄语文学的奠基人,把俄语从宫廷法语的影响里解放出来","著有叶甫盖尼·奥涅金、上尉的女儿、渔夫和金鱼的故事","因为妻子被人追求,他决斗受了致命伤,三十七岁就去世了","今天俄语被称为他的语言,俄国到处有他的雕像","他写过一个渔夫捞到金鱼的故事"],"y":[1799,1837],"s":"文学"},{"n":"果戈里","a":["Nikolai Gogol","尼古拉·果戈里"],"c":"UKR","r":"欧洲","e":"1809–1852","f":"文学艺术","h":["公元19世纪,和普希金、狄更斯同时代","出生在乌克兰的哥萨克家庭,后来长期在圣彼得堡和罗马","作家、剧作家,当过小公务员,靠普希金提供的故事素材写出成名作","创立了俄国讽刺文学的传统,用荒诞和笑声揭穿官僚和农奴制的丑恶","著有死魂灵、钦差大臣、外套、塔拉斯·布尔巴","晚年在宗教狂热中烧掉了《死魂灵》第二部的手稿,十天后绝食而死","今天那句俄罗斯文学的荒诞传统从他开始,钦差大臣还在各国舞台上演","他的外套被认为开启了俄国现实主义文学"],"y":[1809,1852],"s":"文学"},{"n":"舍甫琴科","a":["Taras Shevchenko","塔拉斯·舍甫琴科"],"c":"UKR","r":"欧洲","e":"1814–1861","f":"文学艺术","h":["公元19世纪,和果戈里、马克思同时代","乌克兰的农奴家庭出身,一生大半在流放中度过","诗人、画家,出生时就是地主的农奴","用乌克兰语写出了民族文学的奠基作品,被誉为乌克兰现代文学之父","著有科布扎尔诗集,还留下了大量绘画","靠一位画家出钱替他赎身才获得自由,后来因为参加秘密团体被流放十年,期间被禁止写作和绘画","今天乌克兰有一所国立大学以他命名,他的画像印在乌克兰货币上","他写诗用的语言当时被官方禁止出版"],"y":[1814,1861],"s":"文学"},{"n":"裴多菲","a":["Petőfi Sándor","山陀尔·裴多菲"],"c":"HUN","r":"欧洲","e":"1823–1849","f":"文学艺术","h":["公元19世纪,和肖邦、马克思同时代","匈牙利,出身屠户家庭,当过兵和流浪艺人","诗人、革命者,二十五岁就战死在战场","写下匈牙利民族文学的经典诗篇,还在革命爆发时朗诵了那首民族之歌","著有诗集和长诗《勇敢的约翰》","他的名句在中国流传极广:生命诚可贵,爱情价更高,若为自由故,二者皆可抛","今天匈牙利把三月十五日定为他朗诵那首诗的纪念日","他那首关于自由的诗在中国语文课本里出现过"],"y":[1823,1849],"s":"文学"},{"n":"陀思妥耶夫斯基","a":["Fyodor Dostoevsky","费奥多尔·陀思妥耶夫斯基"],"c":"RUS","r":"欧洲","e":"1821–1881","f":"文学艺术","h":["公元19世纪,和托尔斯泰、马克思同时代","莫斯科出身,一生在圣彼得堡和西伯利亚之间","小说家,军医的儿子,年轻时参加秘密集会","写出深度剖析人性黑暗和信仰危机的小说,被视为现代小说的巅峰之一","著有罪与罚、卡拉马佐夫兄弟、白痴、地下室手记","被判死刑后临刑前一刻改判流放西伯利亚服苦役四年;一生嗜赌,为还债疯狂写作","今天心理学和哲学课都在读他,那句如果上帝不存在是不是什么都可以被允许出自他的小说","罪与罚里的主角是个杀人的穷大学生"],"y":[1821,1881],"s":"文学"},{"n":"托尔斯泰","a":["Leo Tolstoy","列夫·托尔斯泰"],"c":"RUS","r":"欧洲","e":"1828–1910","f":"文学艺术","h":["公元19到20世纪,和陀思妥耶夫斯基、甘地同时代","出身俄国贵族,在图拉的庄园里生活了一辈子,最后死在一个小火车站","作家,贵族出身,年轻时是个赌徒和军官,参加过克里米亚战争","写出两部被认为是世界文学巅峰的长篇小说,一部讲战争与历史,一部讲一个女人的悲剧","著有战争与和平、安娜·卡列尼娜、复活","八十多岁离家出走想去做苦行僧,几天后病死在火车站;甘地读过他的书并受其影响","今天战争与和平被公认是最伟大的小说之一,他那个大胡子的形象广为人知","安娜·卡列尼娜的开篇那句话是最著名的开头之一"],"y":[1828,1910],"s":"文学"},{"n":"契诃夫","a":["Anton Chekhov","安东·契诃夫"],"c":"RUS","r":"欧洲","e":"1860–1904","f":"文学艺术","h":["公元19到20世纪,和托尔斯泰、居里夫人同时代","出生在俄国南部的塔甘罗格,父亲开杂货铺","医生、小说家、剧作家,一辈子行医","把短篇小说提到艺术高度,还革新了现代戏剧,创造了一种没有高潮却处处余音的风格","著有变色龙、套中人、樱桃园、万尼亚舅舅、海鸥","为了给穷人看病免费义诊,还自己出钱修学校;因为肺病搬到黑海边的雅尔塔,最后死在德国温泉小镇","今天戏剧学院必读他的剧本,他那种淡淡地收尾的写法被称作契诃夫式","他说过医学是他的妻子,文学是他的情妇"],"y":[1860,1904],"s":"电影与戏剧"},{"n":"柴可夫斯基","a":["Pyotr Tchaikovsky","彼得·伊里奇·柴可夫斯基"],"c":"RUS","r":"欧洲","e":"1840–1893","f":"文学艺术","h":["公元19世纪,和托尔斯泰、狄更斯同时代","出生在乌拉尔地区的工厂小镇,后来在莫斯科和圣彼得堡工作","作曲家,学过法律当过公务员,二十多岁才辞职学音乐","写下俄罗斯最著名的芭蕾音乐和交响曲,还创作了多部歌剧和协奏曲","代表作有天鹅湖、胡桃夹子、睡美人、第六悲怆交响曲、第一钢琴协奏曲","一生敏感脆弱,长期抑郁,和一位女富商通信十几年却从未见过面","今天胡桃夹子和天鹅湖是全球圣诞季必演的节目,他的旋律无处不在","天鹅湖是他写的"],"y":[1840,1893],"s":"音乐"},{"n":"门捷列夫","a":["Dmitri Mendeleev","德米特里·门捷列夫"],"c":"RUS","r":"欧洲","e":"1834–1907","f":"科学发明","h":["公元19到20世纪,和托尔斯泰、达尔文同时代","西伯利亚托博尔斯克出生,家里有十几个兄弟姐妹,父亲失明后母亲带他千里求学","化学家,大学化学教授","把当时已知的六十多种元素按规律排列成一张表,还留出空位预言了尚待发现的元素","著有化学原理,那张表是他最伟大的作品","他预言的元素后来一个个被发现,性质和他算的几乎一样;传说他的表是在梦里想出来的","今天全世界每间化学教室墙上都挂着他那张表","元素周期表是他排的"],"y":[1834,1907],"s":"科学·技术"},{"n":"齐奥尔科夫斯基","a":["Konstantin Tsiolkovsky","康斯坦丁·齐奥尔科夫斯基"],"c":"RUS","r":"欧洲","e":"1857–1935","f":"科学发明","h":["公元19到20世纪,和门捷列夫、爱因斯坦同时代","俄国卡卢加,一生在那里当中学数学老师","科学家、教师,十岁被猩红热夺去了听力,基本靠自学","提出火箭飞行理论,导出了火箭速度公式,还设想了多级火箭和太空站","著有大量论文和科幻小说,包括《在地球之外》","住在木屋里自己搭建风洞做实验,当时的科学界几乎没人在意他","今天他被称作航天学之父,月球背面有一座环形山以他命名","他说过地球是人类的摇篮,但人类不会永远躺在摇篮里"],"y":[1857,1935],"s":"科学·技术"},{"n":"斯坦尼斯拉夫斯基","a":["Konstantin Stanislavski","康斯坦丁·斯坦尼斯拉夫斯基"],"c":"RUS","r":"欧洲","e":"1863–1938","f":"文学艺术","h":["公元19到20世纪,和契诃夫、托尔斯泰同时代","莫斯科,出身富裕商人家庭","演员、导演、戏剧理论家,还管着家族的工厂","创立了一套表演训练体系,要求演员从内心体验出发塑造角色,改变了整个二十世纪的表演","著有演员的自我修养、演员创造角色","把自己的体系建立在对契诃夫剧本的反复排练上,还亲自和契诃夫争论剧本结尾","今天全世界的表演课都还在这套体系里打转,那本书名后来被周星驰的电影借去当梗","他的体系要求演员问自己假如我是这个角色会怎么做"],"y":[1863,1938],"s":"电影与戏剧"},{"n":"列宁","a":["Vladimir Lenin","弗拉基米尔·列宁"],"c":"RUS","r":"欧洲","e":"1870–1924","f":"政治军事","h":["公元19到20世纪,和托尔斯泰、斯大林同时代","出生在辛比尔斯克,哥哥被处死后走上革命道路","革命家、理论家,律师出身,流亡欧洲多年","领导了一场改变二十世纪格局的革命,建立了世界上第一个社会主义国家","著有国家与革命、帝国主义是资本主义的最高阶段、怎么办","坐着一列从瑞士出发的封闭列车穿过德国回国,在火车站顶上演讲;晚年多次中风,五十三岁去世","今天他的遗体陈列在红场的陵墓里,雕像遍布多个城市","他领导的那场革命发生在1917年"],"y":[1870,1924]},{"n":"斯大林","a":["Joseph Stalin","约瑟夫·斯大林"],"c":"RUS","r":"欧洲","e":"1878–1953","f":"政治军事","h":["公元19到20世纪,和罗斯福、丘吉尔同时代","出生在格鲁吉亚的哥里,母亲是洗衣工","政治领袖,神学院学生出身,年轻时抢过银行筹款","领导苏联完成工业化并打赢了二战东线,代价是数百万人的生命","留下大量著作、演讲和书信","在列宁逝世后逐步掌权,搞过大清洗;去世时是在自己的别墅里中风倒地","今天他评价极度两极化,俄国多个城市还有他的雕像,网络上也常被做成强人梗","二战中他留在莫斯科阅兵,那句不让敌人看到我们软弱是那个冬天的关键时刻"],"y":[1878,1953]},{"n":"卡拉什尼科夫","a":["Mikhail Kalashnikov","米哈伊尔·卡拉什尼科夫"],"c":"RUS","r":"欧洲","e":"1919–2013","f":"科学发明","h":["公元20到21世纪,和加加林、爱因斯坦后期同时代","西伯利亚农村出身,家里有十八个孩子,他排行第七","工程师、军人,坦克兵出身,因为受伤住院时开始琢磨武器设计","设计出一款结构简单极耐用的突击步枪,成为全世界产量最大的枪械","留下大量设计图纸和技术文件,晚年还写过回忆录","他说过自己设计武器是为了保卫祖国,晚年却为一款枪被滥用而写信给东正教牧首表达不安","今天那款枪是全世界辨识度最高的符号之一,出现在几十个国家的国旗和旗帜上","他设计的那款枪以他名字的缩写命名"],"y":[1919,2013],"s":"科学·技术"},{"n":"索尔仁尼琴","a":["Aleksandr Solzhenitsyn","亚历山大·索尔仁尼琴"],"c":"RUS","r":"欧洲","e":"1918–2008","f":"文学艺术","h":["公元20到21世纪,和斯大林、加加林同时代","出生在北高加索,曾在劳改营服刑八年","作家、教师,二战中当过炮兵连长","写出揭露劳改营体系的小说,获得诺贝尔文学奖,后来被剥夺国籍流亡二十年","著有伊凡·杰尼索维奇的一天、古拉格群岛、癌症楼","因为给朋友写信批评领导人被判处八年劳改,成名作是靠在劳改营的经历写出来的","今天他的书成了研究那段历史的必读材料,流亡归国后他深居简出","古拉格群岛是他最著名的作品"],"y":[1918,2008],"s":"文学"},{"n":"加加林","a":["Yuri Gagarin","尤里·加加林"],"c":"RUS","r":"欧洲","e":"1934–1968","f":"探索冒险","h":["公元20世纪,和肯尼迪、赫鲁晓夫同时代","出身在集体农庄家庭,长大后当了战斗机飞行员","宇航员,是人类第一个进入太空的人","1961年乘坐一艘球形飞船绕地球一圈,全程108分钟","没留下著作,但留下了大量飞行记录和之后的演讲","起飞前他说的那句我们出发吧成了历史名句,回到地面时是弹射跳伞降落在农田里","今天4月12日是国际载人航天日,世界各地的街道和月球环形山以他命名","他那句我看到了地球,它是蓝色的改变了人类看世界的方式"],"y":[1934,1968],"s":"探险·航天"},{"n":"瓦文萨","a":["Lech Wałęsa","莱赫·瓦文萨"],"c":"POL","r":"欧洲","e":"1943–","f":"政治军事","h":["公元20到21世纪,当代人物","波兰格但斯克造船厂电工出身","工人领袖、政治家,只上过职业学校","组织了东欧第一个独立工会,推动了整个东欧的变革,后来成为波兰总统","留下大量演讲和回忆录","在造船厂被开除后翻墙进厂继续组织工人,运动起来后被拘禁过多次","今天他是诺贝尔和平奖得主,格但斯克造船厂成了历史遗址","他领导的工会叫团结工会"],"y":[1943,1943]},{"n":"哈维尔","a":["Václav Havel","瓦茨拉夫·哈维尔"],"c":"CZE","r":"欧洲","e":"1936–2011","f":"文学艺术","h":["公元20到21世纪,和瓦文萨、戈尔巴乔夫同时代","布拉格,出身富裕知识分子家庭,因阶级出身被限制升学","剧作家、政治家,写荒诞派戏剧出身,后来当上总统","用戏剧和宣言批判体制,领导了那场和平变革,成为一个国家的最后一位总统和另一个国家的第一位总统","著有多部戏剧和文集,包括《无权力者的权力》","因为写文章多次入狱,在监狱里给妻子写了大量书信后来结集出版","今天布拉格机场以他命名,他的天鹅绒革命成了和平转型的经典案例","他领导的那场变革叫天鹅绒革命"],"y":[1936,2011],"s":"电影与戏剧"},{"n":"富兰克林","a":["Benjamin Franklin","本杰明·富兰克林"],"c":"USA","r":"美洲","e":"1706–1790","f":"科学发明","h":["公元18世纪,和乾隆、亚当·斯密同时代","波士顿出生,一生大半在费城,晚年出使法国","科学家、政治家、出版商、作家,只上过两年学,当过印刷学徒","发现雷电和电是一回事并发明避雷针,参与起草独立宣言,还创办了大学和第一家公共图书馆","著有自传、穷理查年鉴,那句时间就是金钱出自他的年鉴","用风筝在雷雨里做实验,还发明了双焦点眼镜和一种取暖炉;晚年为废除奴隶制请愿","今天百元美钞上印的就是他的脸,他还被称作美国国父中最多才多艺的一位","他在雷雨天放风筝证明了闪电是电"],"y":[1706,1790],"s":"科学·技术"},{"n":"华盛顿","a":["George Washington","乔治·华盛顿"],"c":"USA","r":"美洲","e":"1732–1799","f":"政治军事","h":["公元18世纪,和乾隆、亚当·斯密同时代","弗吉尼亚的种植园主家庭出身,年轻时当过土地测量员","军事统帅、政治家,独立战争时期担任大陆军总司令","领导十三个殖民地打赢独立战争,当选第一任总统,又主动放弃第三任","留下大量书信、就职演说和告别演说","战争最艰难时军队在福吉谷冻饿交加,他留下来和士兵一起熬;卸任后回到农庄","今天美国的首都和很多州、城市以他命名,一美元和二十五美分硬币上有他的头像","他是美国第一任总统,只做了两届就交权"],"y":[1732,1799]},{"n":"杰斐逊","a":["Thomas Jefferson","托马斯·杰斐逊"],"c":"USA","r":"美洲","e":"1743–1826","f":"政治军事","h":["公元18到19世纪,和华盛顿、拿破仑同时代","弗吉尼亚的种植园主,后来当上第三任总统","政治家、建筑师、发明家,起草了那份宣布人人生而平等的文件","主导购买路易斯安那使美国领土翻倍,还派探险队去太平洋沿岸","留下大量书信、笔记和一部关于弗吉尼亚的调查报告","自己宣称人人生而平等却拥有几百名奴隶;晚年负债累累,去世那天正好是独立日","今天他的纪念堂立在华盛顿,那句话在全世界都被引用","他是美国第三任总统,也是弗吉尼亚大学的创办人"],"y":[1743,1826]},{"n":"林肯","a":["Abraham Lincoln","亚伯拉罕·林肯"],"c":"USA","r":"美洲","e":"1809–1865","f":"政治军事","h":["公元19世纪,和达尔文、马克思同时代","出生在肯塔基的木板小屋里,当过船工、店员、邮差、律师","政治家,自学成才,只受过很少的正规教育","领导国家度过内战并废除奴隶制,还留下了一篇简短的著名演说","留下大量演说和书信,葛底斯堡演说只有两百多字","身高接近两米,开店合伙做生意失败破产还债用了十几年;大战结束几天后在剧院被刺杀","今天他的纪念堂在华盛顿,一美分和五美元上有他,那句民有民治民享是他的","他被刺杀在福特剧院,是美国第一位被刺杀的总统"],"y":[1809,1865]},{"n":"爱迪生","a":["Thomas Edison","托马斯·爱迪生"],"c":"USA","r":"美洲","e":"1847–1931","f":"科学发明","h":["公元19到20世纪,和达尔文、特斯拉同时代","出生在俄亥俄,只在密歇根上过几个月学,母亲在家教他","发明家、企业家,一生拿了一千多项专利","改良了白炽灯泡并建立了发电和供电系统,还发明了留声机和早期电影设备","留下上千项专利文件和大量实验笔记","老师说他脑子糊涂让母亲领回家;为了找灯丝材料试了上千种物质包括朋友的胡子","今天电灯、唱片、电影都源自他的实验室,那句天才是一分灵感加九十九分汗水是他的","他建的门洛帕克实验室被称为发明工厂"],"y":[1847,1931],"s":"科学·技术"},{"n":"特斯拉","a":["Nikola Tesla","尼古拉·特斯拉"],"c":"USA","r":"美洲","e":"1856–1943","f":"科学发明","h":["公元19到20世纪,和爱迪生、爱因斯坦同时代","出生在克罗地亚的塞尔维亚族家庭,1884年去美国","发明家、工程师,在爱迪生手下干过然后翻脸","发明交流电系统,让电力可以远距离输送,还做出感应电动机和特斯拉线圈","留下近三百项专利,大量技术文档以他命名","和爱迪生那场电流之战中他赢了,但放弃了专利费;晚年穷困独居旅馆,喂鸽子喂出了感情","今天电动车品牌以他命名,磁感应强度的单位也是他","交流电系统是他发明的,他死时身无分文"],"y":[1856,1943],"s":"科学·技术"},{"n":"福特","a":["Henry Ford","亨利·福特"],"c":"USA","r":"美洲","e":"1863–1947","f":"商业经济","h":["公元19到20世纪,和爱迪生、特斯拉同时代","出生在密歇根农场,从小爱拆钟表","企业家,自己造出了第一辆四轮车,后来创办汽车公司","用流水线大批量生产一种黑色小汽车,把车价从奢侈品打到普通人买得起","没留下著作,但留下了大量技术文件和企业制度","他说顾客可以要任何颜色的车只要它是黑的;还给工人开出了当时两倍的日薪,也雇过打手镇压工会","今天那条流水线是工业生产方式的代名词,一种车型用他命名","他推广的T型车让美国装上轮子"],"y":[1863,1947],"s":"商业·创业"},{"n":"马克·吐温","a":["Mark Twain","马克吐温"],"c":"USA","r":"美洲","e":"1835–1910","f":"文学艺术","h":["公元19到20世纪,和爱迪生、维多利亚女王同时代","出生在密苏里的小镇,当过轮船领航员、矿工和记者","作家、演说家,笔名来自水手测水深的行话","写出美国文学史上最著名的两部少年冒险小说,把美国口语带进了文学","著有汤姆·索亚历险记、哈克贝利·费恩历险记、百万英镑","投资过一种排字机亏得血本无归,靠环球演讲还清债务;他的出生和去世都赶上哈雷彗星","今天他的作品是美国人必读的经典,那句关于谎言的段子被引用了一百年","他写过两个在密西西比河上冒险的男孩"],"y":[1835,1910],"s":"文学"},{"n":"洛克菲勒","a":["John D. Rockefeller","约翰·洛克菲勒"],"c":"USA","r":"美洲","e":"1839–1937","f":"商业经济","h":["公元19到20世纪,和爱迪生、卡内基同时代","出生在纽约州,父亲是个走江湖卖药的","企业家,十六岁当记账员,第一份工资就开始记账并捐款","创办了美国最早的石油垄断企业,一度控制了全美绝大部分炼油能力,后来被法院拆成几十家公司","没留下著作,但留下了大量账本和书信","晚年大量捐钱办大学和医学研究,一生捐出超过一半财富;他是人类历史上第一个亿万富翁","今天反垄断法教材里他是第一案例,那句垄断是怎么形成的从他开始讲","他创办的石油公司后来拆出了多家世界级能源企业"],"y":[1839,1937],"s":"商业·创业"},{"n":"罗斯福","a":["Franklin D. Roosevelt","富兰克林·罗斯福"],"c":"USA","r":"美洲","e":"1882–1945","f":"政治军事","h":["公元20世纪,和丘吉尔、斯大林同时代","纽约豪门出身,是西奥多·罗斯福的远房侄子","政治家,三十九岁患小儿麻痹症后终生坐轮椅","推行新政让美国走出大萧条,带领国家打完二战,是唯一连任四届的总统","留下大量演讲,最著名的是那句我们唯一需要恐惧的就是恐惧本身","为了让公众相信国家在运转,他搞了一系列炉边谈话;他还签署了那个大规模研发核武器的计划","今天美国社保制度和很多公共工程源自他,美元硬币上有他的侧脸","他连任了四届总统,后来美国立法限制只能两届"],"y":[1882,1945]},{"n":"马丁·路德·金","a":["Martin Luther King Jr.","马丁路德金"],"c":"USA","r":"美洲","e":"1929–1968","f":"政治军事","h":["公元20世纪,和肯尼迪、甘地之后的时代","出生在亚特兰大,父亲是牧师,他拿到了神学博士","牧师、民权运动领袖,主张非暴力抵抗","领导了反对种族隔离的运动,那场在首都的集会有二十多万人参加","留下大量演讲和书信,最著名的一篇是在监狱里写给牧师们的信","1968年在孟菲斯支持清洁工人罢工时被枪杀,年仅三十九岁","今天美国有专门为他设立的联邦假日,那句我有一个梦想是二十世纪最著名的演讲之一","他有博士学位,演讲时反复说那四个字"],"y":[1929,1968]},{"n":"肯尼迪","a":["John F. Kennedy","约翰·肯尼迪"],"c":"USA","r":"美洲","e":"1917–1963","f":"政治军事","h":["公元20世纪,和马丁·路德·金、赫鲁晓夫同时代","波士顿政治家族出身,二战中指挥鱼雷艇被击沉后救回船员","政治家,四十三岁当选总统,是当时最年轻的当选总统","处理了古巴导弹危机,提出十年内把人送上月球的目标","著有《当仁不让》一书,还得过普利策奖","1963年在达拉斯坐敞篷车时被枪击身亡,凶手两天后又被枪杀,案件至今争论不休","今天美国有一个航天中心、一座机场和多所学校以他命名,那句话不要问国家能为你做什么被反复引用","他提出登月计划时苏联还领先"],"y":[1917,1963]},{"n":"奥本海默","a":["J. Robert Oppenheimer","罗伯特·奥本海默"],"c":"USA","r":"美洲","e":"1904–1967","f":"科学发明","h":["公元20世纪,和爱因斯坦、罗斯福同时代","纽约富商家庭出身,在哈佛和欧洲多国求学","理论物理学家,主持了那个研制原子弹的秘密计划","领导数百名科学家在沙漠小镇造出人类第一颗核弹,战后担任原子能顾问","留下大量论文和演讲,还留下了大量访谈记录","看到第一朵蘑菇云时他想起一句古印度诗:现在我成了死神,世界的毁灭者;战后因为反对氢弹被审查","今天电影把他的故事拍成了大片,他也是科学伦理讨论的经典案例","他在洛斯阿拉莫斯主持了曼哈顿计划"],"y":[1904,1967],"s":"科学·技术"},{"n":"海伦·凯勒","a":["Helen Keller","海伦凯勒"],"c":"USA","r":"美洲","e":"1880–1968","f":"文学艺术","h":["公元19到20世纪,和海明威、罗斯福同时代","出生在阿拉巴马州,十九个月大时因病失去视听","作家、社会活动家,是第一个取得文学学士学位的聋盲人","写了十几本书和大量文章,还到世界各地为残障人士募捐演讲","著有《我的一生》《假如给我三天光明》","七岁时遇到一位家庭教师,靠在她手心拼写单词学会了沟通,那个水的瞬间成了奇迹","今天她的自传是全球语文课本里的篇目,她的名字成了克服障碍的象征","日本动画《一公升的眼泪》里提到的是她那位老师"],"y":[1880,1968],"s":"文学"},{"n":"卓别林","a":["Charlie Chaplin","查理·卓别林"],"c":"GBR","r":"欧洲","e":"1889–1977","f":"文学艺术","h":["公元20到20世纪中叶,和爱因斯坦、丘吉尔同时代","出生在伦敦的贫民区,后来在美国好莱坞成名","演员、导演、配乐师,父母都是杂耍艺人,小时候进过救济院","塑造了电影史上最著名的形象,一个戴着圆顶礼帽留着小胡子的流浪汉,还自己导演和配乐","代表作有摩登时代、城市之光、大独裁者、淘金记","因为政治立场被美国驱逐,定居瑞士,二十年后才回美国领奥斯卡奖","今天那个小胡子形象是默片时代的象征,他还是唯一一个自己配乐的喜剧演员","他在大独裁者里模仿讽刺了希特勒"],"y":[1889,1977],"s":"电影与戏剧"},{"n":"迈克尔·杰克逊","a":["Michael Jackson","迈克尔杰克逊"],"c":"USA","r":"美洲","e":"1958–2009","f":"文学艺术","h":["公元20到21世纪,和乔布斯同时代","出生在印第安纳州的音乐家庭,五岁就开始登台","歌手、舞者、唱片制作人,被称为流行音乐之王","创下了史上销量最高的专辑纪录,还把音乐录影带变成了艺术形式","留下了大量歌曲、舞蹈编排和音乐短片","发明了那个向后滑步的招牌舞步,第一次演出它的时候全世界的电视观众都看傻了","今天他的舞蹈被无数人模仿,月球漫步是流行文化史上最著名的动作之一","他跳的那个动作叫太空步"],"y":[1958,2009],"s":"音乐"},{"n":"乔丹","a":["Michael Jordan","迈克尔·乔丹"],"c":"USA","r":"美洲","e":"1963–","f":"体育娱乐","h":["公元20到21世纪,当代人物","出生在纽约布鲁克林,在北卡罗来纳上大学","运动员,高中时曾被校队刷掉","把篮球变成全球生意,拿了六个总冠军和五个最有价值球员,还跨界打过棒球","留下大量比赛录像和一部以他为主角的纪录片","总决赛从没打过第七场,还曾在投进制胜球前最后几秒把球稳稳停住","今天以他命名的球鞋是全世界最畅销的运动鞋系列之一,他那句关于失败的名言被贴在无数球馆墙上","他穿了二十三号球衣,那次绝杀叫最后一投"],"y":[1963,1963],"s":"体育"},{"n":"白求恩","a":["Norman Bethune","诺尔曼·白求恩"],"c":"CAN","r":"美洲","e":"1890–1939","f":"科学发明","h":["公元20世纪,和罗斯福、斯大林同时代","加拿大安大略省出身,后来到西班牙和中国工作","医生、外科专家,是北美胸外科的先驱之一","在战地发明了移动手术台和大量器械,把手术站推到了离前线最近的地方,最后牺牲在中国","留下大量医学论文和战地日记,还写了写给加拿大友人的信件","他说过手术台是医生的阵地,战士没有离开阵地医生怎么能离开;因为手术时划破手指感染去世","今天中国有以他命名的医学院和医院,那篇《纪念白求恩》人人读过","他从加拿大带来了流动医疗队"],"y":[1890,1939],"s":"科学·技术"},{"n":"玻利瓦尔","a":["Simón Bolívar","西蒙·玻利瓦尔"],"c":"VEN","r":"美洲","e":"1783–1830","f":"政治军事","h":["公元18到19世纪,和拿破仑、圣马丁同时代","出生在委内瑞拉的加拉加斯,出身土生白人贵族","军事统帅、政治家,年轻时在欧洲留学读到启蒙思想","领导六个南美国家摆脱殖民统治,被称作解放者","留下大量书信和宣言,最著名的是《牙买加信札》","翻越安第斯山突袭西班牙军队,还两次被迫流亡又打回来;晚年被暗杀未遂后辞职,病死在异乡","今天玻利维亚以他命名,多国货币和城市有他的名字","他解放了六个国家,却没看到它们统一"],"y":[1783,1830]},{"n":"圣马丁","a":["José de San Martín","何塞·德·圣马丁"],"c":"ARG","r":"美洲","e":"1778–1850","f":"政治军事","h":["公元18到19世纪,和玻利瓦尔、拿破仑同时代","出生在阿根廷,早年在西班牙军队服役","军事统帅、政治家,被称为南美的解放者","率军翻越安第斯山解放智利和秘鲁,是南美独立战争两大领袖之一","留下大量书信和军事文书","和玻利瓦尔会面后主动交出指挥权,随后离开南美定居法国,再没回来","今天阿根廷、智利、秘鲁都把他当国父,阿根廷的国父忌日是学校假日","他放弃了权力去了欧洲,和玻利瓦尔那次会面至今是历史之谜"],"y":[1778,1850]},{"n":"何塞·马蒂","a":["José Martí","何塞马蒂"],"c":"CUB","r":"美洲","e":"1853–1895","f":"文学艺术","h":["公元19世纪,和马克思、玻利瓦尔后期同时代","出生在哈瓦那的西班牙军官家庭,十六岁就被捕流放","诗人、记者、革命家,一生大半在流亡中度过","写下大量诗歌和政论,还在纽约为独立运动筹集资金,最后战死在战场上","著有诗作《伊斯马埃利约》《朴素诗篇》,还有大量报刊文章","十五岁就因为写反殖民的信件被关进监狱服苦役,后来靠一首诗成了拉美现代主义文学的先声","今天古巴的机场以他命名,那首关于两个祖国的诗在拉美家喻户晓","他写过一首关于小玫瑰的儿童诗"],"y":[1853,1895],"s":"文学"},{"n":"卡斯特罗","a":["Fidel Castro","菲德尔·卡斯特罗"],"c":"CUB","r":"美洲","e":"1926–2016","f":"政治军事","h":["公元20到21世纪,和切·格瓦拉、肯尼迪同时代","古巴东部农场主家庭出身,律师出身","革命家、政治领袖,执政近半个世纪","领导革命推翻旧政权,建立了一个持续至今的社会主义国家","留下大量演讲,据说单场演讲最长超过七小时","带领八十多人乘一艘游艇回国登陆,几乎全被歼灭,他带着十几人逃进山里;被暗杀图谋据说有几百次","今天拉美政治里他是标志性人物,那场登陆被定为一个专门的日子","他领导的那场革命发生在1959年"],"y":[1926,2016]},{"n":"切·格瓦拉","a":["Che Guevara","埃内斯托·格瓦拉"],"c":"ARG","r":"美洲","e":"1928–1967","f":"政治军事","h":["公元20世纪,和卡斯特罗、肯尼迪同时代","出生在阿根廷罗萨里奥,出身中产家庭","医生、革命者,年轻时骑摩托车游历了整个拉美","参与古巴革命后离开去其他国家继续游击战,最后牺牲在玻利维亚","留下大量日记和书信,包括《摩托日记》《玻利维亚日记》","他年轻时那趟摩托车之旅让他看到了拉美的贫困,从此改变一生;被俘后被处决,双手被砍下送去验明身份","今天他的头像成了全世界最流行的图像之一,印在T恤和海报上卖了几十年","那幅贝雷帽头像照片被誉为二十世纪最有名的照片"],"y":[1928,1967]},{"n":"弗里达·卡罗","a":["Frida Kahlo","弗里达卡罗"],"c":"MEX","r":"美洲","e":"1907–1954","f":"文学艺术","h":["公元20世纪,和爱因斯坦、卓别林同时代","墨西哥城,一生住在那个蓝色外墙的院子里","画家,六岁得过小儿麻痹,十八岁遭遇严重车祸终身受伤","一生画了五十多幅自画像,把自己的痛苦和身体画进画布,成了墨西哥和女性艺术的象征","留下大量画作和一本日记","车祸时一根钢扶手穿透了她的身体,此后做了三十多次手术;她说自己一生经历了两次事故,一次是车祸一次是丈夫","今天她的自画像拍出过几千万美元,她的形象被印在墨西哥钞票上","她是画家迭戈·里维拉的妻子,两人结过两次婚"],"y":[1907,1954],"s":"美术与建筑"},{"n":"马尔克斯","a":["Gabriel García Márquez","加西亚·马尔克斯"],"c":"COL","r":"美洲","e":"1927–2014","f":"文学艺术","h":["公元20到21世纪,和弗里达、卡斯特罗同时代","出生在哥伦比亚北部小镇,由外祖父母带大","记者、小说家,一辈子做新闻和写作","写出拉美文学爆炸的代表作,开创了魔幻现实主义,后来获得诺贝尔文学奖","著有百年孤独、霍乱时期的爱情、没有人给他写信的上校","写百年孤独时穷得把家里的电器都当了换纸,妻子出去借钱寄手稿","今天那句多年以后面对行刑队是文学史上最著名的开头之一","百年孤独写了一个家族七代人的故事"],"y":[1927,2014],"s":"文学"},{"n":"佩德罗二世","a":["Pedro II","佩德罗二世"],"c":"BRA","r":"美洲","e":"1825–1891","f":"政治军事","h":["公元19世纪,和林肯、维多利亚女王同时代","巴西,五岁即位,十四岁亲政","皇帝,巴西帝国的第二任也是最后一任君主","统治近五十年,打过一场南美最大规模的战争,还废除了奴隶制","留下大量书信、日记和著作,他还翻译过不少文学作品","他是个学者型君主,还给电报和电话站台;废除奴隶制后失去庄园主支持,被共和派政变推翻流亡欧洲","今天巴西的皇帝之城彼得罗波利斯以他命名,那里的皇宫是他建的","他废除了巴西的奴隶制,却因此丢掉了皇位"],"y":[1825,1891]},{"n":"蒙特祖玛二世","a":["Moctezuma II","蒙特祖玛"],"c":"MEX","r":"美洲","e":"约1466–1520","f":"政治军事","h":["公元15到16世纪,和达芬奇同时代","墨西哥中部,阿兹特克帝国的首都特诺奇蒂特兰","君主,统治着当时美洲最强大的帝国之一","把帝国推到最大版图,还建立了一套贡赋体系和活人祭祀制度","没留下著作,但留下了大量殖民时期的记录和图像","把到来的西班牙人当成传说中的神使欢迎进城,后来被俘,死于自己人民的石块之下","今天墨西哥城就是在他那座湖中首都上建起来的,很多街道还沿用他的布局","他迎接的是科尔特斯的远征队"],"y":[1466,1520]},{"n":"阿塔瓦尔帕","a":["Atahualpa","阿塔瓦尔帕"],"c":"PER","r":"美洲","e":"约1502–1533","f":"政治军事","h":["公元16世纪,和达芬奇后期、哥伦布同时代","南美洲安第斯山区,印加帝国","君主,赢下内战刚当上皇帝就遇上西班牙人","统治着当时世界上最大的帝国之一,但在一次会面中被几十个西班牙人俘虏","没留下著作,但他的赎金成了历史奇观","他提出用金子堆满一间房、用银子堆满两间房换自由,付了赎金还是被绞死","今天他的故事是殖民史最著名的一幕,那也是印加帝国最后一段","他是印加帝国最后一位真正的皇帝"],"y":[1502,1533]},{"n":"曼德拉","a":["Nelson Mandela","纳尔逊·曼德拉"],"c":"ZAF","r":"非洲","e":"1918–2013","f":"政治军事","h":["公元20到21世纪,和肯尼迪、马丁·路德·金同时代","南非东开普省出身,部落贵族家庭,学过法律","政治家、反种族隔离领袖,坐过二十七年牢","在狱中成为反抗运动的象征,出狱后领导谈判终结种族隔离,当选第一任黑人总统","著有《漫漫自由路》和多卷文集","在监狱里刻石头、采海藻,还被允许种一片菜园;出狱时已经七十一岁","今天全世界有几十条街道和几十所学校以他命名,他的生日成了国际纪念日","他坐了二十七年牢,坐牢的岛叫罗本岛"],"y":[1918,2013]},{"n":"恩克鲁玛","a":["Kwame Nkrumah","克瓦米·恩克鲁玛"],"c":"GHA","r":"非洲","e":"1909–1972","f":"政治军事","h":["公元20世纪,和曼德拉、肯尼迪同时代","当时叫黄金海岸,今天的加纳","政治领袖,在美国和英国留学多年","领导殖民地独立,成为撒哈拉以南非洲第一个独立国家的领导人,推动了整个非洲的去殖民化","著有《非洲必须统一》等著作","他说过加纳独立如果不和整个非洲解放联系起来就没有意义;后来在一场军事政变中被推翻流亡","今天加纳把他当国父,那面黑星旗帜成了泛非主义的标志","他领导的国家是撒哈拉以南非洲第一个独立的"],"y":[1909,1972]},{"n":"曼萨·穆萨","a":["Mansa Musa","曼萨穆萨"],"c":"MLI","r":"非洲","e":"约1280–1337","f":"商业经济","h":["公元13到14世纪,和但丁、马可波罗同时代","西非,马里帝国的统治中心","君主,统治着当时世界上一大半黄金产地","把马里帝国推向鼎盛,在廷巴克图大建清真寺和学校,使它成为伊斯兰世界的重要学术中心","没留下著作,但留下了大量建筑和一份著名的朝觐路线记录","他带着几万人和上百头骆驼的黄金去麦加朝觐,一路撒钱撒到开罗金价崩了十年","今天他被认为是历史上最富有的人,经常被排在最富有人物榜单第一","他那次朝觐把埃及的金价砸崩了"],"y":[1280,1337],"s":"商业·创业"},{"n":"海尔·塞拉西一世","a":["Haile Selassie I","海尔塞拉西"],"c":"ETH","r":"非洲","e":"1892–1975","f":"政治军事","h":["公元20到20世纪中叶,和罗斯福、丘吉尔同时代","埃塞俄比亚,出身贵族,一生都在这个国家","皇帝,原名塔法里·马孔南,1930年加冕","带领国家抵抗意大利入侵并在国际联盟发声,后来成为非洲统一组织的推动者","留下了大量演讲和自传","亡国后在英国流亡五年,回国复辟;1974年被军事政变推翻,次年在软禁中去世","今天牙买加的雷鬼文化奉他为神,一条街道和很多歌曲都提到他的原名","他是所罗门王朝的末代皇帝,原名塔法里"],"y":[1892,1975]},{"n":"索因卡","a":["Wole Soyinka","沃莱·索因卡"],"c":"NGA","r":"非洲","e":"1934–","f":"文学艺术","h":["公元20到21世纪,当代人物","尼日利亚西部出身,留学英国利兹大学","剧作家、诗人、小说家,还当过大学戏剧教授","是非洲第一位诺贝尔文学奖得主,作品把约鲁巴传统和现代戏剧结合起来","著有《死亡与国王的骑手》《狮子和宝石》《阿凯》","内战期间因为呼吁停火被单独关押近两年,在狱中用香烟盒和卫生纸写诗","今天他是非洲文学的代表人物之一,尼日利亚的戏剧史从他讲起","他是非洲第一个诺贝尔文学奖得主"],"y":[1934,1934],"s":"电影与戏剧"},{"n":"沙卡","a":["Shaka Zulu","沙卡祖鲁"],"c":"ZAF","r":"非洲","e":"约1787–1828","f":"政治军事","h":["公元18到19世纪,和拿破仑、维多利亚女王前期同时代","南非东南部,祖鲁王国","军事统帅、国王,私生子出身,靠战功成为首领","改革了祖鲁军队,用短矛和密集队形取代远程投掷,建立了一个强大的王国","没留下著作,只留下大量口述传说和殖民者的记录","他发明了把牛角合围的战术,在非洲南部扩张出庞大的势力范围","今天他是祖鲁民族的象征,南非有一个机场和大量街路以他命名","他把祖鲁变成了南部非洲最强的军事力量"],"y":[1787,1828]},{"n":"爱德蒙·希拉里","a":["Edmund Hillary","埃德蒙·希拉里"],"c":"NZL","r":"大洋洲","e":"1919–2008","f":"探索冒险","h":["公元20世纪,和加加林、丘吉尔同时代","新西兰奥克兰,父亲是养蜂人","登山家、探险家,原本养蜂为生,二战中当过飞行员","1953年登上世界最高峰,是人类首次成功登顶,后来还到了南极点","写过几本登山回忆录和探险记录","登顶那天他说的是我们干掉了那个混蛋,后来这句话成了登山史的名言","今天新西兰的五元钞票上有他的头像,他还为尼泊尔建了几十所学校和医院","他是第一个站在珠穆朗玛峰顶的人"],"y":[1919,2008],"s":"探险·航天"},{"n":"凯茜·弗里曼","a":["Cathy Freeman","凯西·弗里曼"],"c":"AUS","r":"大洋洲","e":"1973–","f":"体育娱乐","h":["公元20到21世纪,当代人物","澳大利亚昆士兰,原住民家庭出身","运动员,跑四百米","在奥运会上赢下金牌,成为历史上第一位在开幕式上点燃主火炬的原住民","没留下著作,但她的比赛画面被反复播放","赢了以后她先把两面旗披在身上庆祝,脸上涂着白红两色的颜料","今天澳大利亚把她当和解的象征,那张她跪在跑道上庆祝的照片成了国族记忆","她是澳大利亚原住民体育的象征"],"y":[1973,1973],"s":"体育"},{"n":"玛丽·安托瓦内特","a":["Marie Antoinette","玛丽王后"],"c":"FRA","r":"欧洲","e":"1755–1793","f":"政治军事","h":["公元18世纪,和美国独立战争、法国大革命同时代","出生在维也纳,十五岁嫁到法国宫廷","王后,奥地利女大公,母亲是哈布斯堡的女皇","在大革命中被推上断头台,成为旧制度终结的象征","留下了大量书信,她写给母亲和密友的信后来被整理出版","传说百姓没面包吃时她说那就吃蛋糕,这句话其实没有证据;她在小特里亚农建了个假村庄玩扮农妇","今天影视剧里她是最著名的绝代艳后形象,那句蛋糕的名言成了网络流行梗","她三十七岁被送上断头台,九个月后她的丈夫也上了同一座"],"y":[1755,1793]},{"n":"伊本·白图泰","a":["Ibn Battuta","伊本白图泰"],"c":"MAR","r":"非洲","e":"1304–1368","f":"探索冒险","h":["公元14世纪,和元朝的末年、欧洲黑死病同时代","出生在摩洛哥的丹吉尔,一生走了三大洲","旅行家、法官,出身法学世家","用近三十年走了十二万公里, 还当过国家足球队的替补门将","提出原子模型的量子解释,拿过诺贝尔奖,还创办了一个影响整个世纪的研究所","著作有原子论和自然的描述、关于原子和分子的结构","和爱因斯坦关于量子力学的争论持续了几十年,二战时从被占领的欧洲逃到美国参与了那个大计划,战后回来继续建研究所","今天他的研究所是欧洲理论物理的圣地,那种开放讨论的氛围以他命名","和爱因斯坦争论了一辈子的那位丹麦量子物理学家"],"y":[1885,1962],"s":"科学·技术"},{"n":"埃尔温·薛定谔","a":["Erwin Schrödinger","薛定谔"],"c":"AUT","r":"欧洲","e":"1887–1961","f":"科学发明","h":["公元19到20世纪,和爱因斯坦、玻尔同时代","欧洲中部的奥地利维也纳,喜欢登山和绘画","物理学家,一生换过好几个国家的教职","写出量子力学的基本方程,拿过诺贝尔奖,还写了一本影响分子生物学的书","著作有生命是什么、波动力学论文集","提出过一个关于猫的假想实验,那只既死又活的猫后来成了量子力学最出名的梗,他还在二战前离开德国反对迫害","今天那只猫出现在无数科普文章和T恤上,那个方程是量子力学的门面","提出那只又死又活的猫的那位奥地利物理学家"],"y":[1887,1961],"s":"科学·技术"},{"n":"维尔纳·海森堡","a":["Werner Heisenberg","海森堡"],"c":"DEU","r":"欧洲","e":"1901–1976","f":"科学发明","h":["公元20世纪,和爱因斯坦、玻尔同时代","德国南部,二十几岁就拿了博士学位","物理学家,钢琴弹得好,还擅长滑雪","提出测不准原理和矩阵力学,拿过诺贝尔奖,是量子力学的主要奠基人之一","著作有量子论的物理原理、物理学与哲学","二十多岁就出名,二战期间留在德国主持核研究,战后和同行的关系复杂,他还在战后推动了欧洲的科研合作","今天测不准原理是流行文化里最常被滥用的科学概念之一,他的名字常和不确定性绑在一起","提出测不准原理的那位德国物理学家"],"y":[1901,1976],"s":"科学·技术"},{"n":"恩里科·费米","a":["Enrico Fermi","费米"],"c":"ITA","r":"欧洲","e":"1901–1954","f":"科学发明","h":["公元20世纪,和玻尔、海森堡同时代","意大利罗马,出身铁路职员家庭","物理学家,理论和实验都做得极好","实现第一次可控核链式反应,拿过诺贝尔奖,还带出了一批学生","著作有热力学、核物理讲义","得奖后带着全家借出国领奖的机会离开意大利,后来去了美国,在芝加哥大学的球场看台下面完成了那项历史性实验,两种化学元素和多个研究机构都以他命名","今天物理学里的一个基本粒子家族和一种元素都以他命名,他被人称作最后一位理论和实验通吃的物理学家","第一次让核反应堆运转起来的那位意大利物理学家"],"y":[1901,1954],"s":"科学·技术"},{"n":"约翰·冯·诺依曼","a":["John von Neumann","冯·诺依曼","冯诺依曼"],"c":"HUN","r":"欧洲","e":"1903–1957","f":"科学发明","h":["公元20世纪,和爱因斯坦同时代","欧洲中部的布达佩斯,富有的犹太家庭出身","数学家、物理学家、计算机科学家,记忆力和心算能力惊人","提出现代计算机的存储程序架构,参与博弈论奠基,还参与过核武器的研制","著作有量子力学的数学基础、博弈论与经济行为","六岁就能心算八位数除法,年轻时同时在三个国家求学,后来去美国任教,参与了那个改变世界的大计划,五十几岁因病去世","今天所有计算机的体系结构都以他的名字命名,那套存储程序的思路就是他提出的","现代计算机架构以他命名的那位数学天才"],"y":[1903,1957],"s":"科学·技术"},{"n":"理查德·费曼","a":["Richard Feynman","费曼"],"c":"USA","r":"美洲","e":"1918–1988","f":"科学发明","h":["公元20世纪,和爱因斯坦晚年同时代","美国纽约,在长岛的工人家庭长大","理论物理学家,打邦戈鼓、破保险柜、还画过画","发明费曼图和路径积分,拿过诺贝尔奖,参与过核武器计划","著作有费曼物理学讲义、别闹了费曼先生、你干吗在乎别人怎么想","在研制核武器的基地里以破解同事保险柜为乐,晚年参与调查那场航天飞机事故,用一个冰水和橡胶圈当众演示了原因","今天他的物理讲义是全世界的经典教材,那个用一杯冰水演示事故原因的画面人人记得","用一杯冰水指出航天飞机失事原因的那位物理学家,费曼物理学讲义作者"],"y":[1918,1988],"s":"科学·技术"},{"n":"埃德温·哈勃","a":["Edwin Hubble","哈勃"],"c":"USA","r":"美洲","e":"1889–1953","f":"科学发明","h":["公元19到20世纪,和爱因斯坦同时代","美国中西部密苏里州,少年时是田径和篮球好手","天文学家,还当过律师和中学老师","发现宇宙在膨胀,证明了银河系之外还有别的星系,改变了人类对宇宙尺度的认识","著作有星云世界、观察宇宙的疆界","学过法律还开过律师事务所,后来跑去读天文学博士,在加州那座著名的天文台工作了大半辈子","今天那台以他命名的太空望远镜是最著名的科学仪器之一,膨胀宇宙的定律也冠着他的姓","发现宇宙膨胀的那位天文学家,太空望远镜以他命名"],"y":[1889,1953],"s":"科学·技术"},{"n":"亚历山大·弗莱明","a":["Alexander Fleming","弗莱明"],"c":"GBR","r":"欧洲","e":"1881–1955","f":"科学发明","h":["公元19到20世纪,和青霉素同时代","英国苏格兰的农场家庭出身,家里兄弟姐妹很多","细菌学家,一战时在战地医院做过研究","发现第一种抗生素,拿过诺贝尔奖,救了此后数以亿计的人","著作有青霉素的发现与应用相关论文","他度假回来发现培养皿被霉菌污染,细菌在霉菌周围被抑制,他没有直接扔掉那盘东西,而是研究了它","今天他发现的这种药物是医学史上最伟大的发现之一,医院里还在用它","发现青霉素的那位苏格兰细菌学家"],"y":[1881,1955],"s":"科学·技术"},{"n":"罗莎琳德·富兰克林","a":["Rosalind Franklin"],"c":"GBR","r":"欧洲","e":"1920–1958","f":"科学发明","h":["公元20世纪,和青霉素之后、DNA 发现的那个年代","英国伦敦的犹太家庭,父亲是银行家","化学家、晶体学家,还是位出色的实验能手","拍出了那张揭示遗传物质结构的关键照片,为双螺旋模型提供了决定性证据","留下了那张被编号为51的照片和相关实验数据","在男性主导的实验室里不太受待见,那张照片被同行拿给别人看过,她三十七岁因癌症去世,四年后别人拿了诺贝尔奖","今天那张编号51的照片是科学史上最有名的照片之一,她的贡献被后人反复讨论","拍出那张决定性的51号照片的女科学家"],"y":[1920,1958],"s":"科学·技术"},{"n":"乔纳斯·索尔克","a":["Jonas Salk","索尔克"],"c":"USA","r":"美洲","e":"1914–1995","f":"科学发明","h":["公元20世纪,和脊髓灰质炎疫苗那个年代","美国纽约的移民家庭,父母是不识字的俄国移民","医学研究者,一辈子没有行医执照却改变了医学史","研制出第一种脊髓灰质炎疫苗,让这种流行病在几十年里几乎消失","没写过书,留下的是几篇论文和一支疫苗配方","被记者问疫苗专利归谁,他回答说疫苗属于所有人,能不能申请专利就像能不能给太阳申请专利一样,后来他建了自己的研究所","今天他被看作科学公有精神的象征,那句关于太阳的比喻被广泛引用","疫苗没申请专利的那位美国医学研究者"],"y":[1914,1995],"s":"科学·技术"},{"n":"蕾切尔·卡森","a":["Rachel Carson","卡森"],"c":"USA","r":"美洲","e":"1907–1964","f":"科学发明","h":["公元20世纪,和环保运动兴起的年代","美国宾夕法尼亚州的农场,母亲鼓励她写作","海洋生物学家、科普作家","一本书引发了现代环保运动,推动了禁用某种农药的立法","著作有寂静的春天、我们周围的海洋","当过政府部门的海洋生物学家,写书时已经患了癌症,面对化工行业的猛烈攻击仍然坚持把书写完","今天她被视作现代环保运动的起点,那本关于春天的书写进了教科书","写寂静的春天的那位海洋生物学家"],"y":[1907,1964],"s":"科学·技术"},{"n":"卡尔·萨根","a":["Carl Sagan","萨根"],"c":"USA","r":"美洲","e":"1934–1996","f":"科学发明","h":["公元20世纪后半,和太空探索的黄金年代","美国纽约布鲁克林,父母是移民","天文学家、科普作家,还做过电视节目主持人","做了史上收视最高的科学节目之一,参与了多艘行星探测器的设计","著作有宇宙、接触、暗淡蓝点","他在电视上穿着灯芯绒外套讲解宇宙,还坚持让探测器带着一张刻有地球之声的金唱片飞向星际,四十几岁就患上重病仍坚持写作","今天那张暗淡蓝点的照片和他说的话被大量引用,那部电视片影响了几代人","主持那档宇宙科普节目、提出暗淡蓝点的那位天文学家"],"y":[1934,1996],"s":"科学·技术"},{"n":"珍·古道尔","a":["Jane Goodall","古道尔"],"c":"GBR","r":"欧洲","e":"1934–2025","f":"科学发明","h":["公元20到21世纪,活跃在1960年代至今","英国伦敦,小时候就迷上动物","动物学家、环保活动家,没有大学文凭就去了非洲","在野外长期观察黑猩猩,发现它们会制造和使用工具,改写了教科书对人类的定义","著作有在人类的阴影下、希望的理由","年轻时给一位著名古人类学家写信求工作,被派去非洲做野外研究,后来在丛林里待了几十年,晚年在全世界跑学校讲环保","今天她是动物行为研究最有名的面孔之一,那句关于人类与动物关系的话被反复引用","在丛林里研究黑猩猩一辈子的那位英国女士,2025年去世"],"y":[1934,2025],"s":"科学·技术"},{"n":"大卫·爱登堡","a":["David Attenborough","爱登堡"],"c":"GBR","r":"欧洲","e":"1926–","f":"科学发明","h":["公元20到21世纪,活跃在1950年代至今","英国中部莱斯特,家里还办过大学","自然纪录片主持人、制片人,声音辨识度极高","做自然历史节目做了七十多年,把野生动物带进了全世界的客厅","留下的是数十部自然纪录片系列和几本著作","年轻时在电视台做节目编排,后来跑到野外拍片,去过地球上几乎所有生境,九十多岁还在解说新片","今天他的嗓音是全世界最被信任的声音之一,他讲的那句人类需要自然的提醒被反复播放","拍自然纪录片七十多年的那位英国老爷子"],"y":[1926,1926],"s":"科学·技术"},{"n":"蒂姆·伯纳斯-李","a":["Tim Berners-Lee","伯纳斯-李","TimBL"],"c":"GBR","r":"欧洲","e":"1955–","f":"科学发明","h":["公元20到21世纪,活跃在1980年代末至今","英国伦敦,父母都参与了早期计算机的研制","计算机科学家,在瑞士那个粒子物理实验室工作时发明了一套系统","发明了万维网:网址、网页、浏览器这套东西,让互联网变成人人能用的信息海洋","没写过书,写下的是几十行最初的代码和几个奠定万维网的技术规范","他在实验室里提交了一份后来改变世界的方案,上司批复说含糊但有意思,他放弃了把这项技术申请专利以收费的机会","今天所有上网的人都在用他发明的东西,他还在推动网络中立和数据所有权","发明万维网却没有申请专利的那位英国人"],"y":[1955,1955],"s":"科学·技术"},{"n":"林纳斯·托瓦兹","a":["Linus Torvalds","托瓦兹","Linus"],"c":"FIN","r":"欧洲","e":"1969–","f":"科学发明","h":["公元20到21世纪,活跃在1990年代至今","北欧芬兰的赫尔辛基,祖父是统计学教授","程序员,二十几岁还是大学生时就写了操作系统内核","写出了全世界最大的开源操作系统内核,几乎撑起了整个互联网的后台","没写过书,留下了几亿行开源代码和一套版本管理工具","他上学时觉得手上的操作系统不好用就自己写了一个,发到网络论坛上请人一起改,后来越滚越大,他自己发明的那套代码管理工具也被全世界的开发者用","今天全球绝大多数服务器和手机都在跑他写的那套内核,他被叫做世界上最有影响力的程序员之一","开源操作系统内核的作者,顺便发明了那个版本管理工具"],"y":[1969,1969],"s":"科学·技术"},{"n":"凯瑟琳·约翰逊","a":["Katherine Johnson","约翰逊","凯瑟琳"],"c":"USA","r":"美洲","e":"1918–2020","f":"科学发明","h":["公元20到21世纪,和载人航天起步的年代","美国西弗吉尼亚州,十几岁就跳级读完了中学和大学","数学家,在航天研究机构做计算工作","手算了美国第一位环绕地球的航天员的飞行轨迹,还参与了登月任务的关键计算","没写过书,留下的是成箱的计算稿纸和几份技术报告","作为一个黑人女性在当时种族隔离的机构里工作,要去分部开会得跑很远,后来她坚持要求参加简报会,几十年后拿了总统自由勋章","今天有一部电影讲了 断背山、少年派的奇幻漂流、饮食男女","毕业后六年没工作,靠妻子养家,在家写剧本带孩子,后来靠一部家庭三部曲打开局面,之后在好莱坞站稳并两度拿奥斯卡最佳导演","今天他是华人导演在好莱坞最成功的代表,那部武侠片拿了奥斯卡最佳外语片","拿过三座奥斯卡的华人导演,拍卧虎藏龙"],"y":[1954,1954],"s":"电影与戏剧"},{"n":"萨尔瓦多·达利","a":["Salvador Dalí","达利","Dali"],"c":"ESP","r":"欧洲","e":"1904–1989","f":"文学艺术","h":["公元20世纪,超现实主义艺术兴起的年代","西班牙东北部加泰罗尼亚的菲格拉斯,父亲是公证员","画家,留着一撇向上翘的胡子,说话古怪","成为超现实主义最有名的代表人物,那些融化的钟和长腿大象成了现代艺术的标志","作品有记忆的永恒、内战的预感、加拉肖像","被美术学院开除过两次,去巴黎加入了超现实主义团体,后来因为政治和商业上的分歧被开除出团体,晚年建了自己的美术馆","今天他那撇胡子和他设计的珠宝一样出名,融化的钟被印在任何跟梦有关的插画上","画那几只融化的钟的那位翘胡子西班牙画家"],"y":[1904,1989],"s":"美术与建筑"},{"n":"安迪·沃霍尔","a":["Andy Warhol","沃霍尔","Warhol"],"c":"USA","r":"美洲","e":"1928–1987","f":"文学艺术","h":["公元20世纪,波普艺术和大众消费文化兴起的年代","美国宾夕法尼亚州的移民家庭,父母来自东欧","画家、版画师、电影制作人,银色假发是他的标志","把商品和名人做成艺术,是波普艺术最重要的代表人物","作品有金宝汤罐头、玛丽莲双联画、可口可乐瓶","大学学的是商业美术,毕业后在纽约做广告插画,六十年代把工作室刷成银色取名工厂,还办过一本访谈杂志","今天他那句关于每个人都能出名十五分钟的话人人会背,那排彩色罐头和名人头像被印在各种商品上","画金宝汤罐头和玛丽莲头像的那位波普艺术家"],"y":[1928,1987],"s":"美术与建筑"},{"n":"草间弥生","a":["Yayoi Kusama","南瓜女王"],"c":"JPN","r":"东亚","e":"1929–","f":"文学艺术","h":["公元20到21世纪,活跃在1950年代至今","日本长野县松本市的富裕家庭,母亲反对她画画","艺术家,从十岁起就受幻觉困扰,靠画圆点对抗恐惧","把圆点变成自己的语言,作品在全世界巡展,九十多岁还在创作","作品有无限镜屋、大南瓜雕塑、波点系列绘画","二十几岁独自去美国闯荡,在纽约和当时的先锋艺术家们一起办展,后来回到日本住进疗养院,每天往返画室继续画画","今天她的展览在全世界都要排队,那个黄底黑点的大南瓜是最多人心中的打卡点","画满圆点的那位日本女艺术家,南瓜是她的标志"],"y":[1929,1929],"s":"美术与建筑"},{"n":"贝聿铭","a":["I.M. Pei","贝律铭"],"c":"USA","r":"美洲","e":"1917–2019","f":"文学艺术","h":["公元20到21世纪,活跃在1950年代到2000年代","中国广东出生,苏州望族后代,后来去美国学建筑","建筑师,拿过建筑界的最高荣誉普利兹克奖","设计了巴黎那座玻璃金字塔、香港那栋尖顶大楼和一座中东的伊斯兰艺术博物馆","作品有卢浮宫金字塔、中银大厦、苏州博物馆","在苏州的园林里长大,十七岁去美国读建筑,一直在美国的事务所工作,八十年代接手那个最受争议的法国项目时被骂得很惨,后来成了巴黎的地标","今天那座玻璃金字塔是巴黎最受欢迎的景点之一,他被公认为现代主义建筑大师","设计卢浮宫玻璃金字塔的那位华人建筑师"],"y":[1917,2019],"s":"美术与建筑"},{"n":"勒·柯布西耶","a":["Le Corbusier","柯布西耶","勒柯布西耶"],"c":"CHE","r":"欧洲","e":"1887–1965","f":"文学艺术","h":["公元20世纪,现代主义建筑兴起的年代","瑞士西北部的小城,父亲是钟表匠","建筑师、城市规划者,还画画雕塑","提出住宅是居住的机器的理念,创造了现代建筑的五大原则,影响了此后全世界的城市面貌","著作有走向新建筑、模度","没上过正规建筑学校,年轻时在欧洲各地旅行画速写,后来在巴黎开事务所,设计出那栋著名的白色别墅,晚年在地中海边溺水去世","今天他那几座建筑是世界文化遗产,全世界一半以上的现代住宅都受他那套理念影响","提出住宅是居住的机器的那位现代建筑大师"],"y":[1887,1965],"s":"美术与建筑"},{"n":"弗兰克·劳埃德·赖特","a":["Frank Lloyd Wright","赖特","Wright"],"c":"USA","r":"美洲","e":"1867–1959","f":"文学艺术","h":["公元19到20世纪,现代建筑从古典走向当代的年代","美国中西部威斯康星州,母亲用积木教他几何","建筑师,一生设计了一千多个方案","提出有机建筑的概念,设计了那栋悬在瀑布上的房子","作品有流水别墅、古根海姆美术馆、罗比住宅","年轻时在芝加哥的事务所工作,后来自己开业,私生活极其波折,还经历过火灾和谋杀案,九十岁仍在画图","今天那座建在溪流上的别墅是美国最著名的住宅,他设计的螺旋形美术馆成了纽约地标","设计流水别墅和古根海姆的那位美国建筑师"],"y":[1867,1959],"s":"美术与建筑"},{"n":"安东尼·高迪","a":["Antoni Gaudí","高迪","Gaudi"],"c":"ESP","r":"欧洲","e":"1852–1926","f":"文学艺术","h":["公元19到20世纪,加泰罗尼亚现代主义兴起的年代","西班牙东北部加泰罗尼亚,父亲是铜匠,小时候身体不好","建筑师,一生几乎只在一个城市工作","把自然曲线和结构力学结合,留下了一批被列入世界遗产的建筑","作品有圣家堂、米拉之家、巴特罗之家、桂尔公园","一辈子没结婚,大部分时间住在工地附近,晚年衣衫破旧,被有轨电车撞倒后因为看起来像流浪汉而被延迟救治,去世时那座大教堂还没完工","今天那座盖了一百多年还没盖完的教堂是那座城市最著名的地标","圣家堂的设计者,一生只在一个城市盖房子"],"y":[1852,1926],"s":"美术与建筑"},{"n":"扎哈·哈迪德","a":["Zaha Hadid","哈迪德","Zaha"],"c":"IRQ","r":"中东","e":"1950–2016","f":"文学艺术","h":["公元20到21世纪,活跃在1980年代到2010年代","伊拉克巴格达的富裕家庭,后来去伦敦学建筑","建筑师,曲线和流线型是她作品的标志","成为第一位拿到普利兹克建筑奖的女性,设计了多个国家的地标","作品有广州大剧院、伦敦水上运动中心、巴库的盖达尔·阿利耶夫中心","年轻时在伦敦教书画图,有很多年只是纸上建筑师,方案很难建成,后来随着建造技术发展她的造型才变成现实,六十多岁因心脏病突然去世","今天她是建筑界最有名的女性名字,那些像流体一样的白色建筑成了城市的招牌","首位拿到普利兹克奖的女性建筑师,设计广州大剧院"],"y":[1950,2016],"s":"美术与建筑"},{"n":"亨利·马蒂斯","a":["Henri Matisse","马蒂斯","Matisse"],"c":"FRA","r":"欧洲","e":"1869–1954","f":"文学艺术","h":["公元19到20世纪,从印象派到野兽派的年代","法国北部,家里做粮食生意,他本来学的是法律","画家、版画师、雕塑家,晚年剪贴彩色纸","开创了野兽派,把颜色从描摹现实中解放出来,被认为是二十世纪最重要的画家之一","作品有舞蹈、红色房间、爵士剪纸集","二十岁那年生病住院,母亲给他一盒颜料解闷,他从此决定画画,晚年因病不能站立,就坐在轮椅上用剪刀剪彩色纸做作品","今天那幅围成一圈拉手跳舞的画被印在无数海报上,剪纸是他晚年发明的另一条路","画那圈跳舞的人和红色房间的那位法国画家,野兽派开创者"],"y":[1869,1954],"s":"美术与建筑"},{"n":"乔治亚·欧姬芙","a":["Georgia O'Keeffe","欧姬芙","O'Keeffe"],"c":"USA","r":"美洲","e":"1887–1986","f":"文学艺术","h":["公元20到21世纪,现代主义绘画在美国兴起的年代","美国中西部威斯康星州的农场,母亲教她画画","画家,一辈子画沙漠、花朵和骨头","被称作美国现代主义之母,把花朵放大到像风景一样,开创了独特的抽象风格","作品有放大的花朵系列、新墨西哥风景、牛骨头系列","年轻时在得克萨斯教书,后来去纽约成为职业画家,中年之后搬到新墨西哥的荒漠里住,晚年视力衰退仍靠助手帮助继续创作","今天那座荒漠里的房子成了博物馆,她的作品保持着女性艺术家拍卖价的纪录","画巨大的花朵和沙漠白骨的那位美国女画家"],"y":[1887,1986],"s":"美术与建筑"},{"n":"村上隆","a":["Takashi Murakami","Murakami"],"c":"JPN","r":"东亚","e":"1962–","f":"文学艺术","h":["公元20到21世纪,活跃在1990年代至今","日本东京,从小受动漫影响,后来去美国学艺术","艺术家、策展人,把动漫和御宅文化带进当代艺术市场","提出了超扁平的概念,把日本流行文化和高雅艺术打通,与时尚品牌合作过","作品有太阳花系列、多啦A梦与他的联名、我的孤独牛仔","原本想当动画师,后来读日本画博士,九十年代在纽约办展成名,还策划过让日本当代艺术走向国际的项目","今天那朵笑脸太阳花是最畅销的当代艺术符号之一,他和奢侈品牌的联名排队都买不到","画笑脸太阳花的那位日本当代艺术家"],"y":[1962,1962],"s":"美术与建筑"},{"n":"欧内斯特·海明威","a":["Ernest Hemingway","海明威","Hemingway"],"c":"USA","r":"美洲","e":"1899–1961","f":"文学艺术","h":["公元20世纪,两次世界大战之间的文学年代","美国中西部伊利诺伊州奥克帕克,父亲是医生","小说家、记者,参加过一战,一生爱打猎钓鱼","用极简的文体改变了现代小说,拿了诺贝尔文学奖","著作有老人与海、太阳照常升起、永别了武器、丧钟为谁而鸣","高中毕业后当记者,一战时在意大利开救护车受重伤,后来旅居巴黎和古巴,历经四次婚姻,1961年用猎枪结束了自己的生命","今天那本关于老人和鱼的小说是中学必读书,他那种硬汉形象和冰山理论还被作家们讨论","写老人与海的那位硬汉作家,诺贝尔文学奖得主"],"y":[1899,1961],"s":"文学"},{"n":"豪尔赫·路易斯·博尔赫斯","a":["Jorge Luis Borges","博尔赫斯","Borges"],"c":"ARG","r":"美洲","e":"1899–1986","f":"文学艺术","h":["公元20世纪,拉美文学爆炸之前的年代","南美洲南部国家,布宜诺斯艾利斯,祖母是英国人","作家、诗人、图书馆长,晚年双目失明","用短篇小说写出了迷宫、镜子、无限这类主题,影响了全世界的作家","著作有小径分岔的花园、虚构集、阿莱夫","从小在父亲的藏书室里长大,中年因遗传性眼疾逐渐失明,却在那之后写出了最好的作品,还口述创作并去了很多国家讲学","今天他被看作二十世纪最伟大的作家之一,那个关于分岔小径的说法被无数小说引用","写小径分岔的花园的那位阿根廷盲作家"],"y":[1899,1986],"s":"文学"},{"n":"巴勃罗·聂鲁达","a":["Pablo Neruda","聂鲁达","Neruda"],"c":"CHL","r":"美洲","e":"1904–1973","f":"文学艺术","h":["公元20世纪,拉美诗歌和左翼政治的年代","南美洲西海岸的智利南部小镇,母亲早逝","诗人、外交官、政治家,十几岁就开始发表作品","拿过诺贝尔文学奖,二十世纪最有影响的西班牙语诗人之一","著作有二十首情诗和一首绝望的歌、漫歌","本名和笔名不一样,年轻时在圣地亚哥读师范,后来做领事去过亚洲和欧洲,还当过参议员,因为政治立场流亡过","今天他的情诗在全世界被大量朗诵和引用,那句关于今晚我可以写下最悲伤的诗句是西班牙语最著名的开头","写二十首情诗的那位智利诗人,诺贝尔奖得主"],"y":[1904,1973],"s":"文学"},{"n":"马塞尔·普鲁斯特","a":["Marcel Proust","普鲁斯特","Proust"],"c":"FRA","r":"欧洲","e":"1871–1922","f":"文学艺术","h":["公元19到20世纪,和一战前后同时","法国巴黎的富裕家庭,父亲是医生","小说家、评论家,有哮喘病,后半生几乎把自己关在房间里写作","写出了一部七卷本的长篇,被认为是二十世纪最伟大的小说","著作有追忆似水年华","年轻时出入上流社会,写过评论和翻译,母亲去世后开始闭门写作,把童年记忆和社交圈全写进那部巨著,最后几卷是在病中完成的","今天那套七卷本的书是文学专业学生的噩梦也是圣地,开头那块泡在茶里的点心成了著名的文学符号","写追忆似水年华的那位法国作家,那块小点心人人都听说过"],"y":[1871,1922],"s":"文学"},{"n":"詹姆斯·乔伊斯","a":["James Joyce","乔伊斯","Joyce"],"c":"IRL","r":"欧洲","e":"1882–1941","f":"文学艺术","h":["公元19到20世纪,现代主义文学兴起的年代","爱尔兰都柏林,家里孩子很多,家境逐渐败落","小说家、诗人,二十二岁就离开祖国,一生在 function paintMap(freshIso){

  $$('.cty').forEach(el=>{
    const k=cnt[el.dataset.iso]||0;
    if(k){
      el.style.fill=heat(k);el.classList.add('lit','hot');
      if(k>=5)el.classList.add('glow');else el.classList.remove('glow');

function ripple(iso){
  const c=MAP.c[iso];if(!c)return;
  const box=$('#mapbox'),d=document.createElement('div');
  d.className='pulse';d.style.left=(c.x/1000*100)+'%';d.style.top=(c.y/501*100)+'%';
  box.appendChild(d);setTimeout(()=>d.remove(),1100);

function renderLabels(fresh){
  const box=$('#labels');box.innerHTML='';
  if(S.cleared)return;
  const g={};
  S.order.forEach(n=>{const p=BYNAME[n];if(!p)return;(g[p.c]=g[p.c]||[]).push(n)});
  const bw=$('#labels').clientWidth||1000;
  const maxC=bw<500?4:(bw<650?8:(bw<820?16:(bw<1100?32:99)));
  const lastTs=iso=>Math.max(...g[iso].map(n=>S.solved[n]||0));
  const all=Object.keys(g).sort((a,b)=>(g[b].length-g[a].length)||(lastTs(b)-lastTs(a)));
  // 网格限流：同一片区域最多挂 3 个国家，避免欧洲一带糊成一团
  const GX=8,GY=5,PER=(($('#labels').clientHeight||500)<430)?2:3,cells={};
  const kept=all.filter(iso=>{
    const c=MAP.c[iso];if(!c)return false;
    const k=Math.floor(c.x/1000*GX)+','+Math.floor(c.y/501*GY);
    cells[k]=(cells[k]||0)+1;
    return cells[k]<=PER;
  });
  const isoList=kept.slice(0,maxC);
  const hiddenN=Math.max(0,all.length-isoList.length);
  const n=isoList.length;
  const cap=(bw<620?1:(n<=6?4:(n<=14?2:1)));
  const dense=n>40?'2':(n>22?'1':'0');
  $('#labels').dataset.dense=dense;
  $('#mapSp').textContent=hiddenN>0
    ? `猜中的人物会刻在国家版图上 · 已显示最近 ${maxC} 个国家（另 ${hiddenN} 国已点亮，点击查看）`
    : '猜中的人物会刻在他所属国家的版图上';
  isoList.forEach(iso=>{
    const c=MAP.c[iso];if(!c)return;
    const list=g[iso].slice().reverse();
    const show=list.slice(0,cap), more=list.length-show.length;
    const wrap=document.createElement('div');wrap.className='lb';
    let x=Math.max(3.5,Math.min(96.5,c.x/1000*100));
    let y=Math.max(3,Math.min(97,c.y/501*100));
    wrap.style.left=x+'%';wrap.style.top=y+'%';
    wrap.dataset.iso=iso;
    const inner=document.createElement('div');inner.className='lbi';
    show.forEach(n=>{
      const s=document.createElement('span');
      s.className='nm'+((fresh&&n===fresh)?' fresh':'');
      s.textContent=n;inner.appendChild(s);
    });
    if(more>0){const s=document.createElement('span');s.className='nm more';s.textContent='+'+more;inner.appendChild(s)}
    wrap.appendChild(inner);
    wrap.addEventListener('click',e=>{e.stopPropagation();openCountry(iso)});
    box.appendChild(wrap);
  });
  nudgeLabels();
}
/* 标签避让：密集区域把名字上下错开，避免糊成一团 */
function nudgeLabels(){
  const box=$('#labels');
  const W=box.clientWidth||1,H=box.clientHeight||1;
  if(W<10)return;
  box.dataset.tiny=W<520?'1':'0';
  const svg=$('#world');
  const lead=document.getElementById('lead');
  if(lead)lead.innerHTML='';
  const sx=1000/W, sy=501/H;
  const els=Array.from(box.querySelectorAll('.lb'));
  const placed=[];
  const step=Math.max(12,Math.min(22,H*0.036));
  const cands=[[0,0]];
  for(let r=1;r<=6;r++){
    for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
      cands.push([dx,dy]);
    }
  }
  els.forEach(el=>{
    const w=el.offsetWidth||38,h=el.offsetHeight||14;
    const cx0=parseFloat(el.style.left)/100*W,cy0=parseFloat(el.style.top)/100*H;
    let best=null,bestScore=Infinity;
    for(const [dx,dy] of cands){
      const cx=cx0+dx*step*0.95,cy=cy0+dy*step;
      const r={l:cx-w/2,r:cx+w/2,t:cy-h/2,b:cy+h/2};
      if(r.l<1||r.r>W-1||r.t<1||r.b>H-1)continue;
      let score=0;
      for(const p of placed){
        const ox=Math.min(r.r,p.r)-Math.max(r.l,p.l);
        const oy=Math.min(r.b,p.b)-Math.max(r.t,p.t);
        if(ox>0&&oy>0)score+=ox*oy;
      }
      score+=Math.hypot(dx*step*0.95,dy*step)*1.6;   // 轻微惩罚位移，优先贴近本国
      if(score<bestScore){bestScore=score;best={cx,cy,r}}
      if(score<1)break;
    }
    if(!best)best={cx:cx0,cy:cy0,r:{l:cx0-w/2,r:cx0+w/2,t:cy0-h/2,b:cy0+h/2}};
    placed.push(best.r);
    el.style.left=(best.cx/W*100).toFixed(3)+'%';
    el.style.top=(best.cy/H*100).toFixed(3)+'%';
    if(lead&&Math.hypot(best.cx-cx0,best.cy-cy0)>14){
      const ln=document.createElementNS(NS,'line');
      ln.setAttribute('x1',(cx0*sx).toFixed(1));ln.setAttribute('y1',(cy0*sy).toFixed(1));
      ln.setAttribute('x2',(best.cx*sx).toFixed(1));ln.setAttribute('y2',(best.cy*sy).toFixed(1));
      lead.appendChild(ln);
    }
  });
}

let history=[];
/* ================= 时代 / 领域 分组 ================= */
const ERAS=[
  ['上古文明',-99999,-800],['古典时代',-800,500],['中世纪',500,1400],
  ['大航海与文艺复兴',1400,1650],['启蒙与大革命',1650,1800],['工业时代',1800,1880],
  ['一战与二战',1880,1945],['冷战年代',1945,1991],['当代',1991,99999]
];
const FIELDS=Object.keys(FIELD_ZH);
const SUBS=['音乐','美术与建筑','电影与戏剧','文学','科学·技术','思想·哲学','体育','商业·创业','探险·航天','宗教·神话'];
const GRPS=['新中国政治'];
function eraOf(p){const y=p.y||[0,0],b=y[0],d=(y[1]>y[0]?y[1]:y[0]+60),m=(b+d)/2;
  for(const e of ERAS){if(m>=e[1]&&m<e[2])return e[0]}
  return ERAS[ERAS.length-1][0]}
function poolName(){return POOL.kind==='all'?'不限':POOL.val}
function poolList(){
  if(POOL.kind==='grp')return PEOPLE.filter(p=>p.g===POOL.val);
  if(POOL.kind==='era')return PEOPLE.filter(p=>eraOf(p)===POOL.val);
  if(POOL.kind==='field')return PEOPLE.filter(p=>p.f===POOL.val);
  if(POOL.kind==='sub')return PEOPLE.filter(p=>p.s===POOL.val);
  return PEOPLE.slice();
}
function poolLeft(){return poolList().filter(p=>!S.solved[p.n]).length}
function unsolved(){return poolList().filter(p=>!S.solved[p.n])}
function pick(){
  const u=unsolved();
  S.hints=1;S.wrong=0;S.revealed=false;
  if(!u.length){S.cur=null;return null}
  S.cur=u[Math.floor(Math.random()*u.length)];
  return S.cur;
}
const HINT_KEYS=['成就','生平','身份','著作','网络梗','地域','时代','点睛'];
function renderQ(){
  const p=S.cur;
  $('#fb').className='fb';$('#fb').innerHTML='';
  $('#reveal').className='reveal';$('#reveal').innerHTML='';
  $('#gb').disabled=false;$('#gi').disabled=false;$('#gi').value='';$('#hintBtn').disabled=false;
  document.querySelector('.game').classList.remove('solved');

    $('#clues').innerHTML=`<li>🎉 「${poolName()}」这一档的 ${poolList().length} 位已经全部猜完了,点右上角 🎯 换一档继续。</li>`;
    $('#hintBtn').disabled=true;$('#gb').disabled=true;$('#gi').disabled=true;

  }
  $('#qIdx').textContent=solvedNames().length+1;

}
function renderRegion(){
  const p=S.cur,el=$('#qRegion');
  if(!p){el.textContent='—';return}
  el.textContent=S.hints>REGION_AT?(REGION_ZH[p.r]||p.r):'地域 ??';
  el.title=S.hints>REGION_AT?'':'再解锁到第 6 条提示才亮出地域';
}
function drawClues(){
  const p=S.cur;if(!p)return;
  const ul=$('#clues');ul.innerHTML='';
  HINT_SEQ.forEach((idx,i)=>{
    const h=p.h[idx]||'';
    const li=document.createElement('li');
    if(i<S.hints){li.innerHTML=`<span class="k">${HINT_KEYS[i]||''}</span><span>${h}</span>`}
    else{li.className='locked';li.innerHTML=`<span class="k">?</span><span>提示未解锁</span>`}
    ul.appendChild(li);
  });
  $('#qHint').textContent=`提示 ${S.hints} / ${p.h.length}`;
  $('#qBar').style.width=(S.hints/p.h.length*100)+'%';
  $('#hintBtn').disabled=S.hints>=p.h.length;
  $('#hintBtn').innerHTML=S.hints>=p.h.length?'提示已全部解锁':`再要一条提示 <em>−8 分</em>`;
  renderRegion();
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1900)}
function feedback(html,cls){const f=$('#fb');f.className='fb on '+(cls||'');f.innerHTML=html}

function guessLoop(){
  const p=S.cur;if(!p)return;
  const v=$('#gi').value.trim();
  if(!v){toast('先输入一个名字');return}
  if(matchGuess(v,p)){onCorrect();return}
  const g=BYNAME[v]||PEOPLE.find(x=>matchGuess(v,x));
  S.wrong++;
  $('#qWrong').textContent=`猜错 ${S.wrong} 次`;
  let tags='';
  if(g&&g!==p){
    const [et,ed]=eraGap(g,p);
    const sameC=g.c===p.c, sameR=g.r===p.r, sameF=g.f===p.f;
    tags=`<div class="tagline">
      <span class="tg ${ed===1?'y':ed===2?'m':'n'}">时代：${et}</span>
      <span class="tg ${sameC?'y':sameR?'m':'n'}">地域：${sameC?'同一个国家':sameR?'同一地区':'不同地区'}</span>
      <span class="tg ${sameF?'y':'n'}">领域：${sameF?'同一个领域':'不同领域'}</span>
      <span class="tg">他：${g.e} · ${FIELD_ZH[g.f]||g.f}</span>
    </div>`;
    feedback(`<b>${g.n}</b> 不是答案。方向给你：${tags}`);
  }else{
    feedback(`「${v}」不在我的档案库里，或者不是这个名字。换个写法试试——中文名、别名、英文名都认。`);
  }
  $('#gi').value='';$('#gi').focus();
  history.push(v);
}
function onCorrect(){
  const p=S.cur;
  const gain=Math.max(10,100-(S.hints-1)*8-S.wrong*5);
  S.score+=gain;S.solved[p.n]=Date.now();
  if(!S.order.includes(p.n))S.order.push(p.n);
  const first=S.wrong===0;
  if(first&&(!S.best||gain>(S.best.gain||0)))S.best={name:p.n,gain};
  save();
  S.revealed=true;
  document.querySelector('.game').classList.add('solved');
  const isCn=p.c==='CHN';
  feedback(`✅ 猜对了，就是 <b>${p.n}</b>！这个国家版图上多了一个名字。`);
  $('#reveal').className='reveal on';
  $('#reveal').innerHTML=`
    <div class="rv-act">
      <span class="ok">✅ 已确认 · ${p.n} · 本局 +${gain} 分</span>
      <span class="hint">回车 / 空格也能翻下一位</span>
      <button class="btn primary" id="nextBtn">下一位 →</button>
    </div>
    <div class="rv-top">
      <div class="rv-flag">${(MAP.c[p.c]||{z:p.c}).z.slice(0,1)}</div>
      <div>
        <div class="rv-name">${p.n}</div>
        <div class="rv-sub">${(MAP.c[p.c]||{z:p.c}).z} · ${p.e} · ${FIELD_ZH[p.f]||p.f}</div>
      </div>
    </div>
    <div class="rv-facts">
      <div class="fact"><span class="fk">时代</span><span class="fv">${p.e}</span></div>
      <div class="fact"><span class="fk">成就</span><span class="fv">${p.h[3]}</span></div>
      <div class="fact"><span class="fk">著作</span><span class="fv">${p.h[4]}</span></div>
      <div class="fact"><span class="fk">生平</span><span class="fv">${p.h[5]}</span></div>
      <div class="fact"><span class="fk">出圈</span><span class="fv">${p.h[6]}</span></div>
    </div>
    ${first?'<div class="rv-score"><span class="rank">零错猜中,一次都没猜错</span></div>':''}`;
  $('#gb').disabled=true;$('#gi').disabled=true;$('#hintBtn').disabled=true;
  $('#nextBtn').onclick=next;
  paintMap(p.c);renderLabels(p.n);syncStats();renderDex();save();

function renderDex(){
  const box=$('#dexList');
  const g={};
  S.order.forEach(n=>{const p=BYNAME[n];if(!p)return;(g[p.c]=g[p.c]||[]).push(p)});
  const isos=Object.keys(g).sort((a,b)=>g[b].length-g[a].length);
  if(!isos.length){box.innerHTML='<div class="dexempty">还没有猜中任何人。上面开始吧。</div>';return}
  box.innerHTML='';
  isos.forEach(iso=>{
    const c=MAP.c[iso]||{z:iso};
    const d=document.createElement('div');d.className='dcard';
    d.innerHTML=`<div class="dc-flag">${c.z.slice(0,1)}</div>
      <div style="min-width:0"><div class="dc-n">${c.z}</div><div class="dc-e">已刻上 ${g[iso].length} 个名字</div></div>`;
    d.onclick=()=>openCountry(iso);

  $$('.lb').forEach(el=>{if(el.dataset.iso===p.c){el.querySelectorAll('.nm').forEach((n,i)=>{n.classList.remove('fresh');void n.offsetWidth;if(i===0)n.classList.add('fresh')})}});
  toast(`${p.n} · ${c.z}`);
};
document.addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('on')});
let _rzT;addEventListener('resize',()=>{clearTimeout(_rzT);_rzT=setTimeout(()=>{if(!S.cleared)renderLabels()},240)});

/* ================= 换档面板 ================= */
function pickCards(rows){
  return rows.map(r=>`<div class="pcard${POOL.kind===r[0]&&String(POOL.val)===String(r[1])?' on':''}"
    data-k="${r[0]}" data-v="${r[1]==null?'':r[1]}"><span>${r[2]}</span><span class="n">${r[3]} 位</span></div>`).join('');
}
function renderPick(){
  const on=(k,v)=>POOL.kind===k&&String(POOL.val)===String(v);
  let html=`<h3>选一个出题范围</h3><div class="msub">选完只从这一档里出题,已猜中的进度、地图和图鉴全部保留。</div>`;
  html+=`<div class="pickg"><h4>不 限</h4><div class="pickcards">
    <div class="pcard${POOL.kind==='all'?' on':''}" data-k="all" data-v=""><span>不限 · 全部</span>
    <span class="n">${PEOPLE.length} 位 · 剩 ${PEOPLE.filter(p=>!S.solved[p.n]).length}</span></div></div></div>`;
  html+=`<div class="pickg"><h4>专 题 分 区</h4><div class="pickcards">`+pickCards(GRPS.map(g=>['grp',g,g,
        PEOPLE.filter(p=>p.g===g).length]))+`</div></div>`;
  html+=`<div class="pickg"><h4>按 时 代</h4><div class="pickcards">`+pickCards(ERAS.map(e=>['era',e[0],e[0],
        PEOPLE.filter(p=>eraOf(p)===e[0]).length]))+`</div></div>`;
  html+=`<div class="pickg"><h4>按 领 域</h4><div class="pickcards">`+pickCards(FIELDS.map(f=>['field',f,f,
        PEOPLE.filter(p=>p.f===f).length]))+`</div></div>`;
  html+=`<div class="pickg"><h4>按 细 分 领 域</h4><div class="pickcards">`+pickCards(SUBS.map(s=>['sub',s,s,
        PEOPLE.filter(p=>p.s===s).length]))+`</div></div>`;
  html+=`<div class="row" style="margin-top:4px"><button class="btn" id="pickClose" style="flex:1">关闭</button></div>`;
  const box=$('#pickBox');box.innerHTML=html;
  box.querySelectorAll('.pcard').forEach(el=>{
    el.onclick=()=>{
      const k=el.dataset.k;
      POOL={kind:k,val:k==='all'?null:el.dataset.v};
      save();renderPick();$('#pick').classList.remove('on');
      $('#qMode').textContent=poolName();
      next();syncStats();
      toast(`已切到「${poolName()}」,这一档还剩 ${poolLeft()} 位`);
    };
  });
  $('#pickClose').onclick=()=>$('#pick').classList.remove('on');
}
function openPick(){$('#pick').classList.add('on');renderPick()}
$('#modeBtn').onclick=openPick;
$('#qMode').onclick=openPick;
$('#pick').addEventListener('click',e=>{if(e.target.id==='pick')$('#pick').classList.remove('on')});
addEventListener('keydown',e=>{
  if(!S.revealed)return;
  const a=document.activeElement;
  if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='BUTTON'))return;
  if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){e.preventDefault();next()}
});

/* ================= 启动 ================= */
applyTheme();
buildMap();
paintMap();
renderLabels();
syncStats();
renderDex();
$('#brandN').textContent=PEOPLE.length;
$('#sTotal').textContent=PEOPLE.length;
$('#qMode').textContent=poolName();
S.cur=pick();
renderQ();
if(!S.order.length&&!Object.keys(S.solved).length)openPick();
</script>
