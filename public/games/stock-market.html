<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>股海风云 · 90天 | 模拟股市</title>
<style>
/* =========================================================================
   主题变量 —— 默认深色；html[data-theme="light"] 覆盖为浅色
   切换逻辑在 <head> 内联脚本里先跑，避免刷新时闪白/闪黑
   ========================================================================= */
:root{
  --bg:#070a0f;
  --bg-ov:rgba(4,7,11,.93);
  --panel:#0d141c;
  --panel-head:#101923;
  --topbar-bg:linear-gradient(180deg,#101822,#0c131b);
  --line:#1b2735;
  --line-soft:#131d27;
  --line-faint:#101923;
  --txt:#c3d0de;
  --txt-2:#aebfd2;
  --strong:#dbe6f2;
  --strong-2:#e3edf8;
  --dim:#7d90a6;
  --dim-2:#6b7c92;
  --dim-3:#5d6f85;
  --dim-4:#4c5f76;
  --dim-5:#42536a;
  --dim-6:#3a4b5e;
  --hover:#131f2c;
  --active:#152434;
  --input-bg:#0a1119;
  --input-line:#233245;
  --input-focus:#3d6491;
  --bar-bg:#16202b;
  --up:#ff4d4f;
  --down:#0ecb81;
  --gold:#f0b90b;
  --accent:#4a9eff;
  --btn-bg:#182433;
  --btn-line:#26384c;
  --btn-txt:#b9c9da;
  --btn-hover:#22334a;
  --btn-hover-line:#35506e;
  --btn-hover-txt:#ffffff;
  --scroll-track:#0b1017;
  --scroll-thumb:#22303f;
  --scroll-thumb-hover:#2f4256;
  --card:#0d141c;
  --card-line:#22303f;
  --card-shadow:rgba(0,0,0,.75);
  --toast-bg:rgba(11,17,24,.97);
  --toast-line:#2a3c52;
  --toast-shadow:rgba(0,0,0,.65);
  --tip-bg:rgba(9,14,20,.96);
  --tip-line:#2a3c52;
  --pill-hold-bg:#213b52;
  --pill-hold-tx:#6db3e8;
  --chip-on-bg:#1c1f14;
  --inset-shadow:rgba(0,0,0,.6);
  --focus-ring:rgba(61,100,145,.18);
  --ma5:#f0b90b;
  --ma20:#7a6bff;
  --cost-line:#5b8fd6;
  --cross:#39516b;
  --chart-grid:#131d27;
  --chart-axis:#1b2735;
  --chart-label:#42536a;
  --vol-up:rgba(255,77,79,.34);
  --vol-down:rgba(14,203,129,.34);
  --candle-tag-tx:#0a0e13;
  --lim-up:rgba(255,77,79,.10);
  --lim-up2:rgba(255,77,79,.02);
  --lim-dn:rgba(14,203,129,.10);
  --lim-dn2:rgba(14,203,129,.02);
  --news-good:#ff8f90;
  --news-bad:#4fdba0;
  --news-neutral:#93a7bd;
  --news-rumor:#c9a24a;
  --news-macro:#7fc4ff;
  --news-geo:#c792ff;
  --badge-macro-line:#2c4a66;
  --badge-rumor-line:#5a4a1e;
  --badge-geo-line:#4a3568;
  --geo-row-bg:rgba(168,120,255,.07);
  --diff-on-bg:#1c1f14;
  --btn-gold-tx:#1a1503;
  --buy-bg:#3a1618;   --buy-tx:#ff6b6d;   --buy-line:#5a2226;   --buy-hover:#4d1c1f;  --buy-hover-tx:#ff8a8c;
  --sell-bg:#0e2a22;  --sell-tx:#0ecb81;  --sell-line:#17493a;  --sell-hover:#123a2f;
}
html[data-theme="light"]{
  --bg:#e8edf4;
  --bg-ov:rgba(222,229,238,.88);
  --panel:#ffffff;
  --panel-head:#f4f7fb;
  --topbar-bg:linear-gradient(180deg,#ffffff,#f2f6fa);
  --line:#d7e0ea;
  --line-soft:#e7edf4;
  --line-faint:#eef3f8;
  --txt:#3d4f64;
  --txt-2:#3a4e66;
  --strong:#152a41;
  --strong-2:#0d2036;
  --dim:#6d8098;
  --dim-2:#7b8ea3;
  --dim-3:#8b9cae;
  --dim-4:#9aaabb;
  --dim-5:#a8b7c6;
  --dim-6:#bcc9d6;
  --hover:#f0f5fa;
  --active:#e6eff9;
  --input-bg:#f8fafd;
  --input-line:#cbd6e3;
  --input-focus:#7aa6d8;
  --bar-bg:#e5ebf3;
  --up:#df2b32;
  --down:#0d9760;
  --gold:#b58200;
  --accent:#2f7fe0;
  --btn-bg:#f2f6fb;
  --btn-line:#ccd8e5;
  --btn-txt:#485d75;
  --btn-hover:#e5eef9;
  --btn-hover-line:#9dbbdd;
  --btn-hover-txt:#132437;
  --scroll-track:#eef2f7;
  --scroll-thumb:#c5d1df;
  --scroll-thumb-hover:#a8b8ca;
  --card:#ffffff;
  --card-line:#d7e0ea;
  --card-shadow:rgba(24,44,72,.18);
  --toast-bg:rgba(255,255,255,.98);
  --toast-line:#ccd8e5;
  --toast-shadow:rgba(24,44,72,.16);
  --tip-bg:rgba(255,255,255,.98);
  --tip-line:#ccd8e5;
  --pill-hold-bg:#dcebfb;
  --pill-hold-tx:#1d6cb0;
  --chip-on-bg:#e3eefc;
  --inset-shadow:rgba(24,44,72,.10);
  --focus-ring:rgba(122,166,216,.30);
  --ma5:#c89000;
  --ma20:#6a5bff;
  --cost-line:#2f6fd0;
  --cross:#b3c2d3;
  --chart-grid:#e8eef5;
  --chart-axis:#d7e0ea;
  --chart-label:#8b9cae;
  --vol-up:rgba(223,43,50,.30);
  --vol-down:rgba(13,151,96,.30);
  --candle-tag-tx:#ffffff;
  --lim-up:rgba(223,43,50,.10);
  --lim-up2:rgba(223,43,50,.015);
  --lim-dn:rgba(13,151,96,.10);
  --lim-dn2:rgba(13,151,96,.015);
  --news-good:#c0292f;
  --news-bad:#0a8a57;
  --news-neutral:#4a5c72;
  --news-rumor:#97720f;
  --news-macro:#1c6cc2;
  --news-geo:#7431c9;
  --badge-macro-line:#b9d2ea;
  --badge-rumor-line:#e0cf9a;
  --badge-geo-line:#d3c0ee;
  --geo-row-bg:rgba(116,49,201,.055);
  --diff-on-bg:#fdf7e3;
  --btn-gold-tx:#2a1f00;
  --buy-bg:#fdecec;   --buy-tx:#c62b2f;   --buy-line:#f2c3c4;   --buy-hover:#fbdcdd;  --buy-hover-tx:#a81f23;
  --sell-bg:#e8f7f0;  --sell-tx:#0b8a58;  --sell-line:#b9e2d1;  --sell-hover:#d8f0e6;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%}
body{
  background:var(--bg);color:var(--txt);overflow:hidden;
  font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
  font-size:13px;-webkit-font-smoothing:antialiased;
  transition:background-color .22s ease,color .22s ease;
}
.num{font-family:"Consolas","Cascadia Mono","JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--scroll-track)}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-thumb-hover)}

#app{display:flex;flex-direction:column;height:100vh;min-height:520px}

/* ---------- 顶栏 ---------- */
.topbar{
  display:flex;align-items:center;gap:18px;padding:9px 16px;
  background:var(--topbar-bg);
  border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:8px;padding-right:16px;border-right:1px solid var(--line)}
.brand b{font-size:16px;color:var(--gold);letter-spacing:1px}
.brand span{font-size:11px;color:var(--dim-3)}
.kv{display:flex;flex-direction:column;line-height:1.35}
.kv i{font-size:10px;color:var(--dim-3);font-style:normal;letter-spacing:.5px}
.kv b{font-size:14px;color:var(--strong);font-weight:600}
.kv b.up{color:var(--up)}.kv b.down{color:var(--down)}
.grow{flex:1 1 auto}
.btn{
  background:var(--btn-bg);color:var(--btn-txt);border:1px solid var(--btn-line);border-radius:5px;
  padding:7px 14px;cursor:pointer;font-size:12.5px;font-family:inherit;transition:.13s;white-space:nowrap;
}
.btn:hover{background:var(--btn-hover);border-color:var(--btn-hover-line);color:var(--btn-hover-txt)}
.btn:active{transform:translateY(1px)}
.btn.gold{background:linear-gradient(180deg,#f0b90b,#d29d06);color:var(--btn-gold-tx);border-color:#f0b90b;font-weight:700}
.btn.gold:hover{filter:brightness(1.12)}
.btn.buy{background:var(--buy-bg);color:var(--buy-tx);border-color:var(--buy-line)}
.btn.buy:hover{background:var(--buy-hover);color:var(--buy-hover-tx)}
.btn.sell{background:var(--sell-bg);color:var(--sell-tx);border-color:var(--sell-line)}
.btn.sell:hover{background:var(--sell-hover)}
.btn:disabled{opacity:.32;cursor:not-allowed;transform:none}
.btn.sm{padding:6px 10px;font-size:12px}

/* ---------- 主体 ---------- */
.grid{flex:1 1 auto;display:grid;grid-template-columns:322px 1fr 322px;gap:8px;padding:8px;overflow:hidden;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:7px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.ph{
  display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid var(--line);
  background:var(--panel-head);font-size:11.5px;color:var(--dim);letter-spacing:1px;flex:0 0 auto;
}
.ph b{color:var(--txt-2);font-weight:600;letter-spacing:.5px}
.ph .tag{font-size:10px;padding:2px 6px;border:1px solid var(--btn-line);border-radius:3px;color:var(--dim-2)}
.ph .nchk{
  margin-left:auto;display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim-2);
  cursor:pointer;letter-spacing:0;border:1px solid var(--btn-line);border-radius:3px;
  padding:2px 7px;background:var(--btn-bg);white-space:nowrap;user-select:none;flex:0 0 auto;
}
.ph .nchk:hover{color:var(--txt-2)}
.ph .nchk input{accent-color:var(--gold);width:12px;height:12px;margin:0;cursor:pointer;flex:0 0 auto}
.ph .nchk.on{color:var(--gold);border-color:var(--gold)}
.news-none{padding:16px 12px;text-align:center;font-size:11.5px;color:var(--dim-3);line-height:1.8}
.pb{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;min-height:0}

/* 行业筛选条 */
.secbar{display:flex;gap:5px;padding:7px 9px;overflow-x:auto;border-bottom:1px solid var(--line);flex:0 0 auto}
.secbar::-webkit-scrollbar{height:5px}
.chip{
  display:flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid var(--btn-line);border-radius:12px;
  background:var(--btn-bg);color:var(--btn-txt);font-size:11px;cursor:pointer;white-space:nowrap;
  transition:.13s;flex:0 0 auto;font-family:inherit;
}
.chip:hover{background:var(--btn-hover);border-color:var(--btn-hover-line)}
.chip.on{border-color:var(--gold);color:var(--strong);background:var(--chip-on-bg);font-weight:600}
.chip i{width:7px;height:7px;border-radius:50%;display:block;flex:0 0 auto}
.chip .c{font-family:"Consolas",monospace;font-size:10.5px}

/* 行业分组 */
.sgh{
  display:flex;align-items:center;gap:7px;padding:6px 11px;background:var(--panel-head);
  border-bottom:1px solid var(--line-soft);cursor:pointer;position:sticky;top:0;z-index:2;
}
.sgh:hover{background:var(--hover)}
.sgh .dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.sgh .nm{font-size:11.5px;color:var(--txt-2);font-weight:600;letter-spacing:.5px}
.sgh .c{font-size:11px;font-family:"Consolas",monospace;margin-left:auto}
.sgh .cnt{font-size:10px;color:var(--dim-3)}
.sgh .arw{font-size:9px;color:var(--dim-3);transition:transform .15s;display:inline-block}
.sgh .fire{font-size:10px}
.sgroup.closed .srows{display:none}
.sgroup.closed .arw{transform:rotate(-90deg)}

/* 股票列表 */
.srow{
  display:grid;grid-template-columns:1fr 76px 62px;gap:6px;align-items:center;
  padding:7px 11px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:.1s;position:relative;
}
.srow:hover{background:var(--hover)}
.srow.act{background:var(--active);box-shadow:inset 3px 0 0 var(--gold)}
.srow.limup{background:linear-gradient(90deg,var(--lim-up),var(--lim-up2))}
.srow.limdn{background:linear-gradient(90deg,var(--lim-dn),var(--lim-dn2))}
.srow.act.limup,.srow.act.limdn{box-shadow:inset 3px 0 0 var(--gold)}
.srow .nm{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.srow .nm b{font-size:13px;color:var(--strong);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .nm i{font-size:10px;color:var(--dim-3);font-style:normal}
.srow .px{text-align:right;font-size:13.5px;font-weight:600}
.srow .ch{text-align:right;font-size:12px;font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--dim)}
.pill{position:absolute;right:8px;top:5px;font-size:9px;padding:1px 4px;border-radius:2px}
.pill.hold{background:var(--pill-hold-bg);color:var(--pill-hold-tx)}

/* 中部 */
.mid{display:grid;grid-template-rows:auto 1fr;gap:8px;min-height:0}
.metrics{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.metric{background:var(--panel);padding:8px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.metric i{font-size:10px;color:var(--dim-3);font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric b{font-size:14.5px;color:var(--strong);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;background:var(--bar-bg);border-radius:2px;overflow:hidden;margin-top:2px}
.bar>div{height:100%;border-radius:2px;transition:width .35s}

#chartWrap{position:relative;flex:1 1 auto;min-height:0}
canvas{display:block;width:100%;height:100%}
#tip{
  position:absolute;pointer-events:none;background:var(--tip-bg);border:1px solid var(--tip-line);
  border-radius:5px;padding:7px 10px;font-size:11.5px;line-height:1.65;display:none;z-index:9;
  box-shadow:0 6px 22px var(--inset-shadow);white-space:nowrap;color:var(--txt);
}
#tip b{color:var(--strong-2)}

/* 右栏 */
.trade-form{padding:11px;display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--line)}
.tf-head{display:flex;justify-content:space-between;align-items:baseline}
.tf-head b{font-size:15px;color:var(--strong-2)}
.tf-head span{font-size:12px}
.inp{
  width:100%;background:var(--input-bg);border:1px solid var(--input-line);border-radius:5px;color:var(--strong-2);
  padding:8px 10px;font-size:14px;font-family:"Consolas",monospace;outline:none;
}
.inp:focus{border-color:var(--input-focus);box-shadow:0 0 0 2px var(--focus-ring)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.quick button{
  background:var(--btn-bg);border:1px solid var(--btn-line);color:var(--btn-txt);border-radius:4px;
  padding:5px 0;font-size:11px;cursor:pointer;font-family:inherit;transition:.12s;
}
.quick button:hover{background:var(--btn-hover);color:var(--btn-hover-txt);border-color:var(--btn-hover-line)}
.cost{font-size:11.5px;color:var(--dim-2);line-height:1.75;padding:8px 10px;background:var(--input-bg);border-radius:5px;border:1px solid var(--line-soft)}
.cost span{float:right;color:var(--txt-2);font-family:"Consolas",monospace}
.act{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.act .btn{padding:10px 0;text-align:center;font-size:13.5px;font-weight:600}

.pos{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:8px 11px;border-bottom:1px solid var(--line-soft);font-size:12px;cursor:pointer}
.pos:hover{background:var(--hover)}
.pos .nm{color:var(--strong);font-weight:600}
.pos .sub{grid-column:1/-1;display:flex;justify-content:space-between;font-size:11px;color:var(--dim-2);font-family:"Consolas",monospace}
.empty{padding:22px 11px;text-align:center;color:var(--dim-5);font-size:12px}

/* 底部新闻 */
.newsbar{
  flex:0 0 auto;height:142px;display:grid;grid-template-columns:1fr 226px 250px;gap:8px;padding:0 8px 8px;
}
.news-list{overflow-y:auto;padding:4px 0}
.nrow{display:flex;gap:8px;padding:5px 11px;font-size:12px;line-height:1.5;border-bottom:1px solid var(--line-faint);align-items:flex-start}
.nrow .d{color:var(--dim-4);font-family:"Consolas",monospace;font-size:11px;flex:0 0 38px;padding-top:1px}
.nrow .t{flex:1 1 auto}
.nrow.good .t{color:var(--news-good)}
.nrow.bad .t{color:var(--news-bad)}
.nrow.neutral .t{color:var(--news-neutral)}
.nrow.rumor .t{color:var(--news-rumor);font-style:italic}
.nrow.macro .t{color:var(--news-macro)}
.nrow.geo .t{color:var(--news-geo)}
.nrow.geo{background:var(--geo-row-bg)}
.nbadge{font-size:9px;padding:1px 5px;border-radius:2px;border:1px solid var(--btn-line);color:var(--dim-2);flex:0 0 auto;margin-top:2px;white-space:nowrap}
.nbadge.macro{border-color:var(--badge-macro-line);color:var(--news-macro)}
.nbadge.rumor{border-color:var(--badge-rumor-line);color:var(--news-rumor)}
.nbadge.geo{border-color:var(--badge-geo-line);color:var(--news-geo)}

/* 板块热度 */
.hrow{
  display:grid;grid-template-columns:1fr 56px 52px;gap:6px;align-items:center;
  padding:5px 10px;border-bottom:1px solid var(--line-faint);font-size:11.5px;cursor:pointer;transition:.1s;
}
.hrow:hover{background:var(--hover)}
.hrow.act{background:var(--active);box-shadow:inset 3px 0 0 var(--gold)}
.hrow .nm{display:flex;align-items:center;gap:6px;min-width:0}
.hrow .nm b{font-weight:600;color:var(--txt-2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.hrow .pct{text-align:right;font-family:"Consolas",monospace;font-size:11px}
.hrow .pct.s{color:var(--dim-2)}

.blotter{display:flex;flex-direction:column;overflow:hidden}
.blotter .pb{padding:4px 0}
.brow{display:flex;gap:8px;padding:4px 11px;font-size:11.5px;font-family:"Consolas",monospace;border-bottom:1px solid var(--line-faint)}
.brow .d{color:var(--dim-4);flex:0 0 34px}
.brow b{font-weight:600}

/* Toast */
#toasts{position:fixed;top:56px;right:18px;z-index:60;display:flex;flex-direction:column;gap:7px;pointer-events:none;max-width:400px}
.toast{
  background:var(--toast-bg);border:1px solid var(--toast-line);border-left:3px solid var(--accent);border-radius:6px;
  padding:9px 13px;font-size:12.5px;line-height:1.5;box-shadow:0 8px 28px var(--toast-shadow);
  animation:slide .3s ease-out;color:var(--txt);
}
.toast.good{border-left-color:var(--up)}.toast.bad{border-left-color:var(--down)}
.toast.rumor{border-left-color:var(--news-rumor)}
.toast.geo{border-left-color:var(--news-geo)}
.toast b{display:block;font-size:11px;color:var(--dim-2);margin-bottom:2px;letter-spacing:.5px;font-weight:400}
@keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

/* Overlay */
.ov{
  position:fixed;inset:0;background:var(--bg-ov);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;
}
.ov.hide{display:none}
.card{
  background:var(--card);border:1px solid var(--card-line);border-radius:11px;padding:28px 32px;max-width:660px;width:100%;
  box-shadow:0 24px 70px var(--card-shadow);color:var(--txt);
}
.card h1{font-size:26px;color:var(--gold);letter-spacing:3px;margin-bottom:6px;font-weight:700}
.card .sub{font-size:12.5px;color:var(--dim-2);line-height:1.9;margin-bottom:20px}
.card h3{font-size:13px;color:var(--txt-2);margin:18px 0 9px;letter-spacing:1px;font-weight:600}
.rules{font-size:12.5px;color:var(--txt);line-height:2}
.rules b{color:var(--strong);font-weight:600}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:8px 0 4px}
.diff{

function pushNews(o){ S.news.unshift(o); if(S.news.length>400) S.news.pop(); S.newsToday.push(o); }

function makeNews(st){
  const diff=st.diff;
  const badW=diff.badBias;
  const roll=rnd();
  // 6% 谣言 / 6% 地缘 / 26% 宏观 / 24% 行业 / 38% 个股
  if(roll<0.06){
    const r=pick(NEWS_RUMOR);
    const real=rnd()<r.gg;
    const code=pick(DEFS).code;
    const s=st.stocks[code];
    s.shocks.push({amt:r.amt*(0.75+rnd()*0.5), left:2});
    st.fundDrift+=70;
    const n={day:st.day,kind:'rumor',scope:'stock',code:code,
      text:'【'+BY_CODE[code].name+'】'+r.t, rumor:true, real:real};
    pushNews(n);
    toast('rumor','市场传言',n.text);
    // 谣言：2-4 天后辟谣
    if(!real){
      st.pending.push({day:st.day+2+Math.floor(rnd()*3),code:code,amt:-r.amt*1.15,text:'【辟谣】'+BY_CODE[code].name+'：相关市场传闻不属实，公司生产经营一切正常'});
    }
    return;
  }
  if(roll<0.12){
    // 局势紧绷到极点时，斡旋与缓和消息更容易出现
    const pool=(st.geoTen||0)>1.4 ? NEWS_GEO.filter(x=>x.geo<0 || rnd()<0.30) : NEWS_GEO;
    const t=pick(pool); if(!t) return;
    const base=Math.abs(t.amt);
    if(t.hot) DEFS.filter(d=>d.sector===t.hot).forEach(d=>{
      st.stocks[d.code].shocks.push({amt:base*(1.2+rnd()*0.9),left:t.d});
    });
    if(t.hurt) DEFS.filter(d=>d.sector===t.hurt).forEach(d=>{
      st.stocks[d.code].shocks.push({amt:-base*(0.8+rnd()*0.6),left:t.d});
    });
    st.fundDrift += (t.fund||0)*(0.8+rnd()*0.5)*0.30;
    st.geoTen = clamp((st.geoTen||0) + t.geo*(0.75+rnd()*0.5), 0, 3.0);
    st.sentiment = clamp((st.sentiment||0) + (t.geo>0?-1:1)*0.10*(0.7+rnd()*0.6), -1.5, 1.5);
    if(t.hot) setHot(st, t.hot, t.d+1);
    const n={day:st.day,kind:'geo',scope:'geo',text:t.t,geoUp:t.geo>0,hot:t.hot||null,hurt:t.hurt||null};
    pushNews(n);
    toast('geo', t.geo>0?'地缘 · 局势升温':'地缘 · 局势缓和', t.t);
    if(t.follow){
      st.pending.push({day:st.day+2+Math.floor(rnd()*3), geo:true, text:t.follow,
        fHot:t.fHot||null, fAmt:t.fAmt||0, fGeo:t.fGeo||0, fFund:t.fFund||0, fd:3});
    }
    return;
  }
  if(roll<0.38){
    const pool=NEWS_MACRO.filter(x=> x.g>0 ? rnd()<1 : rnd()<badW);
    const t=pick(pool); if(!t) return;
    const mag=t.amt*(0.75+rnd()*0.6)*0.6;
    DEFS.forEach(d=>{ st.stocks[d.code].shocks.push({amt:mag*SECTORS[d.sector].beta*(0.7+rnd()*0.5),left:t.d}); });
    st.fundDrift+=(t.fund||0)*(0.7+rnd()*0.6)*0.25;
    if(t.hot) setHot(st,t.hot,t.d+2);
    const n={day:st.day,kind:'macro',scope:'market',text:t.t};
    pushNews(n);
    if(Math.abs(mag)>0.016) toast('macro', t.g>0?'宏观利好':'宏观利空', t.t);
    return;
  }
  if(roll<0.62){
    const pool=NEWS_SECTOR.filter(x=> x.g>0 ? rnd()<1 : rnd()<badW);
    const t=pick(pool); if(!t) return;
    const mag=t.amt*(0.7+rnd()*0.65)*0.8;
    DEFS.filter(d=>d.sector===t.sec).forEach(d=>{ st.stocks[d.code].shocks.push({amt:mag*(0.65+rnd()*0.7),left:t.d}); });
    setHot(st,t.sec,t.d+1);
    const n={day:st.day,kind:'sector',scope:'sector',sec:t.sec,
      text:'['+SECTORS[t.sec].name+'] '+t.t};
    pushNews(n);
    if(Math.abs(mag)>0.026) toast(t.g>0?'good':'bad', SECTORS[t.sec].name, t.t);
    return;
  }
  const pool=NEWS_STOCK.filter(x=> x.g>0 ? rnd()<1 : rnd()<badW);
  const t=pick(pool); if(!t) return;
  const code=pick(DEFS).code, s=st.stocks[code];
  const mag=t.amt*(0.7+rnd()*0.65);
  s.shocks.push({amt:mag,left:t.d});
  s.flow+= t.g>0?0.9:-0.9;
  const n={day:st.day,kind:t.g>0?'good':'bad',scope:'stock',code:code,
    text:'【'+BY_CODE[code].name+'】'+t.t};
  pushNews(n);
  toast(t.g>0?'good':'bad', BY_CODE[code].name, t.t);
}

function setHot(st,sec,left){ st.hot=sec; st.hotLeft=left; }

/* =======================================================================
   模拟引擎
   ======================================================================= */
function stepDay(){
  const st=S;
  st.day++;
  if(st.day>st.maxDay){
    st.day=st.maxDay; st.over=true;
    renderTop(); showResult(false); return;
  }
  st.newsToday=[];

  /* --- 1. 主盘资金量（核心水位） --- */
  const fv=st.diff.fundVol;
  st.fund += (12000-st.fund)*0.075 + gauss()*240*fv + st.fundDrift;
  st.fundDrift*=0.55;
  if(Math.abs(st.fundDrift)<10) st.fundDrift=0;
  st.fund=clamp(st.fund,4500,26000);
  st.fundHist.push(st.fund);
  if(st.fundHist.length>140) st.fundHist.shift();

  const fundMA=avg(st.fundHist.slice(-25));
  const liquidity=st.fund/fundMA-1;          // 流动性溢价 / 折价
  const fundLevel=(st.fund-12000)/12000;     // 绝对水位

  /* --- 2. 市场情绪（反馈项） --- */
  const sentShock=liquidity*5 + fundLevel*1.2 + gauss()*0.20;
  st.sentiment=clamp((st.sentiment||0)*0.90 + sentShock*0.30, -1.5, 1.5);

  /* --- 2.5 地缘紧张度（衰减 + 记录） --- */
  st.geoTen=clamp((st.geoTen||0)*0.93, 0, 3.0);
  if(st.geoTen>1.5) st.geoTen-=0.10;   // 局势越紧张，外交斡旋压力越大
  if(st.geoTen>2.3) st.geoTen-=0.12;
  if(st.geoTen<0.02) st.geoTen=0;
  if(!st.geoLog) st.geoLog=[];
  st.geoLog.push(st.geoTen);
  if(st.geoLog.length>140) st.geoLog.shift();
  const geoDrag = -st.geoTen*0.0011;
  const geoVol  = 1 + st.geoTen*0.16;

  /* --- 3. 利率压制 --- */
  st.rate=clamp(st.rate + gauss()*0.02, 1.4, 5.2);
  const rateDrag=-(st.rate-2.60)*0.0018;

  /* --- 4. 大盘收益（资金水位 + 情绪 + 估值锚回归） --- */
  const idxFair=1000*Math.pow(1.00055, st.day);
  let mkt = 0.00035
          + liquidity*0.18*(1+fundLevel*0.15)
          + st.sentiment*0.0032
          + rateDrag
          + geoDrag
          + Math.log(idxFair/st.index)*0.012
          + gauss()*0.0068*st.diff.volMul*geoVol;
  mkt=clamp(mkt,-0.035,0.035);
  st.index*=(1+mkt);
  st.indexHist.push(st.index);

  /* --- 5. 行业轮动 --- */
  st.hotLeft--;
  if(st.hotLeft<=0){
    const keys=SEC_KEYS.filter(k=>k!==st.hot);
    st.hot=pick(keys);
    st.hotLeft=4+Math.floor(rnd()*7);
  }

  /* --- 6. 延迟事件（辟谣等） --- */
  for(let i=st.pending.length-1;i>=0;i--){
    const p=st.pending[i];
    if(p.day<=st.day){
      if(p.geo){
        st.geoTen=clamp((st.geoTen||0)+(p.fGeo||0), 0, 3.0);
        if(p.fHot){
          DEFS.filter(d=>d.sector===p.fHot).forEach(d=>{
            st.stocks[d.code].shocks.push({amt:Math.abs(p.fAmt||0.015)*(0.85+rnd()*0.6),left:p.fd||3});
          });
          setHot(st,p.fHot,(p.fd||3)+1);
        }
        st.fundDrift += (p.fFund||0)*0.35;
        pushNews({day:st.day,kind:'geo',scope:'geo',text:p.text,geoUp:(p.fGeo||0)>0,hot:p.fHot||null,hurt:null});
        toast('geo','地缘 · 局势演进',p.text);
        st.pending.splice(i,1);
        continue;
      }
      const s=st.stocks[p.code];
      if(s){ s.shocks.push({amt:p.amt,left:3}); s.flow-=1.1; }
      const n={day:st.day,kind:'bad',scope:'stock',code:p.code,text:p.text};
      pushNews(n); toast('bad','消息证伪',p.text);
      st.pending.splice(i,1);
    }
  }

  /* --- 7. 逐股定价 --- */
  DEFS.forEach(d=>{
    const s=st.stocks[d.code], sec=SECTORS[d.sector];
    // 新闻余波
    let shockAmt=0;
    for(let i=s.shocks.length-1;i>=0;i--){
      const sh=s.shocks[i];
      shockAmt+=sh.amt;
      sh.amt*=0.42; sh.left--;
      if(sh.left<=0) s.shocks.splice(i,1);
    }
    // 主力资金
    s.flow = s.flow*0.86 + gauss()*0.34;
    s.flow = clamp(s.flow,-2.2,2.2);
    const flowPush = s.flow*0.0042;

    // 行业轮动加成
    const hotPush = (d.sector===st.hot? 0.0022 : -0.0006);

    // 地缘紧张度：能源/军工获避险溢价，消费/金融/汽车承压
    const geopush = (d.sector==='energy'||d.sector==='defense') ? st.geoTen*0.0010
                  : (d.sector==='cons'||d.sector==='bank'||d.sector==='auto') ? -st.geoTen*0.0006 : 0;

    // 流动性对高估值股的影响更明显
    const valDrag = (d.pe/40)*liquidity*0.045;

    const fair=d.price*Math.pow(1+d.alpha, st.day);
    let r = sec.beta*mkt + shockAmt + flowPush + hotPush + geopush + valDrag
          + (s.earnings||0)*0.0012
          + Math.log(fair/s.price)*0.018
          + gauss()*sec.vol*st.diff.volMul*0.85;

    // 涨跌停
    r=clamp(r,-0.0995,0.0995);

    const prev=s.price;
    const next=Math.max(0.60, prev*(1+r));
    const o = prev*(1+clamp(gauss()*sec.vol*0.45,-0.05,0.05));
    s.prevClose=prev;
    s.open=o;
    s.price=next;
    s.high=Math.max(o,next)*(1+Math.abs(gauss())*sec.vol*0.45);
    s.low =Math.min(o,next)*(1-Math.abs(gauss())*sec.vol*0.45);
    s.vol = clamp((0.55+liquidity*1.2+Math.abs(r)*9)*(0.6+rnd()*0.9),0.15,6);
    s.hist.push({d:st.day-1,o:o,h:s.high,l:s.low,c:next,v:s.vol});
    if(s.hist.length>200) s.hist.shift();
  });

  /* --- 8. 融资利息 --- */
  if(st.debt>0){
    const int=st.debt*0.00055;
    if(st.cash>=int){ st.cash-=int; }
    else { st.debt+=(int-st.cash); st.cash=0; }
    st.blotter.unshift({day:st.day,txt:'融资利息',amt:-int,c:'d'});
    if(st.blotter.length>200) st.blotter.pop();
  }

  /* --- 8.5 季度财报（每30天一期） --- */
  if(st.day===16 || st.day===46 || st.day===76){
    let sup=0, miss=0, hotOne=null, badOne=null;
    DEFS.forEach(d=>{
      const s=st.stocks[d.code];
      const g=gauss();
      s.earnings=g;
      s.shocks.push({amt:clamp(g*0.030,-0.085,0.085),left:2});
      s.flow+=g*0.5;
      if(g>0.85){ sup++; if(!hotOne) hotOne={d:d,g:g}; }
      if(g<-0.85){ miss++; if(!badOne) badOne={d:d,g:g}; }
    });
    if(hotOne){
      const nm=hotOne.d.name, gr=(8+hotOne.g*32).toFixed(1);
      pushNews({day:st.day,kind:'good',scope:'stock',code:hotOne.d.code,
        text:'【财报季】'+nm+'发布季报，净利润同比增长 '+gr+'%，大幅超出市场预期'});
      toast('good','财报季 · 超预期',nm+' 净利同比 +'+gr+'%');
    }
    if(badOne){
      const nm=badOne.d.name, gr=Math.abs(8+badOne.g*32).toFixed(1);
      pushNews({day:st.day,kind:'bad',scope:'stock',code:badOne.d.code,
        text:'【财报季】'+nm+'发布季报，净利润同比下滑 '+gr+'%，低于市场预期'});
      toast('bad','财报季 · 不及预期',nm+' 净利同比 -'+gr+'%');
    }
    pushNews({day:st.day,kind:'neutral',scope:'market',
      text:'【财报季】本季上市公司财报集中披露：'+sup+' 家业绩超预期，'+miss+' 家不及预期。业绩因子将在未来数周持续影响股价。'});
  }

  /* --- 9. 新闻生成（快讯高频：每天 2~6 条，紧张时期再加密） --- */
  const nr=rnd();
  let n = nr<0.06?2 : nr<0.26?3 : nr<0.60?4 : nr<0.86?5 : 6;
  if(st.geoTen>1.6) n+=1;              // 局势高危期消息更密集
  for(let i=0;i<n;i++) makeNews(st);

  /* --- 9.5 风格追踪（仓位 / 集中度 / 杠杆） --- */
  trackStyle(st);

  /* --- 10. 爆仓判定 --- */
  if(totalAssets()<0){ st.over=true; showResult(true); return; }
}

/* ---------- 资产计算 ---------- */
function holdValue(){ let v=0; DEFS.forEach(d=>{ const s=S.stocks[d.code]; if(s.shares) v+=s.shares*s.price; }); return v; }

/* ---------- 投资风格追踪 ---------- */
function trackStyle(st){
  const ta=totalAssets(), hv=holdValue();
  if(ta>0){
    st.posSum=(st.posSum||0)+clamp(hv/ta,0,3);
    st.posDays=(st.posDays||0)+1;
    let cnt=0,mx=0;
    DEFS.forEach(d=>{
      const s=st.stocks[d.code], v=(s.shares||0)*s.price;
      if(v>0){ cnt++; if(v/ta>mx) mx=v/ta; }
    });
    if(mx>(st.maxConc||0)) st.maxConc=mx;
    if(cnt>(st.maxPosCnt||0)) st.maxPosCnt=cnt;
  }
  if(st.debt>(st.maxDebt||0)) st.maxDebt=st.debt;
}

/* 每只票一局的总盈亏 = 已实现 + 当前浮盈 */
function stockPL(code){
  const s=S.stocks[code];
  const re=(S.realized&&S.realized[code])||0;
  const un=(s.shares||0)*(s.price-(s.cost||0));
  return {re:re, un:un, total:re+un, held:(s.shares||0)>0, sh:s.shares||0};
}
function topPicks(n){
  const codes=Object.keys(S.tradedStk||{});
  return codes.map(c=>({code:c,d:BY_CODE[c],basis:(S.basis&&S.basis[c])||0,pl:stockPL(c)}))
    .filter(x=>x.d)
    .sort((a,b)=>b.pl.total-a.pl.total)
    .slice(0,n===undefined?3:n);
}
/* 投资风格画像 */
function styleProfile(){
  const st=S;
  const trades=st.trades||0;
  const nStk=Object.keys(st.tradedStk||{}).length;
  const nSec=Object.keys(st.tradedSec||{}).length;
  const avgPos = st.posDays? st.posSum/st.posDays : 0;
  const lev = st.maxDebt/st.startCash;
  const conc = st.maxConc||0;
  const picks=topPicks(999);
  const winN=picks.filter(p=>p.pl.total>0).length;
  const winRate = picks.length? winN/picks.length : 0;

  let main,desc;
  if(lev>=0.6)                    { main='杠杆冲锋派'; desc='习惯借钱加仓。方向对了赚得凶，回撤也来得快，仓位一旦打穿就出局。'; }
  else if(trades>=70)             { main='高频短线客'; desc='进出极为频繁，靠盘中的波动找机会；手续费和滑点是一笔实打实的支出。'; }
  else if(conc>=0.55 && nStk<=6)  { main='单票狙击手'; desc='敢把身家压在一两只票上。赢的时候很漂亮，输的时候也很彻底。'; }
  else if(avgPos>=0.82)           { main='满仓压舱派'; desc='常年满仓、几乎不留现金，完全靠方向判断吃饭。'; }
  else if(avgPos<=0.25)           { main='现金为王派'; desc='仓位一直很轻，宁可少赚也不愿多担风险，出手很挑。'; }
  else if(trades<=8 && avgPos>=0.45){ main='佛系长持派'; desc='出手极少，买了就放着，不为一两天的波动折腾。'; }
  else if(nSec>=8)                { main='分散配置派'; desc='行业铺得很开，靠组合摊薄单一赛道的风险。'; }
  else if(nStk<=5 && nSec<=3)     { main='精选赛道派'; desc='只在自己看得懂的少数赛道里下注，不熟的不碰。'; }
  else                            { main='均衡操盘手'; desc='仓位、行业和节奏都拿捏得比较均衡，攻守都有。'; }

  const tr=[];
  if(lev>=0.3)            tr.push('常用杠杆');
  if(trades>=45)          tr.push('换手极快');
  else if(trades<=10&&trades>0) tr.push('低频操作');
  if(conc>=0.45)          tr.push('峰值重仓');
  if(nSec>=8)             tr.push('行业分散');
  if(nStk<=5 && nStk>0 && nSec<=3) tr.push('专注少数赛道');
  if(avgPos>=0.80)        tr.push('常年满仓');
  else if(avgPos<=0.30)   tr.push('仓位保守');
  if(picks.length>=3 && winRate>=0.6) tr.push('选股精准');
  else if(picks.length>=3 && winRate<=0.35) tr.push('选股偏弱');
  if(st.over && totalAssets()<0) tr.push('爆仓出局');

  /* 主标签对应的特征词排在最前，避免出现"分散配置派 / 持仓集中"这种自相矛盾的读感 */
  const MAIN_TRAIT={
    '杠杆冲锋派':'常用杠杆','高频短线客':'换手极快','单票狙击手':'峰值重仓',
    '满仓压舱派':'常年满仓','现金为王派':'仓位保守','佛系长持派':'低频操作',
    '分散配置派':'行业分散','精选赛道派':'专注少数赛道','均衡操盘手':'节奏平稳'
  };
  const lead=MAIN_TRAIT[main]||'节奏平稳';
  const merged=[lead].concat(tr.filter(t=>t!==lead));
  if(merged.length===1 && lead==='节奏平稳') merged.push('攻守均衡');

  return {main:main, desc:desc, traits:merged.slice(0,4),
    avgPos:avgPos, lev:lev, conc:conc, nStk:nStk, nSec:nSec, winRate:winRate,
    traded:picks.length, winN:winN};
}
function totalAssets(){ return S.cash + holdValue() - S.debt; }
function totalReturn(){ return totalAssets()/S.startCash - 1; }

/* ---------- 行业统计 ---------- */
function secStats(){
  const out={};
  SEC_KEYS.forEach(k=>{
    const ds=DEFS.filter(d=>d.sector===k);
    let s1=0,c1=0,s5=0,c5=0, up=0;
    ds.forEach(d=>{
      const st=S.stocks[d.code], h=st.hist, n=h.length;
      if(st.prevClose){ const ch=st.price/st.prevClose-1; s1+=ch; c1++; if(ch>0) up++; }
      const back=h[Math.max(0,n-6)];
      if(back && back.c){ s5+=st.price/back.c-1; c5++; }
    });
    out[k]={chg: c1? s1/c1 : 0, chg5: c5? s5/c5 : 0, n:ds.length, up:up};
  });
  return out;
}

/* ---------- 交易成本 ---------- */
function tradeCost(amount, isSell){
  const comm=Math.max(5, amount*0.0003);
  const stamp=isSell? amount*0.001 : 0;
  return {comm:comm, stamp:stamp, total:comm+stamp};
}
function slippage(){
  const fundMA=avg(S.fundHist.slice(-20));
  const liq=S.fund/fundMA-1;
  return clamp(0.0009 - liq*0.0022, 0.0002, 0.004);
}

function doBuy(code, shares){
  const st=S, s=st.stocks[code], d=BY_CODE[code];
  shares=Math.floor(shares);
  if(!shares||shares<=0) return toast('','交易失败','请输入有效数量');
  const px=s.price*(1+slippage());
  const amount=px*shares;
  const c=tradeCost(amount,false);
  if(amount+c.total > st.cash) return toast('','资金不足','需要 '+fmt(amount+c.total,0)+' 元，可用 '+fmt(st.cash,0)+' 元');
  st.cash-=amount+c.total;
  const oldSh=s.shares||0;
  s.cost=((s.cost||0)*oldSh + amount+c.total)/(oldSh+shares);
  s.shares=oldSh+shares;
  st.trades=(st.trades||0)+1;
  st.fees=(st.fees||0)+c.total;
  st.tradedStk=st.tradedStk||{}; st.tradedStk[code]=(st.tradedStk[code]||0)+1;
  st.tradedSec=st.tradedSec||{}; st.tradedSec[d.sector]=true;
  st.basis=st.basis||{}; st.basis[code]=(st.basis[code]||0)+amount+c.total;
  st.blotter.unshift({day:st.day,txt:'买入 '+d.name,amt:-(amount+c.total),c:'d',sh:shares,px:px});
  if(st.blotter.length>200) st.blotter.pop();
}
function doSell(code, shares){
  const st=S, s=st.stocks[code], d=BY_CODE[code];
  shares=Math.floor(shares);
  const have=s.shares||0;
  if(!shares||shares<=0) return toast('','交易失败','请输入有效数量');
  if(shares>have) return toast('','持仓不足','当前持有 '+have+' 股');
  const px=s.price*(1-slippage());
  const amount=px*shares;
  const c=tradeCost(amount,true);
  st.cash+=amount-c.total;
  const basis=(s.cost||0)*shares;              // 含买入手续费的持仓成本
  const gain=amount-c.total-basis;
  s.realized=(s.realized||0)+gain;
  st.realized=st.realized||{}; st.realized[code]=(st.realized[code]||0)+gain;
  st.fees=(st.fees||0)+c.total;
  s.shares=have-shares;
  if(s.shares===0){ s.cost=0; }
  st.trades=(st.trades||0)+1;
  st.blotter.unshift({day:st.day,txt:'卖出 '+d.name,amt:amount-c.total,c:'g',sh:shares,px:px});
  if(st.blotter.length>200) st.blotter.pop();
}
function maxBuy(code){
  const s=S.stocks[code];
  const px=s.price*(1+slippage());
  const c=tradeCost(px*100,false);
  return Math.floor((S.cash-c.total)/(px*1.0004)/100)*100;
}
function finance(amount){
  const st=S;
  amount=Math.floor(amount);
  if(!amount||amount<=0) return;
  const cap=Math.max(0,(st.cash+holdValue())*0.85 - st.debt);
  if(amount>cap) return toast('','额度不足','当前可融资上限 '+fmt(cap,0)+' 元');
  st.cash+=amount; st.debt+=amount;
  st.blotter.unshift({day:st.day,txt:'融资借入',amt:amount,c:'g'});
  if(st.blotter.length>200) st.blotter.pop();
}
function repay(amount){
  const st=S;
  amount=Math.floor(amount);
  if(!amount||amount<=0) return;
  const real=Math.min(amount, st.debt, st.cash);
  if(real<=0) return toast('','无法还款','现金或负债不足');
  st.cash-=real; st.debt-=real;
  st.blotter.unshift({day:st.day,txt:'偿还融资',amt:-real,c:'d'});
  if(st.blotter.length>200) st.blotter.pop();
}

function toast(kind,title,body){
  const el=document.createElement('div');

  el.innerHTML='<b>'+esc(title)+'</b>'+esc(body);
  $('toasts').appendChild(el);

function renderChart(){
  const d=BY_CODE[sel], s=S.stocks[sel];
  const sec=SECTORS[d.sector];
  const chg=s.prevClose? s.price/s.prevClose-1:0;
  const T=themeColors();
  $('chartTitle').innerHTML=d.name+' <span style="color:var(--dim-4);font-size:11px">'+d.code+'</span>';
  $('chartSub').textContent=sec.name+' · '+s.price.toFixed(2)+' ('+sp(chg*100)+') · 市值'+d.cap+'亿 · PE '+d.pe;

  const cv=$('cv'), wrap=$('chartWrap');
  const dpr=window.devicePixelRatio||1;
  const W=wrap.clientWidth, H=wrap.clientHeight;
  if(W<10||H<10) return;
  cv.width=W*dpr; cv.height=H*dpr;
  const g=cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,W,H);

  const data=s.hist;
  const n=data.length;
  const padL=8,padR=64,padT=14,padB=22;
  const volH=Math.max(30,H*0.18);
  const priceH=H-padT-padB-volH-16;
  const cw=(W-padL-padR)/Math.max(n,1);

  if(n<2){ $('tip').style.display='none'; return; }

  let hi=-Infinity, lo=Infinity, vmax=0;
  for(const k of data){ hi=Math.max(hi,k.h); lo=Math.min(lo,k.l); vmax=Math.max(vmax,k.v); }
  const pad=(hi-lo)*0.08||1;
  hi+=pad; lo-=pad;

  const y=p=>padT+(hi-p)/(hi-lo)*priceH;
  const x=i=>padL+cw*i+cw/2;

  // 网格
  g.strokeStyle=T.grid; g.lineWidth=1;
  g.font='10px Consolas,monospace'; g.textAlign='left';
  for(let i=0;i<=4;i++){
    const yy=padT+priceH*i/4;
    g.beginPath(); g.moveTo(padL,yy); g.lineTo(W-padR,yy); g.stroke();
    const pv=hi-(hi-lo)*i/4;
    g.fillStyle=T.label; g.fillText(pv.toFixed(2), W-padR+7, yy+3.5);
  }
  g.strokeStyle=T.axis;
  g.beginPath(); g.moveTo(padL,padT+priceH); g.lineTo(W-padR,padT+priceH); g.stroke();
  g.beginPath(); g.moveTo(padL,padT+priceH+8+volH); g.lineTo(W-padR,padT+priceH+8+volH); g.stroke();
  g.fillStyle=T.label; g.fillText('VOL', W-padR+7, padT+priceH+18);

  // 成交量
  for(let i=0;i<n;i++){
    const k=data[i], up=k.c>=k.o;
    const bh=vmax? (k.v/vmax)*(volH-6):0;
    g.fillStyle= up? T.volUp : T.volDown;
    g.fillRect(x(i)-Math.max(cw*0.32,1), padT+priceH+8+volH-bh-1, Math.max(cw*0.64,2), bh);
  }

  // 蜡烛
  const bw=Math.max(cw*0.62,1.4);
  for(let i=0;i<n;i++){
    const k=data[i], up=k.c>=k.o;
    const col= up? T.up : T.down;
    g.strokeStyle=col; g.fillStyle=col; g.lineWidth=1;
    g.beginPath(); g.moveTo(x(i),y(k.h)); g.lineTo(x(i),y(k.l)); g.stroke();
    const y1=y(Math.max(k.o,k.c)), y2=y(Math.min(k.o,k.c));
    g.fillRect(x(i)-bw/2, y1, bw, Math.max(y2-y1,1));
  }

  // 均线
  const ma=(len,col)=>{
    g.strokeStyle=col; g.lineWidth=1.2; g.beginPath(); let started=false;
    for(let i=0;i<n;i++){
      if(i<len-1) continue;
      let sum=0; for(let j=i-len+1;j<=i;j++) sum+=data[j].c;
      const v=sum/len;
      if(!started){ g.moveTo(x(i),y(v)); started=true; } else g.lineTo(x(i),y(v));
    }
    g.stroke();
  };
  if(n>=5) ma(5,T.ma5);
  if(n>=20) ma(20,T.ma20);

  // 成本线
  if(s.shares&&s.cost){
    g.strokeStyle=T.cost; g.setLineDash([4,4]); g.lineWidth=1;
    const cy=y(s.cost);
    if(cy>padT&&cy<padT+priceH){ g.beginPath(); g.moveTo(padL,cy); g.lineTo(W-padR,cy); g.stroke(); }
    g.setLineDash([]);
  }

  // 十字光标
  if(hover>=0 && hover<n){
    const k=data[hover];
    g.strokeStyle=T.cross; g.setLineDash([3,3]); g.lineWidth=1;
    g.beginPath(); g.moveTo(x(hover),padT); g.lineTo(x(hover),padT+priceH); g.stroke();
    g.beginPath(); g.moveTo(padL,y(k.c)); g.lineTo(W-padR,y(k.c)); g.stroke();
    g.setLineDash([]);
    const t=$('tip');
    t.style.display='block';
    const lw=190;
    let lx=x(hover)+14; if(lx+lw>W) lx=x(hover)-lw-14;
    t.style.left=Math.max(4,lx)+'px';
    t.style.top=Math.max(4,y(k.c)-40)+'px';
    const pv=data[hover-1]? data[hover-1].c : k.o;
    const cc=k.c/pv-1;
    t.innerHTML='<b>第 '+(k.d+1)+' 日</b><br>'+
      '开 '+k.o.toFixed(2)+'  高 '+k.h.toFixed(2)+'<br>'+
      '低 '+k.l.toFixed(2)+'  收 <b>'+k.c.toFixed(2)+'</b><br>'+
      '<span class="'+cls(cc)+'">'+(cc>=0?'▲':'▼')+' '+sp(cc*100)+'</span>　量 '+k.v.toFixed(2);
  } else { $('tip').style.display='none'; }

  // 最新价标签
  const last=data[n-1];
  const ly=y(last.c);
  g.fillStyle= last.c>=last.o? T.up : T.down;
  g.fillRect(W-padR+2, ly-8, 58, 16);
  g.fillStyle=T.tag; g.font='bold 11px Consolas,monospace'; g.textAlign='left';
  g.fillText(last.c.toFixed(2), W-padR+7, ly+4);

  const labels=[['MA5',T.ma5],['MA20',T.ma20]];
  g.font='10px Consolas,monospace';
  labels.forEach((L,i)=>{ g.fillStyle=L[1]; g.fillText(L[0], padL+6+i*42, padT+10); });
}

function bindChart(){
  const wrap=$('chartWrap');
  wrap.addEventListener('mousemove',e=>{
    const s=S.stocks[sel];
    const r=wrap.getBoundingClientRect();
    const W=r.width, padL=8, padR=64;
    const n=s.hist.length, cw=(W-padL-padR)/Math.max(n,1);
    const i=Math.floor((e.clientX-r.left-padL)/cw);
    const nh=i>=0&&i<n? i : -1;
    if(nh!==hover){ hover=nh; renderChart(); }
  });
  wrap.addEventListener('mouseleave',()=>{ if(hover!==-1){ hover=-1; renderChart(); } });
}

function heldMaps(){
  const byCode={}, bySec={};
  DEFS.forEach(d=>{ if((S.stocks[d.code].shares||0)>0){ byCode[d.code]=true; bySec[d.sector]=true; } });
  return {byCode:byCode, bySec:bySec};
}
function newsHitHold(n, hm){
  if(n.scope==='stock' || n.kind==='rumor') return !!hm.byCode[n.code];
  if(n.scope==='sector') return !!hm.bySec[n.sec];
  if(n.scope==='geo')    return !!((n.hot && hm.bySec[n.hot]) || (n.hurt && hm.bySec[n.hurt]));
  return false;                       // 宏观 / 全市场消息不属于"自己持仓的新闻"
}

function renderNews(){
  const hm=heldMaps();
  const nHeld=Object.keys(hm.byCode).length;
  const src = onlyHold ? S.news.slice(0,320) : S.news.slice(0,90);
  let h='', shown=0;
  src.forEach(n=>{
    if(onlyHold && !newsHitHold(n,hm)) return;
    shown++;
    const c= n.kind==='geo'? 'geo'
           : n.rumor?'rumor'
           : (n.kind==='macro'?'macro':n.kind==='good'?'good':n.kind==='bad'?'bad':'neutral');
    const badge= n.kind==='geo'? '<span class="nbadge geo">'+(n.geoUp===false?'缓和':'地缘')+'</span>'
               : n.scope==='market'? '<span class="nbadge macro">宏观</span>'
               : n.rumor? '<span class="nbadge rumor">传言</span>'
               : n.scope==='sector'? '<span class="nbadge">'+SECTORS[n.sec].name+'</span>'
               : '<span class="nbadge">'+BY_CODE[n.code].name+'</span>';
    h+='<div class="nrow '+c+'"><span class="d">D'+n.day+'</span><span class="t">'+esc(n.text)+'</span>'+badge+'</div>';
  });
  $('newsList').innerHTML= h || (onlyHold
      ? '<div class="news-none">'+(nHeld
          ? '暂无与你持仓相关的快讯<br><span style="font-size:10.5px">个股消息、所属行业消息、以及波及该行业的地缘消息才会显示</span>'
          : '当前没有持仓<br><span style="font-size:10.5px">买入之后，这里只留下该股及其所属行业的快讯</span>')
        +'</div>'
      : '<div class="empty">暂无消息</div>');

  $('newsTag').textContent = onlyHold ? ('持仓 '+nHeld+' 只 · 命中 '+shown+' 条') : '突发 / 地缘 / 传闻';
  const lbl=$('onlyHoldLbl'); if(lbl) lbl.classList.toggle('on',onlyHold);

  });
  $('blotter').innerHTML= b|| '<div class="empty">暂无成交</div>';
}

function rank(r){
  if(r<=-0.99) return ['爆 仓 出 局','var(--down)'];
  if(r<-0.35)  return ['亏损惨重','#4fdba0'];
  if(r<-0.05)  return ['韭菜本菜','#7fd6a8'];
  if(r<0.05)   return ['原地踏步','#93a7bd'];
  if(r<0.15)   return ['略有盈余','#7fd6a8'];
  if(r<0.35)   return ['稳健操盘手','#7fc4ff'];
  if(r<0.80)   return ['金牌基金经理','var(--gold)'];
  if(r<2.00)   return ['华尔街之狼','#ff8a3d'];
  return ['一 代 股 神','var(--up)'];
}

  pushNews({day:1,kind:'neutral',scope:'market',text:'【开盘】'+diff.name+'模式启动，账户初始资金 '+fmt(diff.cash,0)+' 元。'+N_STOCK+' 只标的、'+SEC_KEYS.length+' 个行业，90 个交易日后见分晓。'});
  $('ov').classList.add('hide');
  $('toasts').innerHTML='';
  bindChart();
  renderAll();
  window.addEventListener('resize',()=>renderChart());
}

/* ---------- 存档 ---------- */
function hasSave(){ try{ return !!localStorage.getItem(LS_KEY); }catch(e){ return false; } }
function saveGame(){
  try{
    const c=JSON.parse(JSON.stringify(S));
    c.diff=null;
    localStorage.setItem(LS_KEY,JSON.stringify({s:c,dk:S.diff.key}));
    toast('','已存档','本局进度已保存到本机浏览器');
  }catch(e){ toast('','存档失败','当前浏览器环境不支持本地存储'); }
}
function loadGame(){
  try{
    const raw=JSON.parse(localStorage.getItem(LS_KEY));
    if(!raw) return;
    const st=raw.s; st.diff=DIFFS[raw.dk]||DIFFS.normal;
    DEFS.forEach(d=>{ if(!st.stocks[d.code]) return; st.stocks[d.code].def=d; });
    // 兼容旧档：补齐缺失标的
    DEFS.forEach(d=>{
      if(!st.stocks[d.code]){
        st.stocks[d.code]={def:d,price:d.price,prevClose:d.price,open:d.price,high:d.price,low:d.price,
          hist:[{d:0,o:d.price,h:d.price,l:d.price,c:d.price,v:0}],flow:gauss()*0.4,shocks:[],vol:1,earnings:0,halt:0};
      }
      if(!st.stocks[d.code].hist || !st.stocks[d.code].hist.length)
        st.stocks[d.code].hist=[{d:0,o:d.price,h:d.price,l:d.price,c:d.price,v:0}];
    });
    S=st; sel='600886'; hover=-1; secFilter='all';
    if(st.geoTen===undefined) st.geoTen=0;
    if(!st.geoLog) st.geoLog=[];
    // 兼容更早的存档：补齐风格追踪字段
    if(!st.realized)  st.realized={};
    if(!st.basis)     st.basis={};
    if(!st.tradedStk) st.tradedStk={};
    if(!st.tradedSec) st.tradedSec={};
    if(st.maxDebt===undefined)  st.maxDebt=st.debt||0;
    if(st.maxConc===undefined)  st.maxConc=0;
    if(st.posSum===undefined)   st.posSum=0;
    if(st.posDays===undefined)  st.posDays=0;
    if(st.fees===undefined)     st.fees=0;
    if(st.maxPosCnt===undefined) st.maxPosCnt=0;
    SEC_KEYS.forEach(k=>folded[k]=false);
    $('ov').classList.add('hide');
    $('toasts').innerHTML='';
    bindChart();
    renderAll();
    window.addEventListener('resize',()=>renderChart());
  }catch(e){ toast('','读档失败','存档数据已损坏'); }
}

/* =======================================================================
   绑定
   ======================================================================= */
$('btnTheme').onclick=()=>cycleTheme();
$('onlyHold').onchange=function(){
  onlyHold=this.checked;
  try{ localStorage.setItem(NH_KEY, onlyHold?'1':'0'); }catch(e){}
  renderNews();
};
/* 开局页也要反映已保存的偏好，等开局后再由 renderNews 接管 */
(function(){
  const cb=$('onlyHold'); if(cb) cb.checked=onlyHold;
  const lb=$('onlyHoldLbl'); if(lb) lb.classList.toggle('on',onlyHold);
})();
$('btnFoldAll').onclick=()=>{
  const anyOpen=SEC_KEYS.some(k=>!folded[k]);
  SEC_KEYS.forEach(k=>folded[k]=anyOpen);
  $('btnFoldAll').textContent = anyOpen? '展开' : '折叠';
  renderStocks();
};
$('btnNext').onclick=()=>{
  if(!S||S.over) return;
  stepDay();
  renderAll();
};
$('btnReset').onclick=()=>{
  if(S && !confirm('确定要重新开局吗？当前进度将丢失。')) return;
  startScreen();
};
$('btnSave').onclick=()=>{ if(S) saveGame(); };
$('btnFin').onclick=()=>{
  if(!S) return;
  const cap=Math.max(0,(S.cash+holdValue())*0.85 - S.debt);
  const v=prompt('融资借入金额（元）\n日息 0.055%，可借上限 '+fmt(cap,0)+' 元', String(Math.floor(cap/2)));
  if(v===null) return;
  finance(parseFloat(v)||0);
  renderAll();
};
$('btnRepay').onclick=()=>{
  if(!S) return;
  if(S.debt<=0) return toast('','无需还款','当前没有融资负债');
  const v=prompt('偿还金额（元）\n当前负债 '+fmt(S.debt,0)+' 元，可用现金 '+fmt(S.cash,0)+' 元', String(Math.floor(Math.min(S.debt,S.cash))));
  if(v===null) return;
  repay(parseFloat(v)||0);
  renderAll();
};
document.addEventListener('keydown',e=>{
  if(!S) return;
  if(e.target && e.target.tagName==='INPUT') return;
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); $('btnNext').click(); }
  if(e.key==='b'||e.key==='B'){ doBuy(sel,parseFloat($('qty').value)||0); afterTrade(); }
  if(e.key==='s'||e.key==='S'){ doSell(sel,parseFloat($('qty').value)||0); afterTrade(); }
});

initTheme();
startScreen();
</script>
</body>
</html>
